      function drawHistoryList(
        container,
        query,
        filter
      ){
        const text =
          query
            .trim()
            .toLowerCase();

        const now =
          new Date();

        const today =
          new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          ).getTime();

        const yesterday =
          today-86400000;

        const last7 =
          today-(6*86400000);

        const filtered =
          state.history.filter(
            item=>{
              const textMatch =
                !text ||
                (
                  (
                    item.title ||
                    ""
                  ) +
                  " " +
                  (
                    item.url ||
                    ""
                  )
                )
                  .toLowerCase()
                  .includes(text);

              let dateMatch=true;

              if(
                filter==="today"
              ){
                dateMatch =
                  item.timestamp>=today;
              }else if(
                filter==="yesterday"
              ){
                dateMatch =
                  item.timestamp>=yesterday &&
                  item.timestamp<today;
              }else if(
                filter==="7days"
              ){
                dateMatch =
                  item.timestamp>=last7;
              }else if(
                filter==="older"
              ){
                dateMatch =
                  item.timestamp<last7;
              }

              return (
                textMatch &&
                dateMatch
              );
            }
          );

        if(!filtered.length){
          container.innerHTML=`
            <div class="no-data">

              <div class="no-data-icon">
                ◷
              </div>

              <div class="no-data-title">
                No browsing history yet
              </div>

              <div class="no-data-text">
                Pages you visit normally through NOVA will appear here.
              </div>

            </div>
          `;

          return;
        }

        container.innerHTML="";

        filtered.forEach(
          item=>{
            const row =
              document.createElement(
                "div"
              );

            row.className=
              "list-item";

            const icon =
              document.createElement(
                "div"
              );

            icon.className=
              "list-icon";

            const image =
              document.createElement(
                "img"
              );

            image.width=22;
            image.height=22;
            image.alt="";
            image.src =
              item.favicon ||
              faviconFor(item.url) ||
              "";

            image.onerror=()=>{
              image.removeAttribute(
                "src"
              );

              image.alt="◈";
            };

            icon.appendChild(
              image
            );

            const main =
              document.createElement(
                "div"
              );

            main.className=
              "list-main";

            const title =
              document.createElement(
                "div"
              );

            title.className=
              "list-title";

            title.textContent =
              item.title ||
              "Web Page";

            const url =
              document.createElement(
                "div"
              );

            url.className=
              "list-url";

            url.textContent=
              item.url;

            const meta =
              document.createElement(
                "div"
              );

            meta.className=
              "list-meta";

            meta.textContent =
              new Date(
                item.timestamp
              ).toLocaleString();

            main.append(
              title,
              url,
              meta
            );

            const actions =
              document.createElement(
                "div"
              );

            actions.className=
              "list-actions";

            const open =
              iconButton(
                "↗",
                "Open"
              );

            open.addEventListener(
              "click",
              ()=>{
                navigateTo(
                  item.url,
                  {
                    addHistory:false
                  }
                );
              }
            );

            const remove =
              iconButton(
                "×",
                "Delete"
              );

            remove.addEventListener(
              "click",
              ()=>{
                state.history =
                  state.history.filter(
                    h=>h.id!==item.id
                  );

                saveStorage(
                  STORAGE.history,
                  state.history
                );

                renderHistoryPage();

                toast(
                  "History item deleted"
                );
              }
            );

            actions.append(
              open,
              remove
            );

            row.append(
              icon,
              main,
              actions
            );

            container.appendChild(
              row
            );
          }
        );
      }

      function wireSettings(){

        const save =
          (
            key,
            value
          )=>{
            state.settings[key]=value;

            saveStorage(
              STORAGE.settings,
              state.settings
            );

            applyTheme();
            renderCurrentTab();

            toast(
              "Settings saved"
            );
          };

        document
          .getElementById(
            "setHomepage"
          )
          .addEventListener(
            "change",
            event=>{
              const raw =
                event.target.value
                  .trim();

              let value;

              if(
                !raw ||
                raw==="nova://newtab"
              ){
                value=
                  "nova://newtab";
              }else{
                value=
                  normalizeUrl(raw);
              }

              if(value===null){
                event.target.value =
                  state.settings.homepage;

                toast(
                  "Enter a valid homepage URL."
                );

                return;
              }

              save(
                "homepage",
                value
              );
            }
          );

        document
          .getElementById(
            "setStartup"
          )
          .addEventListener(
            "change",
            event =>
              save(
                "startup",
                event.target.value
              )
          );

        document
          .getElementById(
            "setTheme"
          )
          .addEventListener(
            "change",
            event =>
              save(
                "theme",
                event.target.value
              )
          );

        document
          .getElementById(
            "setZoom"
          )
          .addEventListener(
            "change",
            event =>
              save(
                "zoom",
                Number(
                  event.target.value
                )
              )
          );

        document
          .getElementById(
            "setBookmarksBar"
          )
          .addEventListener(
            "change",
            event =>
              save(
                "showBookmarksBar",
                event.target.checked
              )
          );

        document
          .getElementById(
            "setSaveHistory"
          )
          .addEventListener(
            "change",
            event =>
              save(
                "saveHistory",
                event.target.checked
              )
          );

        document
          .getElementById(
            "setSearchProvider"
          )
          .addEventListener(
            "change",
            event =>
              save(
                "searchProvider",
                event.target.value
              )
          );

        document
          .getElementById(
            "setCustomSearch"
          )
          .addEventListener(
            "change",
            event=>{
              state.settings.customSearchUrl =
                event.target.value.trim() ||
                DEFAULT_SETTINGS.customSearchUrl;

              saveStorage(
                STORAGE.settings,
                state.settings
              );

              toast(
                "Custom search URL saved"
              );
            }
          );

        document
          .getElementById(
            "setOpenLinksNewTab"
          )
          .addEventListener(
            "change",
            event =>
              save(
                "openLinksNewTab",
                event.target.checked
              )
          );

        document
          .getElementById(
            "setRestoreSession"
          )
          .addEventListener(
            "change",
            event =>

      function openModal(
        title,
        content,
        buttons=[]
      ){
        const modal =
          document.getElementById(
            "modal"
          );

        modal.innerHTML=`
          <div class="modal-header">

              class="modal-title"
              id="modalTitle"

          item=>{
            const button =
              document.createElement(
                "button"

            button.className =

      function applyClearData(){
        const history =
          document.getElementById(
            "clearHistoryData"
          ).checked;

        const bookmarks =
          document.getElementById(
            "clearBookmarksData"
          ).checked;

        const preferences =
          document.getElementById(
            "clearPreferencesData"
          ).checked;

        const range =
          document.getElementById(
            "clearDataRange"
          ).value;

        if(history){
          if(range==="all"){
            state.history=[];
          }else if(
            range==="today"
          ){
            const start =
              new Date();

            start.setHours(
              0,0,0,0
            );

            state.history =
              state.history.filter(
                item =>
                  item.timestamp <
                  start.getTime()
              );
          }else{
            const cutoff =
              Date.now() -
              3600000;

            state.history =
              state.history.filter(
                item =>
                  item.timestamp <
                  cutoff
              );
          }

          saveStorage(
            STORAGE.history,
            state.history
          );
        }

        if(bookmarks){
          state.bookmarks=
            clone(
              DEFAULT_BOOKMARKS
            );

          saveStorage(
            STORAGE.bookmarks,
            state.bookmarks
          );
        }

        if(preferences){
          state.settings=
            clone(
              DEFAULT_SETTINGS
            );

          saveStorage(
            STORAGE.settings,
            state.settings
          );
        }

        closeModal();

        applyTheme();
        renderCurrentTab();

        toast(
          "Browsing data cleared"
        );
      }

      function exportData(){
        const data = {
          version:1,
          exportedAt:
            new Date().toISOString(),
          history:
            state.history,
          bookmarks:
            state.bookmarks,
          settings:
            state.settings,
          shortcuts:
            state.shortcuts
        };

        const blob =
          new Blob(
            [
              JSON.stringify(
                data,
                null,
                2
              )
            ],
            {
              type:
                "application/json"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        const link =
          document.createElement(
            "a"
          );

        link.href=url;
        link.download=
          "nova-search-data.json";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        setTimeout(
          ()=>{
            URL.revokeObjectURL(
              url
            );
          },
          1000
        );

        toast(
          "Data exported"
        );
      }

      function handleImport(
        event
      ){
        const file =
          event.target.files?.[0];

        if(!file){
          return;
        }

        const reader =
          new FileReader();

        reader.onload=()=>{
          let data;

          try{
            data =
              JSON.parse(
                String(
                  reader.result || ""
                )
              );
          }catch{
            toast(
              "Invalid JSON file."
            );

            event.target.value="";
            return;
          }

          if(
            !data ||
            typeof data!=="object"
          ){
            toast(
              "Invalid NOVA data."
            );

            event.target.value="";
            return;
          }

          openConfirm(
            "Import Data",
            "Import matching NOVA data from this file?",
            ()=>{
              if(
                Array.isArray(
                  data.history
                )
              ){
                state.history =
                  data.history.filter(
                    item =>
                      item &&
                      typeof item.url==="string"
                  );

                saveStorage(
                  STORAGE.history,
                  state.history
                );
              }

              if(
                data.bookmarks &&
                Array.isArray(
                  data.bookmarks.folders
                )
              ){
                state.bookmarks =
                  data.bookmarks;

                saveStorage(
                  STORAGE.bookmarks,
                  state.bookmarks
                );
              }

              if(
                data.settings &&
                typeof data.settings==="object"
              ){
                state.settings={
                  ...DEFAULT_SETTINGS,
                  ...data.settings
                };

                saveStorage(
                  STORAGE.settings,
                  state.settings
                );
              }

              if(
                Array.isArray(
                  data.shortcuts
                )
              ){
                state.shortcuts =
                  data.shortcuts.filter(
                    item =>
                      item &&
                      item.name &&
                      item.url
                  );

                saveStorage(
                  STORAGE.shortcuts,
                  state.shortcuts
                );
              }

              applyTheme();
              renderCurrentTab();

              toast(
                "Data imported"
              );
            }
          );

          event.target.value="";
        };

        reader.onerror=()=>{
          toast(
            "Unable to read selected file."
          );

          event.target.value="";
        };

        reader.readAsText(
          file
        );
      }

      function clearFindMarks(){
        state.currentFindMatches=[];
        state.currentFindIndex=-1;

        document.getElementById(
          "findCount"
        ).textContent=
          "0/0";

        document
          .querySelectorAll(
            "#pageHost .find-mark"

      function findInCurrentPage(
        term
      ){
        clearFindMarks();

        term=
          String(term || "")
            .trim();

        if(!term){
          return;
        }

        const tab =
          getCurrentTab();

        if(
          !tab ||
          !isInternal(tab.url)
        ){
          document.getElementById(
            "findCount"
          ).textContent=
            "—";

          toast(
            "Find in external webpages is controlled by the destination page."
          );

          return;
        }

        const host =
          document.getElementById(
            "pageHost"
          );

        const walker =
          document.createTreeWalker(
            host,
            NodeFilter.SHOW_TEXT
          );

        const nodes=[];

        let node;

        while(
          node=walker.nextNode()
        ){
          if(
            node.parentElement?.closest(
              "#findBar"
            )
          ){
            continue;
          }

          if(
            (
              node.nodeValue ||
              ""
            )
              .toLowerCase()
              .includes(
                term.toLowerCase()
              )
          ){
            nodes.push(node);
          }
        }

        const matches=[];

        nodes.forEach(
          textNode=>{
            const text =
              textNode.nodeValue ||
              "";

            const lower =
              text.toLowerCase();

            const needle =
              term.toLowerCase();

            let position=0;

            while(
              (
                position =
                  lower.indexOf(
                    needle,
                    position
                  )
              )!==-1
            ){
              matches.push({
                node:textNode,
                index:position,
                length:
                  needle.length
              });

              position +=
                needle.length;
            }
          }
        );

        if(!matches.length){
          document.getElementById(
            "findCount"
          ).textContent=
            "0/0";

          return;
        }

        const groups =
          new Map();

        matches.forEach(
          match=>{
            if(
              !groups.has(
                match.node
              )
            ){
              groups.set(
                match.node,
                []
              );
            }

            groups
              .get(match.node)
              .push(match);
          }
        );

        groups.forEach(
          (
            nodeMatches,
            textNode
          )=>{
            const original =
              textNode.nodeValue ||
              "";

            let cursor=0;

            const fragment =
              document.createDocumentFragment();

            nodeMatches
              .sort(
                (a,b)=>
                  a.index-b.index
              )
              .forEach(
                match=>{
                  fragment.appendChild(
                    document.createTextNode(
                      original.slice(
                        cursor,
                        match.index
                      )
                    )
                  );

                  const mark =
                    document.createElement(
                      "mark"
                    );

                  mark.className=
                    "find-mark";

                  mark.textContent=
                    original.slice(
                      match.index,
                      match.index+
                      match.length
                    );

                  fragment.appendChild(
                    mark
                  );

                  cursor =
                    match.index+
                    match.length;
                }
              );

            fragment.appendChild(
              document.createTextNode(
                original.slice(cursor)
              )
            );

            textNode.parentNode?.replaceChild(
              fragment,
              textNode
            );
          }
        );

        state.currentFindMatches =
          [
            ...document.querySelectorAll(
              "#pageHost .find-mark"
            )
          ];

        state.currentFindIndex=0;

        updateFindDisplay();
      }

      function updateFindDisplay(){
        const matches =
          state.currentFindMatches;

        document.getElementById(
          "findCount"
        ).textContent =
          matches.length
            ? (
                state.currentFindIndex+1
              ) +
              "/" +
              matches.length
            : "0/0";

        matches.forEach(
          (
            element,
            index
          )=>{
            element.style.outline =
              index===
              state.currentFindIndex
                ? "2px solid var(--primary)"
                : "none";
          }
        );

        const active =
          matches[
            state.currentFindIndex
          ];

        active?.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });
      }

      function moveFind(
        amount
      ){
        if(
          !state.currentFindMatches.length
        ){
          return;
        }

        state.currentFindIndex=
          (
            state.currentFindIndex+
            amount+
            state.currentFindMatches.length
          ) %
          state.currentFindMatches.length;

        updateFindDisplay();
      }

      async function copyText(
        text
      ){
        try{
          await navigator.clipboard.writeText(
            text
          );

          toast(
            "Link copied!"
          );
        }catch{
          const textarea =
            document.createElement(
              "textarea"
            );

          textarea.value=text;
          textarea.style.position=
            "fixed";
          textarea.style.opacity="0";

          document.body.appendChild(
            textarea
          );

          textarea.select();

          let ok=false;

          try{
            ok =
              document.execCommand(
                "copy"
              );
          }catch{}

          textarea.remove();

          toast(
            ok
              ? "Link copied!"
              : "Clipboard access was denied."
          );
        }
      }

      function copyCurrentUrl(){
        const tab =
          getCurrentTab();

        if(!tab){

        copyText(

      async function shareCurrent(){
        const tab =
          getCurrentTab();

        if(!tab){
          return;
        }

        const url =
          isInternal(tab.url)
            ? location.href
            : tab.url;

        if(
          navigator.share
        ){
          try{
            await navigator.share({
              title:
                tab.title ||
                "NOVA Search",
              text:
                "Shared from NOVA Search",
              url
            });

            return;
          }catch(error){
            if(
              error?.name===
              "AbortError"
            ){
              return;
            }
          }
        }

        copyText(
          url
        );
      }

      function showSuggestions(
        value
      ){
        const box =
          document.getElementById(
            "suggestions"
          );

        const query =
          String(value || "")
            .trim();

        if(!query){
          box.innerHTML="";
          box.classList.remove(
            "show"
          );
          return;
        }

        const queryLower =
          query.toLowerCase();

        const recent =
          state.history
            .filter(
              item =>
                (
                  item.title ||
                  ""
                )
                  .toLowerCase()
                  .includes(
                    queryLower
                  ) ||
                (
                  item.url ||
                  ""
                )
                  .toLowerCase()
                  .includes(
                    queryLower
                  )
            )
            .slice(0,3)
            .map(
              item=>({
                text:
                  item.title ||
                  item.url,
                icon:"◷"
              })
            );

        const generated=[
          {
            text:query,
            icon:"⌕"
          },
          {
            text:
              query +
              " news",
            icon:"⌕"
          },
          {
            text:
              query +
              " latest",
            icon:"⌕"
          },
          {
            text:
              query +
              " guide",
            icon:"⌕"
          }
        ];

        const seen =
          new Set();

        const combined =
          [
            ...recent,
            ...generated
          ]
          .filter(
            item=>{
              const key=
                item.text
                  .toLowerCase();

              if(
                seen.has(key)
              ){
                return false;
              }

              seen.add(key);
              return true;
            }
          )
          .slice(0,7);

        box.innerHTML="";

        combined.forEach(
          item=>{
            const row =
              document.createElement(
                "div"
              );

            row.className=
              "suggestion";

            row.innerHTML=`
              <div class="suggestion-icon">
                ${esc(item.icon)}
              </div>

              <div class="suggestion-text">
                ${esc(item.text)}
              </div>
            `;

            row.addEventListener(
              "mousedown",
              event=>{
                event.preventDefault();

                document.getElementById(
                  "addressBar"
                ).value =
                  item.text;

                closeSuggestions();

                navigateFromInput(
                  item.text,
                  false
                );
              }
            );

            box.appendChild(
              row
            );
          }
        );

        box.classList.add(
          "show"
        );
      }

      function contextAction(
        action
      ){
        hideContextMenu();

        const tab =
          getCurrentTab();

        switch(action){

          case "back":
            goBack();
            break;

          case "forward":
            goForward();
            break;

          case "reload":
            reloadCurrent();
            break;

          case "bookmark":
            toggleBookmarkCurrent();
            break;

          case "copy":
            copyCurrentUrl();
            break;

          case "new-tab":
            if(tab){
              navigateTo(
                tab.url,
                {
                  addHistory:false,
                  newTab:true
                }
              );
            }
            break;

          case "new-window":
            if(tab){
              window.open(
                tab.url,
                "_blank",
                "noopener,noreferrer"
              );
            }
            break;

          case "inspect":
            toast(
              "Inspect is controlled by the browser Developer Tools."
            );
            break;
        }
      }

            break;

      function cycleTheme(){

          state.settings.theme===
          "light"
        ){
          next="dark";
        }else if(

          "dark"
        ){
          next="system";
        }else{

        state.settings.theme=next;

        saveStorage(
          STORAGE.settings,
          state.settings
        );

        applyTheme();
        renderCurrentTab();

        toast(
          "Theme: " +
          next
        );
      }

      document.addEventListener(
        "keydown",
        event=>{
          const key =
            event.key.toLowerCase();

          const ctrl =
            event.ctrlKey ||
            event.metaKey;

          if(
            ctrl &&
            key==="l"
          ){
            event.preventDefault();
            focusAddress();
            return;
          }

          if(
            ctrl &&
            key==="t"
          ){
            event.preventDefault();
            addTab(false);
            return;
          }

          if(
            ctrl &&
            key==="w"
          ){
            event.preventDefault();

            const tab =
              getCurrentTab();

            if(tab){
              closeTab(tab.id);
            }

            return;
          }

          if(
            ctrl &&
            event.shiftKey &&
            key==="t"
          ){
            event.preventDefault();
            reopenClosedTab();
            return;
          }

          if(
            ctrl &&
            key==="f"
          ){
            event.preventDefault();
            openFind();
            return;
          }

          if(
            ctrl &&
            key==="d"
          ){
            event.preventDefault();
            toggleBookmarkCurrent();
            return;
          }

          if(
            ctrl &&
            key==="r"
          ){
            event.preventDefault();
            reloadCurrent();
            return;
          }

          if(
            ctrl &&
            key==="h"
          ){
            event.preventDefault();

            navigateTo(
              "nova://history",
              {
                addHistory:false
              }
            );

            return;
          }

          if(
            ctrl &&
            key==="j"
          ){
            event.preventDefault();

            navigateTo(
              "nova://downloads",
              {
                addHistory:false
              }
            );

            return;
          }

          if(
            ctrl &&
            event.shiftKey &&
            key==="tab"
          ){
            event.preventDefault();
            cycleTab(-1);
            return;
          }

          if(
            ctrl &&
            key==="tab"
          ){
            event.preventDefault();
            cycleTab(1);
            return;
          }

          if(
            ctrl &&
            (
              key==="+" ||
              key==="="
            )
          ){
            event.preventDefault();
            changeZoom(1);
            return;
          }

          if(
            ctrl &&
            key==="-"
          ){
            event.preventDefault();
            changeZoom(-1);
            return;
          }

          if(
            ctrl &&
            key==="0"
          ){
            event.preventDefault();
            setZoom(100);
            return;
          }

          if(
            event.key==="Escape"
          ){
            closeSuggestions();
            closeMenu();
            hideContextMenu();
          }
        }
      );

            "system"
          ){
            applyTheme();
            renderCurrentTab();
          }
        }
      );

      function initialize(){
        if(
          !state.bookmarks ||
          !Array.isArray(
            state.bookmarks.folders
          )
        ){
          state.bookmarks=
            clone(
              DEFAULT_BOOKMARKS
            );

          saveStorage(
            STORAGE.bookmarks,
            state.bookmarks
          );
        }

        state.history =
          loadStorage(
            STORAGE.history,
            []
          );

        state.closedTabs =
          loadStorage(
            STORAGE.closedTabs,
            []
          );

        const saved =
          loadStorage(
            STORAGE.tabs,
            null
          );

        state.tabs=[];

        if(
          state.settings.restoreSession &&
          state.settings.startup==="restore" &&
          saved?.tabs?.length
        ){
          saved.tabs.forEach(
            savedTab=>{
              if(
                !savedTab ||
                !savedTab.url
              ){
                return;
              }

              const tab =
                createTab({
                  url:savedTab.url,
                  title:
                    savedTab.title,
                  privateMode:false
                });

              if(
                Array.isArray(
                  savedTab.history
                ) &&
                savedTab.history.length
              ){
                tab.history =
                  savedTab.history;

                tab.historyIndex =
                  Math.max(
                    0,
                    Math.min(
                      tab.history.length-1,
                      Number(
                        savedTab.historyIndex
                      ) || 0
                    )
                  );

                tab.url=
                  tab.history[
                    tab.historyIndex
                  ];

                tab.title=
                  savedTab.title ||
                  titleFromUrl(
                    tab.url
                  );
              }

              state.tabs.push(
                tab
              );
            }
          );

          if(
            state.tabs.length
          ){
            const activeIndex =
              Number(
                saved.activeIndex
              );

            state.activeTabId =
              state.tabs[
                Math.max(
                  0,
                  Math.min(
                    state.tabs.length-1,
                    Number.isFinite(
                      activeIndex
                    )
                      ? activeIndex
                      : 0
                  )
                )
              ].id;
          }
        }

        if(
          !state.tabs.length
        ){
          const initial =
            createTab({
              url:"nova://newtab"
            });

          state.tabs=[
            initial
          ];

          state.activeTabId=
            initial.id;
        }

        applyTheme();
        renderCurrentTab();
      }

      initialize();

    })();
  </script>
</body>
</html>
