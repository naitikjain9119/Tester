<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="NOVA Search — modern browser-style search experience." />
  <title>NOVA Search</title>

  <style>
    :root{
      --bg:#f4f7fb;
      --surface:#ffffff;
      --surface-2:#eef2f8;
      --surface-3:#e7ecf4;
      --text:#142033;
      --muted:#667085;
      --line:#d8dee9;
      --primary:#5b5ce2;
      --primary-2:#7879f2;
      --danger:#e74c3c;
      --success:#1f9d67;
      --warning:#d99100;
      --shadow:0 10px 30px rgba(22,32,51,.10);
      --shadow-soft:0 3px 14px rgba(22,32,51,.08);
      --radius:16px;
      --toolbar-height:62px;
      --tabs-height:44px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-top:env(safe-area-inset-top,0px);
      --page-zoom:1;
      --desktop-width:1280px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    [data-theme="dark"]{
      --bg:#090d18;
      --surface:#111827;
      --surface-2:#182133;
      --surface-3:#202b40;
      --text:#edf2ff;
      --muted:#9aa8c0;
      --line:#29354b;
      --primary:#8586ff;
      --primary-2:#9a9bff;
      --shadow:0 12px 35px rgba(0,0,0,.30);
      --shadow-soft:0 4px 16px rgba(0,0,0,.22);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
    }

    body{
      font-size:14px;
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      border:0;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible{
      outline:3px solid color-mix(in srgb,var(--primary) 38%,transparent);
      outline-offset:2px;
    }

    .app{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      background:var(--bg);
    }

    .private-mode{
      --bg:#08090f;
      --surface:#12131c;
      --surface-2:#191b27;
      --surface-3:#242635;
      --text:#f6f1ff;
      --muted:#ada7bb;
      --line:#302f42;
      --primary:#9a72ff;
      --primary-2:#b08cff;
      --shadow:0 12px 35px rgba(0,0,0,.38);
      --shadow-soft:0 4px 16px rgba(0,0,0,.30);
    }

    .tabs-bar{
      height:calc(var(--tabs-height) + var(--safe-top));
      padding-top:var(--safe-top);
      background:var(--surface-2);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:flex-end;
      padding-left:8px;
      padding-right:8px;
      gap:5px;
      flex-shrink:0;
    }

    .tabs-scroll{
      display:flex;
      align-items:flex-end;
      gap:5px;
      min-width:0;
      flex:1;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      height:100%;
    }

    .tabs-scroll::-webkit-scrollbar{
      display:none;
    }

    .tab{
      height:38px;
      min-width:130px;
      max-width:240px;
      padding:0 8px 0 10px;
      display:flex;
      align-items:center;
      gap:8px;
      background:transparent;
      color:var(--muted);
      border-radius:12px 12px 0 0;
      cursor:pointer;
      user-select:none;
      position:relative;
      transition:.18s ease;
    }

    .tab:hover{
      background:color-mix(in srgb,var(--surface) 66%,transparent);
    }

    .tab.active{
      background:var(--surface);
      color:var(--text);
      box-shadow:var(--shadow-soft);
    }

    .tab.private{
      background:color-mix(in srgb,#6d4ca0 18%,transparent);
    }

    .tab.private.active{
      background:#171423;
    }

    .tab-favicon{
      width:18px;
      height:18px;
      border-radius:5px;
      flex:none;
      object-fit:cover;
      background:var(--surface-3);
    }

    .tab-title{
      flex:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:12px;
      font-weight:600;
    }

    .tab-close{
      width:25px;
      height:25px;
      border-radius:7px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      display:grid;
      place-items:center;
      flex:none;
      transition:.15s ease;
    }

    .tab-close:hover{
      color:var(--text);
      background:var(--surface-3);
    }

    .new-tab-btn{
      width:38px;
      height:38px;
      flex:none;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
      font-size:23px;
    }

    .new-tab-btn:hover{
      background:var(--surface-3);
    }

    .browser-toolbar{
      height:var(--toolbar-height);
      min-height:var(--toolbar-height);
      padding:8px 10px;
      display:flex;
      align-items:center;
      gap:7px;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      box-shadow:0 2px 12px rgba(0,0,0,.04);
      position:relative;
      z-index:20;
    }

    .nav-btn,
    .toolbar-btn{
      width:39px;
      height:39px;
      border-radius:12px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
      flex:none;
      transition:.15s ease;
    }

    .nav-btn:hover,
    .toolbar-btn:hover{
      background:var(--surface-2);
    }

    .nav-btn:disabled{
      opacity:.36;
      cursor:not-allowed;
    }

    .nav-icon{
      font-size:20px;
      line-height:1;
    }

    .address-wrap{
      min-width:0;
      flex:1;
      position:relative;
    }

    .address-bar{
      width:100%;
      height:42px;
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:18px;
      padding:0 42px 0 40px;
      transition:.18s ease;
    }

    .address-bar:hover{
      border-color:color-mix(in srgb,var(--primary) 35%,var(--line));
    }

    .address-bar:focus{
      background:var(--surface);
      border-color:var(--primary);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent);
    }

    .address-leading,
    .address-trailing{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:30px;
      height:30px;
      border-radius:9px;
      display:grid;
      place-items:center;
      pointer-events:none;
    }

    .address-leading{
      left:6px;
    }

    .address-trailing{
      right:6px;
    }

    .security-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--warning);
      box-shadow:0 0 10px color-mix(in srgb,var(--warning) 42%,transparent);
    }

    .suggestions{
      position:absolute;
      left:0;
      right:0;
      top:48px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:none;
      z-index:100;
      max-height:340px;
      overflow-y:auto;
    }

    .suggestions.show{
      display:block;
    }

    .suggestion{
      display:flex;
      gap:11px;
      align-items:center;
      padding:12px 14px;
      cursor:pointer;
    }

    .suggestion:hover{
      background:var(--surface-2);
    }

    .suggestion-icon{
      width:31px;
      height:31px;
      border-radius:10px;
      background:var(--surface-2);
      display:grid;
      place-items:center;
      flex:none;
      color:var(--muted);
    }

    .suggestion-text{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .private-indicator{
      display:none;
      height:34px;
      padding:0 11px;
      border-radius:11px;
      background:#211a30;
      color:#dacbff;
      align-items:center;
      gap:7px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      flex:none;
    }

    .private-mode .private-indicator{
      display:flex;
    }

    .menu-wrap{
      position:relative;
      flex:none;
    }

    .menu{
      position:absolute;
      top:48px;
      right:0;
      width:330px;
      max-height:calc(100vh - 66px);
      overflow:auto;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:8px;
      display:none;
      z-index:120;
    }

    .menu.show{
      display:block;
      animation:menuIn .16s ease;
    }

    @keyframes menuIn{
      from{
        opacity:0;
        transform:translateY(-4px) scale(.99);
      }
      to{
        opacity:1;
        transform:none;
      }
    }

    .menu-section{
      padding:4px 0;
    }

    .menu-title{
      padding:7px 11px 5px;
      color:var(--muted);
      font-size:10px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .menu-row{
      width:100%;
      min-height:40px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      padding:0 11px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      text-align:left;
    }

    .menu-row:hover{
      background:var(--surface-2);
    }

    .menu-row .mi{
      width:20px;
      text-align:center;
      color:var(--muted);
      flex:none;
    }

    .menu-row .ms{
      flex:1;
    }

    .menu-row .shortcut{
      color:var(--muted);
      font-size:11px;
    }

    .menu-divider{
      height:1px;
      background:var(--line);
      margin:5px 2px;
    }

    .menu-zoom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .menu-zoom-btn{
      width:36px;
      height:34px;
      border-radius:9px;
      background:var(--surface-2);
      color:var(--text);
      cursor:pointer;
      font-size:18px;
    }

    .menu-zoom-value{
      min-width:52px;
      text-align:center;
      font-weight:800;
    }

    .bookmark-bar{
      min-height:33px;
      display:none;
      align-items:center;
      gap:5px;
      padding:3px 10px;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      overflow-x:auto;
      scrollbar-width:none;
    }

    .bookmark-bar.show{
      display:flex;
    }

    .bookmark-bar::-webkit-scrollbar{
      display:none;
    }

    .bookmark-link{
      height:27px;
      white-space:nowrap;
      border-radius:8px;
      padding:0 9px;
      display:flex;
      align-items:center;
      gap:6px;
      color:var(--text);
      cursor:pointer;
      font-size:11px;
    }

    .bookmark-link:hover{
      background:var(--surface-2);
    }

    .content-viewport{
      position:relative;
      flex:1;
      min-height:0;
      overflow:hidden;
      background:var(--bg);
    }

    .page-host{
      width:100%;
      height:100%;
      position:relative;
      overflow:auto;
      background:var(--bg);
      scroll-behavior:smooth;
    }

    /*
      IMPORTANT BROWSER LIMITATION:
      The shell always stays visible because external pages are rendered
      inside this iframe.

      Websites that deliberately send X-Frame-Options or
      Content-Security-Policy frame restrictions can still refuse embedding.
      A single webpage cannot legally bypass those destination security
      policies. In that situation the NOVA shell remains visible around the
      browser-generated destination error instead of sending the user away
      to a separate page.
    */

    .web-frame-wrap{
      width:100%;
      height:100%;
      min-height:100%;
      overflow:auto;
      background:#fff;
      position:relative;
    }

    .web-frame{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#fff;
      transform-origin:top left;
    }

    /*
      Desktop Site:
      Creates a desktop-width web viewport inside NOVA.
      A normal webpage cannot universally force the real browser's
      User-Agent header from client-side JavaScript, so this is implemented
      as an actual desktop-width viewport rather than pretending to change
      browser identity.
    */
    .web-frame.desktop-site{
      width:var(--desktop-width);
      min-width:var(--desktop-width);
    }

    .external-page-notice{
      position:absolute;
      top:8px;
      left:50%;
      transform:translateX(-50%);
      z-index:8;
      max-width:min(840px,calc(100% - 20px));
      background:rgba(18,24,38,.90);
      color:#d7dfef;
      border:1px solid rgba(255,255,255,.10);
      border-radius:11px;
      padding:7px 10px;
      font-size:10px;
      box-shadow:0 8px 25px rgba(0,0,0,.18);
      pointer-events:none;
      white-space:normal;
      text-align:center;
    }

    .internal-page{
      min-height:100%;
      padding:28px;
      background:var(--bg);
    }

    .newtab-page{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 18px 70px;
    }

    .newtab-inner{
      width:min(980px,100%);
    }

    .newtab-brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-bottom:25px;
    }

    .brand-mark{
      width:82px;
      height:82px;
      border-radius:27px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,var(--primary),var(--primary-2));
      box-shadow:0 15px 40px color-mix(in srgb,var(--primary) 30%,transparent);
      position:relative;
      overflow:hidden;
    }

    .brand-mark:before,
    .brand-mark:after{
      content:"";
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,.16);
    }

    .brand-mark:before{
      width:100px;
      height:100px;
      right:-45px;
      top:-50px;
    }

    .brand-mark:after{
      width:75px;
      height:75px;
      left:-36px;
      bottom:-30px;
    }

    .brand-n{
      position:relative;
      z-index:1;
      color:#fff;
      font-size:43px;
      font-weight:950;
      letter-spacing:-.08em;
      transform:skewX(-9deg);
    }

    .newtab-title{
      margin-top:15px;
      font-size:28px;
      font-weight:950;
      letter-spacing:-.04em;
    }

    .newtab-subtitle{
      color:var(--muted);
      text-align:center;
      margin-top:5px;
    }

    .hero-search{
      width:min(760px,100%);
      margin:0 auto;
      position:relative;
    }

    .hero-search input{
      width:100%;
      height:58px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:21px;
      padding:0 70px 0 22px;
      box-shadow:var(--shadow-soft);
      font-size:16px;
    }

    .hero-search button{
      position:absolute;
      top:7px;
      width:44px;
      height:44px;
      border-radius:14px;
      background:var(--primary);
      color:#fff;
      cursor:pointer;
    }

    .hero-search .hero-submit{
      right:7px;
    }

    .hero-search button:hover{
      filter:brightness(.97);
    }

    .quick-title{
      width:min(760px,100%);
      margin:30px auto 10px;
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.12em;
    }

    .shortcuts-grid{
      width:min(760px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }

    .shortcut-card{
      min-height:98px;
      padding:15px 11px;
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:9px;
      position:relative;
      transition:.18s ease;
    }

    .shortcut-card:hover{
      transform:translateY(-2px);
      border-color:color-mix(in srgb,var(--primary) 28%,var(--line));
    }

    .shortcut-icon{
      width:36px;
      height:36px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:var(--surface-2);
      font-size:18px;
    }

    .shortcut-name{
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    .shortcut-actions{
      position:absolute;
      top:6px;
      right:6px;
      display:flex;
      gap:3px;
      opacity:0;
      transition:.15s ease;
    }

    .shortcut-card:hover .shortcut-actions{
      opacity:1;
    }

    .shortcut-action{
      width:24px;
      height:24px;
      border-radius:7px;
      background:var(--surface-2);
      color:var(--muted);
      cursor:pointer;
      font-size:11px;
    }

    .add-shortcut{
      border-style:dashed;
    }

    .internal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .internal-title{
      font-size:25px;
      font-weight:950;
      letter-spacing:-.03em;
    }

    .internal-subtitle{
      color:var(--muted);
      margin-top:4px;
    }

    .header-actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn{
      min-height:38px;
      padding:0 13px;
      border-radius:11px;
      cursor:pointer;
      font-weight:800;
    }

    .primary-btn{
      background:var(--primary);
      color:#fff;
    }

    .secondary-btn{
      background:var(--surface);
      color:var(--text);
      border:1px solid var(--line);
    }

    .danger-btn{
      background:color-mix(in srgb,var(--danger) 12%,var(--surface));
      color:var(--danger);
      border:1px solid color-mix(in srgb,var(--danger) 20%,var(--line));
    }

    .primary-btn:hover,
    .secondary-btn:hover,
    .danger-btn:hover{
      filter:brightness(.98);
    }

    .panel{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
    }

    .history-controls{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .search-input{
      height:42px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:12px;
      padding:0 12px;
      min-width:240px;
    }

    .filter-select{
      height:42px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:12px;
      padding:0 10px;
    }

    .history-list,
    .bookmark-list,
    .download-list{
      display:flex;
      flex-direction:column;
    }

    .list-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      border-top:1px solid var(--line);
    }

    .list-item:first-child{
      border-top:0;
    }

    .list-icon{
      width:37px;
      height:37px;
      border-radius:11px;
      background:var(--surface-2);
      display:grid;
      place-items:center;
      flex:none;
    }

    .list-main{
      min-width:0;
      flex:1;
    }

    .list-title{
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .list-url{
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:4px;
    }

    .list-meta{
      color:var(--muted);
      font-size:10px;
      margin-top:4px;
    }

    .list-actions{
      display:flex;
      gap:5px;
      flex:none;
    }

    .icon-btn{
      width:32px;
      height:32px;
      border-radius:9px;
      background:var(--surface-2);
      color:var(--text);
      cursor:pointer;
    }

    .icon-btn:hover{
      background:var(--surface-3);
    }

    .bookmark-section{
      padding:14px;
      margin-bottom:14px;
    }

    .folder-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 3px;
      font-weight:900;
    }

    .folder-items{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }

    .folder-empty{
      padding:20px;
      text-align:center;
      color:var(--muted);
    }

    .bookmark-folder-actions{
      display:flex;
      gap:5px;
    }

    .download-status{
      font-size:10px;
      font-weight:900;
      padding:4px 7px;
      border-radius:7px;
      background:var(--surface-2);
      color:var(--muted);
      margin-left:7px;
    }

    .download-status.started{
      color:var(--warning);
    }

    .settings-layout{
      display:grid;
      grid-template-columns:220px minmax(0,1fr);
      gap:16px;
      align-items:start;
    }

    .settings-nav{
      position:sticky;
      top:0;
      padding:8px;
    }

    .settings-nav button{
      width:100%;
      min-height:40px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      text-align:left;
      padding:0 11px;
    }

    .settings-nav button.active,
    .settings-nav button:hover{
      background:var(--surface-2);
    }

    .settings-content{
      min-width:0;
    }

    .setting-card{
      padding:18px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
      margin-bottom:14px;
    }

    .setting-card h3{
      margin:0 0 5px;
      font-size:16px;
    }

    .setting-card p{
      margin:0;
      color:var(--muted);
      line-height:1.5;
      font-size:12px;
    }

    .setting-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      padding:13px 0;
      border-top:1px solid var(--line);
    }

    .setting-row:first-of-type{
      border-top:0;
    }

    .setting-info{
      min-width:0;
    }

    .setting-label{
      font-weight:850;
    }

    .setting-help{
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
      line-height:1.4;
    }

    .setting-control{
      flex:none;
    }

    .switch{
      width:45px;
      height:25px;
      border-radius:30px;
      background:var(--surface-3);
      position:relative;
      cursor:pointer;
      border:1px solid var(--line);
      display:inline-block;
    }

    .switch input{
      display:none;
    }

    .switch span{
      position:absolute;
      width:19px;
      height:19px;
      top:2px;
      left:2px;
      background:#fff;
      border-radius:50%;
      transition:.18s ease;
      box-shadow:0 1px 5px rgba(0,0,0,.2);
    }

    .switch input:checked + span{
      transform:translateX(20px);
      background:var(--primary);
    }

    .text-control,
    .select-control{
      min-width:190px;
      height:40px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface-2);
      color:var(--text);
      padding:0 10px;
    }

    .shortcut-table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
    }

    .shortcut-table td{
      padding:9px 0;
      border-top:1px solid var(--line);
      font-size:12px;
    }

    kbd{
      padding:4px 7px;
      border:1px solid var(--line);
      border-bottom-width:2px;
      border-radius:7px;
      background:var(--surface-2);
      font-size:10px;
      font-weight:900;
    }

    .about-card{
      width:min(760px,100%);
      margin:0 auto;
      padding:28px;
      text-align:center;
    }

    .about-logo{
      margin:0 auto 16px;
    }

    .about-list{
      text-align:left;
      margin-top:20px;
      padding:0;
      list-style:none;
    }

    .about-list li{
      padding:11px 0;
      border-top:1px solid var(--line);
      color:var(--muted);
    }

    .credit{
      margin-top:22px;
      padding:12px;
      border-radius:12px;
      background:var(--surface-2);
      font-weight:850;
    }

    .blocked-page,
    .error-page{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:30px;
    }

    .error-card{
      width:min(650px,100%);
      text-align:center;
      padding:32px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
    }

    .error-icon{
      width:58px;
      height:58px;
      border-radius:18px;
      background:var(--surface-2);
      display:grid;
      place-items:center;
      margin:0 auto 16px;
      font-size:25px;
    }

    .error-title{
      font-size:22px;
      font-weight:950;
    }

    .error-text{
      color:var(--muted);
      line-height:1.55;
      margin:9px auto 20px;
      max-width:510px;
    }

    .error-actions{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .loading-overlay{
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:3px;
      background:transparent;
      z-index:8;
      overflow:hidden;
      pointer-events:none;
    }

    .loading-overlay.active:before{
      content:"";
      display:block;
      width:30%;
      height:100%;
      background:linear-gradient(90deg,transparent,var(--primary),transparent);
      animation:loading 1s infinite;
    }

    @keyframes loading{
      0%{
        transform:translateX(-140%);
      }
      100%{
        transform:translateX(450%);
      }
    }

    .find-bar{
      position:absolute;
      top:13px;
      right:14px;
      width:min(430px,calc(100% - 28px));
      min-height:54px;
      display:none;
      align-items:center;
      gap:6px;
      padding:7px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      z-index:50;
    }

    .find-bar.show{
      display:flex;
    }

    .find-input{
      min-width:0;
      flex:1;
      height:38px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface-2);
      color:var(--text);
      padding:0 9px;
    }

    .find-count{
      min-width:55px;
      text-align:center;
      color:var(--muted);
      font-size:11px;
    }

    .find-mark{
      background:color-mix(in srgb,#f4c542 45%,transparent);
      border-radius:3px;
    }

    .context-menu{
      position:fixed;
      z-index:500;
      width:220px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:6px;
      display:none;
    }

    .context-menu.show{
      display:block;
    }

    .context-item{
      width:100%;
      height:37px;
      border-radius:9px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      text-align:left;
      padding:0 10px;
      font-size:12px;
    }

    .context-item:hover{
      background:var(--surface-2);
    }

    .context-sep{
      height:1px;
      background:var(--line);
      margin:5px 2px;
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.48);
      backdrop-filter:blur(3px);
      display:none;
      place-items:center;
      z-index:400;
      padding:18px;
    }

    .modal-backdrop.show{
      display:grid;
    }

    .modal{
      width:min(650px,100%);
      max-height:min(760px,calc(100vh - 30px));
      overflow:auto;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
      animation:modalIn .16s ease;
    }

    @keyframes modalIn{
      from{
        opacity:0;
        transform:translateY(8px) scale(.985);
      }
      to{
        opacity:1;
        transform:none;
      }
    }

    .modal-header{
      padding:17px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .modal-title{
      font-size:16px;
      font-weight:950;
    }

    .modal-body{
      padding:18px;
    }

    .modal-footer{
      padding:13px 18px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:flex-end;
      gap:7px;
    }

    .check-grid{
      display:grid;
      gap:10px;
    }

    .check-option{
      display:flex;
      align-items:flex-start;
      gap:9px;
      padding:11px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--surface-2);
    }

    .check-option input{
      margin-top:3px;
    }

    .check-option strong{
      display:block;
    }

    .check-option span{
      font-size:11px;
      color:var(--muted);
    }

    .form-grid{
      display:grid;
      gap:12px;
    }

    .field{
      display:grid;
      gap:6px;
    }

    .field label{
      font-size:11px;
      color:var(--muted);
      font-weight:800;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      height:40px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface-2);
      color:var(--text);
      padding:0 10px;
    }

    .field textarea{
      height:96px;
      padding:10px;
      resize:vertical;
    }

    .toast-zone{
      position:fixed;
      right:15px;
      bottom:calc(15px + var(--safe-bottom));
      z-index:600;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      pointer-events:none;
    }

    .toast{
      max-width:min(370px,calc(100vw - 30px));
      background:#151b28;
      color:#fff;
      border-radius:12px;
      padding:10px 13px;
      box-shadow:var(--shadow);
      font-size:12px;
      animation:toastIn .18s ease;
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateY(6px);
      }
      to{
        opacity:1;
        transform:none;
      }
    }

    .mobile-bottom{
      display:none;
      min-height:56px;
      padding:5px 9px calc(5px + var(--safe-bottom));
      background:var(--surface);
      border-top:1px solid var(--line);
      justify-content:space-around;
      flex:none;
      z-index:25;
    }

    .mobile-bottom button{
      background:transparent;
      color:var(--muted);
      min-width:58px;
      border-radius:11px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      cursor:pointer;
      font-size:10px;
    }

    .mobile-bottom button strong{
      font-size:18px;
      font-weight:500;
    }

    .no-data{
      padding:50px 20px;
      text-align:center;
      color:var(--muted);
    }

    .no-data-icon{
      font-size:34px;
      margin-bottom:10px;
    }

    .no-data-title{
      color:var(--text);
      font-weight:950;
      font-size:15px;
    }

    .no-data-text{
      margin-top:4px;
      font-size:12px;
    }

    .data-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:13px;
    }

    @media (max-width:900px){
      .shortcuts-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }

      .settings-layout{
        grid-template-columns:1fr;
      }

      .settings-nav{
        position:static;
        display:flex;
        overflow:auto;
        gap:5px;
      }

      .settings-nav button{
        width:auto;
        white-space:nowrap;
      }
    }

    @media (max-width:700px){
      :root{
        --toolbar-height:57px;
        --tabs-height:41px;
      }

      .tabs-bar{
        padding-left:5px;
        padding-right:5px;
      }

      .tab{
        min-width:118px;
        max-width:190px;
        height:35px;
      }

      .new-tab-btn{
        width:34px;
        height:34px;
      }

      .browser-toolbar{
        padding:6px 7px;
        gap:5px;
      }

      .nav-btn,
      .toolbar-btn{
        width:35px;
        height:35px;
        border-radius:10px;
      }

      .browser-toolbar .nav-btn:nth-child(1),
      .browser-toolbar .nav-btn:nth-child(2){
        display:none;
      }

      .private-indicator{
        height:30px;
        padding:0 8px;
      }

      .address-bar{
        height:39px;
        border-radius:15px;
        padding-left:36px;
        font-size:12px;
      }

      .suggestions{
        top:45px;
      }

      .mobile-bottom{
        display:flex;
      }

      .content-viewport{
        height:auto;
      }

      .internal-page{
        padding:18px 12px 28px;
      }

      .newtab-page{
        padding:22px 12px 55px;
      }

      .shortcuts-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .shortcut-card{
        min-height:90px;
      }

      .hero-search input{
        height:54px;
        font-size:14px;
        padding-left:17px;
      }

      .hero-search button{
        height:40px;
        width:40px;
        top:7px;
      }

      .newtab-title{
        font-size:24px;
      }

      .brand-mark{
        width:72px;
        height:72px;
      }

      .brand-n{
        font-size:37px;
      }

      .menu{
        position:fixed;
        top:calc(var(--safe-top) + var(--tabs-height) + var(--toolbar-height) + 4px);
        right:7px;
        width:min(350px,calc(100vw - 14px));
        max-height:calc(100vh - 100px);
      }

      .list-item{
        align-items:flex-start;
      }

      .list-actions{
        flex-wrap:wrap;
      }

      .text-control,
      .select-control{
        min-width:150px;
        max-width:52vw;
      }

      .setting-row{
        align-items:flex-start;
      }

      .setting-control{
        margin-top:2px;
      }

      .about-card{
        padding:20px;
      }

      .external-page-notice{
        font-size:9px;
      }
    }

    @media (max-width:450px){
      .tabs-scroll{
        gap:3px;
      }

      .tab{
        min-width:104px;
        max-width:160px;
        padding-left:8px;
        gap:6px;
      }

      .tab-title{
        font-size:11px;
      }

      .tab-close{
        width:23px;
        height:23px;
      }

      .browser-toolbar .toolbar-btn:nth-last-child(2){
        display:none;
      }

      .newtab-subtitle{
        font-size:11px;
      }

      .quick-title{
        margin-top:23px;
      }

      .internal-title{
        font-size:22px;
      }

      .search-input{
        min-width:0;
        flex:1;
      }

      .list-icon{
        width:32px;
        height:32px;
      }

      .icon-btn{
        width:30px;
        height:30px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="app">

    <div id="tabsBar" class="tabs-bar" aria-label="Browser tabs">
      <div id="tabsScroll" class="tabs-scroll"></div>

      <button
        id="newTabBtn"
        class="new-tab-btn"
        aria-label="New tab"
        title="New tab"
      >
        +
      </button>
    </div>

    <div id="toolbar" class="browser-toolbar">

      <button
        id="backBtn"
        class="nav-btn"
        aria-label="Back"
        title="Back"
      >
        <span class="nav-icon">←</span>
      </button>

      <button
        id="forwardBtn"
        class="nav-btn"
        aria-label="Forward"
        title="Forward"
      >
        <span class="nav-icon">→</span>
      </button>

      <button
        id="reloadBtn"
        class="nav-btn"
        aria-label="Reload"
        title="Reload"
      >
        <span class="nav-icon">↻</span>
      </button>

      <button
        id="homeBtn"
        class="toolbar-btn"
        aria-label="Home"
        title="Home"
      >
        ⌂
      </button>

      <div
        id="privateIndicator"
        class="private-indicator"
        aria-label="Private browsing active"
      >
        <span>◉</span>
        <span>Private</span>
      </div>

      <div class="address-wrap">

        <div
          class="address-leading"
          aria-hidden="true"
        >
          <span
            id="securityDot"
            class="security-dot"
          ></span>
        </div>

        <input
          id="addressBar"
          class="address-bar"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search or enter address"
          placeholder="Search or enter address"
        />

        <div
          class="address-trailing"
          aria-hidden="true"
        >
          ⌕
        </div>

        <div
          id="suggestions"
          class="suggestions"
          role="listbox"
        ></div>
      </div>

      <button
        id="bookmarkCurrentBtn"
        class="toolbar-btn"
        aria-label="Bookmark current page"
        title="Bookmark current page"
      >
        ☆
      </button>

      <button
        id="shareBtn"
        class="toolbar-btn"
        aria-label="Share current page"
        title="Share current page"
      >
        ↗
      </button>

      <button
        id="copyBtn"
        class="toolbar-btn"
        aria-label="Copy current URL"
        title="Copy current URL"
      >
        ⧉
      </button>

      <div class="menu-wrap">

        <button
          id="menuBtn"
          class="toolbar-btn"
          aria-label="Browser menu"
          title="More"
        >
          ⋮
        </button>

        <div
          id="browserMenu"
          class="menu"
          role="menu"
        >

          <div class="menu-section">
            <div class="menu-title">New</div>

            <button
              class="menu-row"
              data-action="new-tab"
            >
              <span class="mi">＋</span>
              <span class="ms">New Tab</span>
              <span class="shortcut">Ctrl+T</span>
            </button>

            <button
              class="menu-row"
              data-action="new-private"
            >
              <span class="mi">◉</span>
              <span class="ms">New Private Tab</span>
            </button>

            <button
              class="menu-row"
              data-action="reopen"
            >
              <span class="mi">↶</span>
              <span class="ms">Reopen Closed Tab</span>
              <span class="shortcut">Ctrl+Shift+T</span>
            </button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">History</div>

            <button
              class="menu-row"
              data-action="history"
            >
              <span class="mi">◷</span>
              <span class="ms">History</span>
              <span class="shortcut">Ctrl+H</span>
            </button>

            <button
              class="menu-row"
              data-action="clear-data"
            >
              <span class="mi">⌫</span>
              <span class="ms">Clear Browsing Data</span>
            </button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Bookmarks</div>

            <button
              class="menu-row"
              data-action="bookmark"
            >
              <span class="mi">☆</span>
              <span class="ms">Bookmark This Page</span>
              <span class="shortcut">Ctrl+D</span>
            </button>

            <button
              class="menu-row"
              data-action="bookmarks"
            >
              <span class="mi">★</span>
              <span class="ms">Bookmark Manager</span>
            </button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Downloads</div>

            <button
              class="menu-row"
              data-action="downloads"
            >
              <span class="mi">↓</span>
              <span class="ms">Downloads</span>
              <span class="shortcut">Ctrl+J</span>
            </button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Zoom</div>

            <div class="menu-zoom">

              <button
                class="menu-zoom-btn"
                data-action="zoom-out"
                aria-label="Zoom out"
              >
                −
              </button>

              <div
                class="menu-zoom-value"
                id="menuZoomValue"
              >
                100%
              </div>

              <button
                class="menu-zoom-btn"
                data-action="zoom-reset"
                aria-label="Reset zoom"
              >
                100%
              </button>

              <button
                class="menu-zoom-btn"
                data-action="zoom-in"
                aria-label="Zoom in"
              >
                +
              </button>

            </div>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Tools</div>

            <button
              class="menu-row"
              data-action="find"
            >
              <span class="mi">⌕</span>
              <span class="ms">Find in Page</span>
              <span class="shortcut">Ctrl+F</span>
            </button>

            <button
              class="menu-row"
              data-action="print"
            >
              <span class="mi">⎙</span>
              <span class="ms">Print</span>
            </button>

            <button
              class="menu-row"
              data-action="share"
            >
              <span class="mi">↗</span>
              <span class="ms">Share</span>
            </button>

            <button
              class="menu-row"
              data-action="fullscreen"
            >
              <span class="mi">⛶</span>
              <span class="ms">Fullscreen</span>
            </button>

            <button
              class="menu-row"
              data-action="desktop-site"
            >
              <span class="mi">▣</span>
              <span class="ms">Desktop Site</span>
              <span
                id="desktopSiteLabel"
                class="shortcut"
              >
                Off
              </span>
            </button>

            <button
              class="menu-row"
              data-action="devtools"
            >
              <span class="mi">⌘</span>
              <span class="ms">Developer Tools <small>(unavailable)</small></span>
            </button>

            <button
              class="menu-row"
              data-action="save-page"
            >
              <span class="mi">▣</span>
              <span class="ms">Save Page <small>(browser-managed)</small></span>
            </button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Appearance</div>

            <button
              class="menu-row"
              data-action="theme"
            >
              <span class="mi">◐</span>

  <div
    id="toastZone"
    class="toast-zone"
    aria-live="polite"
  ></div>

  <script>
    (() => {
      "use strict";

      const STORAGE = {
        history:"nova_history",
        bookmarks:"nova_bookmarks",
        settings:"nova_settings",
        tabs:"nova_tabs",
        shortcuts:"nova_shortcuts",
        downloads:"nova_downloads",
        closedTabs:"nova_closed_tabs"
      };

      const ZOOM_LEVELS = [
        50,60,70,80,90,100,
        110,120,130,140,150
      ];

      const DEFAULT_SHORTCUTS = [
        {
          id:"yt",
          name:"YouTube",
          url:"https://www.youtube.com/",
          icon:"▶"
        },
        {
          id:"wiki",
          name:"Wikipedia",
          url:"https://www.wikipedia.org/",
          icon:"W"
        },
        {
          id:"git",
          name:"GitHub",
          url:"https://github.com/",
          icon:"◖"
        },
        {
          id:"gmail",
          name:"Gmail",
          url:"https://mail.google.com/",
          icon:"✉"
        },
        {
          id:"maps",
          name:"Maps",
          url:"https://maps.google.com/",
          icon:"⌖"
        },
        {
          id:"news",
          name:"News",
          url:"https://www.bing.com/news",
          icon:"📰"
        }
      ];

      const DEFAULT_BOOKMARKS = {
        folders:[
          {
            id:"folder-bar",
            name:"Bookmarks Bar",
            items:[]
          },
          {
            id:"folder-other",
            name:"Other Bookmarks",
            items:[]
          }
        ]
      };

      const DEFAULT_SETTINGS = {
        homepage:"nova://newtab",
        startup:"newtab",
        searchProvider:"bing",
        customSearchUrl:
          "https://www.bing.com/search?q={query}",
        theme:"system",
        zoom:100,
        showBookmarksBar:false,
        saveHistory:true,
        openLinksNewTab:false,
        restoreSession:true,
        desktopSite:false
      };

      const state = {
        tabs:[],
        activeTabId:null,
        closedTabs:[],
        history:[],
        bookmarks:
          loadStorage(
            STORAGE.bookmarks,
            DEFAULT_BOOKMARKS
          ),
        settings:
          {
            ...DEFAULT_SETTINGS,
            ...loadStorage(
              STORAGE.settings,
              DEFAULT_SETTINGS
            )
          },
        shortcuts:
          loadStorage(
            STORAGE.shortcuts,
            DEFAULT_SHORTCUTS
          ),
        downloads:
          loadStorage(
            STORAGE.downloads,
            []
          ),
        currentFindMatches:[],
        currentFindIndex:-1
      };

      function clone(value){
        try{
          return JSON.parse(
            JSON.stringify(value)
          );
        }catch{
          return value;
        }
      }

      function uid(prefix="id"){
        return (
          prefix +
          "-" +
          Date.now().toString(36) +
          "-" +
          Math.random()
            .toString(36)
            .slice(2,8)
        );
      }

      function loadStorage(
        key,
        fallback
      ){
        try{
          const raw =
            localStorage.getItem(key);

          if(raw===null){
            return clone(fallback);
          }

          const parsed =
            JSON.parse(raw);

          return parsed ?? clone(fallback);
        }catch{
          return clone(fallback);
        }
      }

      function saveStorage(
        key,
        value
      ){
        try{
          localStorage.setItem(
            key,
            JSON.stringify(value)
          );
          return true;
        }catch{
          toast(
            "Storage is unavailable or full. Changes may not persist."
          );
          return false;
        }
      }

      function esc(value){
        return String(value ?? "")
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#39;");
      }

      function isHttpUrl(url){
        return /^https?:\/\//i.test(
          url || ""
        );
      }

      function isInternal(url){
        return /^nova:\/\//i.test(
          url || ""
        );
      }

      function getCurrentTab(){
        return state.tabs.find(
          tab =>
            tab.id===state.activeTabId
        ) || null;
      }

      function normalizeUrl(value){
        const input =
          String(value || "")
            .trim();

        if(!input){
          return "";
        }

        if(
          /^https?:\/\//i.test(
            input
          )
        ){
          return input;
        }

        if(
          /^www\./i.test(
            input
          )
        ){
          return "https://" + input;
        }

        if(
          /^localhost(?::\d+)?(?:\/.*)?$/i.test(
            input
          )
        ){
          return "http://" + input;
        }

        if(
          /^[a-z0-9.-]+\.[a-z]{2,}(?::\d+)?(?:\/.*)?$/i.test(
            input
          )
        ){
          return "https://" + input;
        }

        return null;
      }

      function providerSearchUrl(
        provider,
        query
      ){
        const q =
          encodeURIComponent(
            query
          );

        switch(provider){
          case "duckduckgo":
            return (
              "https://duckduckgo.com/?q=" +
              q
            );

          case "google":
            return (
              "https://www.google.com/search?q=" +
              q
            );

          case "brave":
            return (
              "https://search.brave.com/search?q=" +
              q
            );

          case "custom":
            return (
              state.settings.customSearchUrl ||
              DEFAULT_SETTINGS.customSearchUrl
            ).replace(
              /\{query\}/g,
              q
            );

          case "bing":
          default:
            return (
              "https://www.bing.com/search?q=" +
              q
            );
        }
      }

      function detectInput(value){
        const normalized =
          normalizeUrl(value);

        if(normalized){
          return {
            type:"url",
            value:normalized
          };
        }

        return {
          type:"search",
          value:String(value || "")
            .trim()
        };
      }

      function titleFromUrl(url){
        if(!url){
          return "NOVA Search";
        }

        if(isInternal(url)){
          const name =
            url.replace(
              "nova://",
              ""
            ).split("?")[0];

          const labels = {
            newtab:"New Tab",
            history:"History",
            bookmarks:"Bookmarks",
            downloads:"Downloads",
            settings:"Settings",
            about:"About NOVA Search"
          };

          return (
            labels[name] ||
            "NOVA Search"
          );
        }

        try{
          return new URL(url)
            .hostname
            .replace(
              /^www\./,
              ""
            );
        }catch{
          return "Web Page";
        }
      }

      function faviconFor(url){
        if(!isHttpUrl(url)){
          return "";
        }

        try{
          const host =
            new URL(url)
              .hostname;

          return (
            "https://icons.duckduckgo.com/ip3/" +
            encodeURIComponent(host) +
            ".ico"
          );
        }catch{
          return "";
        }
      }

      function createTab({
        url="nova://newtab",
        privateMode=false,
        title=null
      }={}){
        return {
          id:uid("tab"),
          title:
            title ||
            titleFromUrl(url),
          url,
          private:!!privateMode,
          history:[url],
          historyIndex:0,
          createdAt:Date.now()
        };
      }

      function pushHistory(
        url,
        title
      ){
        if(!state.settings.saveHistory){
          return;
        }

        if(
          !isHttpUrl(url) &&
          !isInternal(url)
        ){
          return;
        }

        const now =
          Date.now();

        const existing =
          state.history[0];

        if(
          existing &&
          existing.url===url &&
          now-existing.timestamp<5000
        ){
          existing.timestamp=now;
          existing.title=
            title ||
            existing.title;
        }else{
          state.history.unshift({
            id:uid("hist"),
            title:
              title ||
              titleFromUrl(url),
            url,
            timestamp:now,
            favicon:faviconFor(url)
          });
        }

        if(
          state.history.length>1000
        ){
          state.history.length=1000;
        }

        saveStorage(
          STORAGE.history,
          state.history
        );
      }

      function toast(message){
        const zone =
          document.getElementById(
            "toastZone"
          );

        const el =
          document.createElement(
            "div"
          );

        el.className="toast";
        el.textContent=message;

        zone.appendChild(el);

        setTimeout(()=>{
          el.style.opacity="0";
          el.style.transform=
            "translateY(5px)";

          setTimeout(
            ()=>el.remove(),
            180
          );
        },2600);
      }

      function setLoading(
        value
      ){
        document
          .getElementById(
            "loadingOverlay"
          )
          .classList.toggle(
            "active",
            !!value
          );
      }

      function applyTheme(){
        const theme =
          state.settings.theme ||
          "system";

        if(theme==="system"){
          const dark =
            window
              .matchMedia?.(
                "(prefers-color-scheme: dark)"
              )
              ?.matches;

          document.documentElement
            .setAttribute(
              "data-theme",
              dark
                ? "dark"
                : "light"
            );
        }else{
          document.documentElement
            .setAttribute(
              "data-theme",
              theme
            );
        }

        const tab =
          getCurrentTab();

        document
          .getElementById("app")
          .classList.toggle(
            "private-mode",
            !!tab?.private
          );

        document
          .getElementById(
            "bookmarkBar"
          )
          .classList.toggle(
            "show",
            !!state.settings
              .showBookmarksBar &&
              !tab?.private
          );

        document.getElementById(
          "menuThemeLabel"
        ).textContent =
          theme.charAt(0)
            .toUpperCase() +
          theme.slice(1);

        updateZoomUI();
      }

      function renderTabs(){
        const container =
          document.getElementById(
            "tabsScroll"
          );

        container.innerHTML="";

        state.tabs.forEach(
          tab=>{
            const el =
              document.createElement(
                "div"
              );

            el.className =
              "tab" +
              (
                tab.id===
                state.activeTabId
                  ? " active"
                  : ""
              ) +
              (
                tab.private
                  ? " private"
                  : ""
              );

            el.draggable=true;
            el.dataset.tabId=
              tab.id;

            const favicon =
              document.createElement(
                "img"
              );

            favicon.className=
              "tab-favicon";

            favicon.alt="";

            favicon.src =
              faviconFor(tab.url) ||
              "";

            favicon.onerror=()=>{
              favicon.removeAttribute(
                "src"
              );
              favicon.alt="◈";
            };

            const title =
              document.createElement(
                "div"
              );

            title.className=
              "tab-title";

            title.textContent =
              tab.private
                ? "Private · " +
                  (
                    tab.title ||
                    "New Tab"
                  )
                :
                  (
                    tab.title ||
                    "New Tab"
                  );

            const close =
              document.createElement(
                "button"
              );

            close.className=
              "tab-close";

            close.type="button";

            close.setAttribute(
              "aria-label",
              "Close tab"
            );

            close.textContent="×";

            close.addEventListener(
              "click",
              event=>{
                event.stopPropagation();
                closeTab(tab.id);
              }
            );

            el.append(
              favicon,
              title,
              close
            );

            el.addEventListener(
              "click",
              ()=>switchTab(tab.id)
            );

            el.addEventListener(
              "dblclick",
              ()=>duplicateTab(tab.id)
            );

            el.addEventListener(
              "dragstart",
              event=>{
                event.dataTransfer.setData(
                  "text/plain",
                  tab.id
                );
              }
            );

            el.addEventListener(
              "dragover",
              event =>
                event.preventDefault()
            );

            el.addEventListener(
              "drop",
              event=>{
                event.preventDefault();

                reorderTabs(
                  event.dataTransfer.getData(
                    "text/plain"
                  ),
                  tab.id
                );
              }
            );

            container.appendChild(el);
          }
        );

        const active =
          container.querySelector(
            ".tab.active"
          );

        active?.scrollIntoView({
          block:"nearest",
          inline:"nearest"
        });
      }

      function reorderTabs(
        fromId,
        toId
      ){
        if(
          !fromId ||
          !toId ||
          fromId===toId
        ){
          return;
        }

        const from =
          state.tabs.findIndex(
            t=>t.id===fromId
          );

        const to =
          state.tabs.findIndex(
            t=>t.id===toId
          );

        if(
          from<0 ||
          to<0
        ){
          return;
        }

        const moved =
          state.tabs.splice(
            from,
            1
          )[0];

        state.tabs.splice(
          to,
          0,
          moved
        );

        persistTabs();
        renderTabs();
      }

      function persistTabs(){
        if(!state.settings.restoreSession){
          return;
        }

        const normalTabs =
          state.tabs
            .filter(
              tab=>!tab.private
            )
            .map(tab=>({
              title:tab.title,
              url:tab.url,
              history:[
                ...tab.history
              ],
              historyIndex:
                tab.historyIndex
            }));

        saveStorage(
          STORAGE.tabs,
          {
            tabs:normalTabs,
            activeIndex:
              Math.max(
                0,
                state.tabs
                  .filter(
                    t=>!t.private
                  )
                  .findIndex(
                    t =>
                      t.id===
                      state.activeTabId
                  )
              )
          }
        );
      }

      function persistClosedTabs(){
        state.closedTabs =
          state.closedTabs
            .filter(
              t=>!t.private
            )
            .slice(0,20);

        saveStorage(
          STORAGE.closedTabs,
          state.closedTabs
        );
      }

      function renderCurrentTab(){
        const tab =
          getCurrentTab();

        if(!tab){
          return;
        }

        applyTheme();
        renderTabs();
        updateToolbarState();
        renderBookmarkBar();

        const host =
          document.getElementById(
            "pageHost"
          );

        host.innerHTML="";
        host.scrollTop=0;

        setAddressValue(
          tab.url
        );

        if(
          isInternal(tab.url)
        ){
          setLoading(true);
          renderInternalPage(
            tab.url
          );

          setTimeout(
            ()=>setLoading(false),
            100
          );

        }else if(
          isHttpUrl(tab.url)
        ){
          renderWebPage(
            tab.url
          );

        }else{
          renderErrorPage(
            "Invalid URL",
            "This address doesn't look valid.",
            tab.url
          );
        }
      }

      function setAddressValue(
        value
      ){
        document.getElementById(
          "addressBar"
        ).value =
          value==="nova://newtab"
            ? ""
            : value;
      }

      function updateToolbarState(){
        const tab =
          getCurrentTab();

        const back =
          document.getElementById(
            "backBtn"
          );

        const forward =
          document.getElementById(
            "forwardBtn"
          );

        back.disabled =
          !tab ||
          tab.historyIndex<=0;

        forward.disabled =
          !tab ||
          tab.historyIndex>=
            tab.history.length-1;

        const dot =
          document.getElementById(
            "securityDot"
          );

        if(
          tab &&
          /^https:\/\//i.test(
            tab.url
          )
        ){
          dot.style.background=
            "var(--success)";
        }else{
          dot.style.background=
            "var(--warning)";
        }

        document.getElementById(
          "bookmarkCurrentBtn"
        ).textContent =
          isBookmarked(tab?.url)
            ? "★"
            : "☆";

        document.getElementById(
          "desktopSiteLabel"
        ).textContent =
          state.settings.desktopSite
            ? "On"
            : "Off";
      }

      function renderWebPage(
        url
      ){
        const host =
          document.getElementById(
            "pageHost"
          );

        setLoading(true);

        const wrap =
          document.createElement(
            "div"
          );

        wrap.className=
          "web-frame-wrap";

        const notice =
          document.createElement(
            "div"
          );

        notice.className=
          "external-page-notice";

        notice.textContent =
          state.settings.desktopSite
            ? "Desktop Site is enabled. The webpage is displayed using a desktop-width viewport."
            : "NOVA browser shell remains active while the website is displayed inside the page area.";

        const frame =
          document.createElement(
            "iframe"
          );

        frame.className=
          "web-frame" +
          (
            state.settings.desktopSite
              ? " desktop-site"
              : ""
          );

        frame.title=
          titleFromUrl(url);

        frame.referrerPolicy=
          "no-referrer";

        /*
          Microphone removed completely.
          Only non-microphone permissions are retained.
        */
        frame.allow =
          "fullscreen; clipboard-read; clipboard-write; geolocation; camera; autoplay; payment";

        frame.loading="eager";

        frame.src=url;

        /*
          The shell is intentionally NOT replaced when an external website
          refuses iframe embedding. This is the key behavior change.
        */
        frame.addEventListener(
          "load",
          ()=>{
            setLoading(false);

            const active =
              getCurrentTab();

            if(
              active &&
              active.id===
                state.activeTabId
            ){
              active.title =
                titleFromUrl(url);

              renderTabs();
              updateToolbarState();
            }
          }
        );

        frame.addEventListener(
          "error",
          ()=>{
            setLoading(false);
          }
        );

        wrap.append(
          notice,
          frame
        );

        host.appendChild(
          wrap
        );

        setTimeout(
          ()=>setLoading(false),
          8000
        );
      }

      function renderErrorPage(
        title,
        message,
        url=""
      ){
        const host =
          document.getElementById(
            "pageHost"
          );

        host.innerHTML = `
          <div class="error-page">
            <div class="error-card">

              <div class="error-icon">
                !
              </div>

              <div class="error-title">
                ${esc(title)}
              </div>

              <div class="error-text">
                ${esc(message)}
              </div>

              <div class="error-actions">

                ${
                  url
                    ? `
                      <button
                        class="secondary-btn"
                        data-page-action="open"
                      >
                        Open in Browser Tab
                      </button>
                    `
                    : ""
                }

                <button
                  class="primary-btn"
                  data-page-action="home"
                >
                  Go Home
                </button>

              </div>

            </div>
          </div>
        `;

        host
          .querySelector(
            '[data-page-action="open"]'
          )
          ?.addEventListener(
            "click",
            ()=>{
              window.open(
                url,
                "_blank",
                "noopener,noreferrer"
              );
            }
          );

        host
          .querySelector(
            '[data-page-action="home"]'
          )
          ?.addEventListener(
            "click",
            goHome
          );
      }

      function renderInternalPage(
        url
      ){
        const page =
          url
            .replace(
              "nova://",
              ""
            )
            .split("?")[0];

        switch(page){
          case "newtab":
            renderNewTab();
            break;

          case "history":
            renderHistoryPage();
            break;

          case "bookmarks":
            renderBookmarksPage();
            break;

          case "downloads":
            renderDownloadsPage();
            break;

          case "settings":
            renderSettingsPage();

      function manageShortcut(
        action,
        id,
        index
      ){
        if(action==="delete"){
          state.shortcuts =
            state.shortcuts.filter(
              item=>item.id!==id
            );

          saveStorage(
            STORAGE.shortcuts,
            state.shortcuts
          );

          renderCurrentTab();

          toast(
            "Shortcut deleted"
          );

          return;
        }

        if(
          action==="up" &&
          index>0
        ){
          [
            state.shortcuts[index-1],
            state.shortcuts[index]
          ]=[
            state.shortcuts[index],
            state.shortcuts[index-1]
          ];

          saveStorage(
            STORAGE.shortcuts,
            state.shortcuts
          );

          renderCurrentTab();

          return;
        }

        if(
          action==="down" &&
          index<
            state.shortcuts.length-1
        ){
          [
            state.shortcuts[index+1],
            state.shortcuts[index]
          ]=[
            state.shortcuts[index],
            state.shortcuts[index+1]
          ];

          saveStorage(
            STORAGE.shortcuts,
            state.shortcuts
          );

          renderCurrentTab();

          return;
        }

        if(action==="edit"){
          const item =
            state.shortcuts.find(
              s=>s.id===id
            );

          if(!item){
            return;

          openModal(
            "Edit Shortcut",

      function navigateFromInput(
        value,
        newTab=false
      ){
        closeSuggestions();

        const result =
          detectInput(value);

        if(!result.value){
          toast(
            "Enter a search query or web address."
          );
          return;
        }

        if(
          result.type==="url"
        ){
          navigateTo(
            result.value,
            {
              addHistory:true,
              newTab
            }
          );
        }else{
          const url =
            providerSearchUrl(
              state.settings
                .searchProvider,

            {

      function navigateTo(
        url,
        {
          addHistory=true,
          newTab=false,
          title=null,
          privateMode=null
        }={}
      ){
        const current =
          getCurrentTab();

        const targetPrivate =
          privateMode ??
          current?.private ??
          false;

        if(newTab){
          const tab =
            createTab({
              url,
              privateMode:
                targetPrivate,
              title
            });

          state.tabs.push(
            tab
          );

          state.activeTabId=
            tab.id;

          if(
            addHistory &&
            !tab.private
          ){
            pushHistory(
              url,
              title ||
              titleFromUrl(url)
            );
          }

          renderCurrentTab();
          persistTabs();

          return;
        }

        if(!current){
          addTab(
            targetPrivate
          );

          return navigateTo(
            url,
            {
              addHistory,
              newTab:false,
              title,
              privateMode:
                targetPrivate
            }
          );
        }

        if(
          current.historyIndex <
          current.history.length-1
        ){
          current.history =
            current.history.slice(
              0,
              current.historyIndex+1
            );
        }

        if(
          current.history[
            current.history.length-1
          ]!==url
        ){
          current.history.push(
            url
          );

          current.historyIndex =
            current.history.length-1;
        }

        current.url=url;
        current.title =
          title ||
          titleFromUrl(url);

        if(
          addHistory &&
          !current.private
        ){
          pushHistory(
            url,
            current.title
          );
        }

        renderCurrentTab();
        persistTabs();
      }

      function goBack(){
        const tab =
          getCurrentTab();

        if(
          !tab ||
          tab.historyIndex<=0
        ){
          return;
        }

        tab.historyIndex--;

        tab.url =
          tab.history[
            tab.historyIndex
          ];

        tab.title =
          titleFromUrl(tab.url);

        renderCurrentTab();
      }

      function goForward(){
        const tab =
          getCurrentTab();

        if(
          !tab ||
          tab.historyIndex>=
            tab.history.length-1
        ){
          return;
        }

        tab.historyIndex++;

        tab.url =
          tab.history[
            tab.historyIndex
          ];

        tab.title =
          titleFromUrl(tab.url);

        renderCurrentTab();

      function switchTab(
        id
      ){
        if(
          !state.tabs.some(
            t=>t.id===id
          )
        ){
          return;
        }

        state.activeTabId=id;

        renderCurrentTab();
      }

      function duplicateTab(
        id
      ){
        const original =
          state.tabs.find(
            t=>t.id===id
          );

        if(!original){
          return;
        }

        const duplicate =
          createTab({
            url:original.url,
            title:original.title,
            privateMode:
              original.private
          });

        duplicate.history =
          [...original.history];

        duplicate.historyIndex =
          original.historyIndex;

        state.tabs.push(
          duplicate
        );

        state.activeTabId=
          duplicate.id;

        renderCurrentTab();
        persistTabs();

        toast(
          "Tab duplicated"
        );
      }

      function closeTab(
        id
      ){
        const index =
          state.tabs.findIndex(
            t=>t.id===id
          );

        if(index<0){
          return;
        }

        const tab =
          state.tabs[index];

        /*
          Private tabs are intentionally never added to
          persistent closed-tab history.
        */
        if(!tab.private){
          state.closedTabs.unshift({
            title:tab.title,
            url:tab.url,
            history:[
              ...tab.history
            ],
            historyIndex:
              tab.historyIndex
          });

          persistClosedTabs();
        }

        state.tabs.splice(
          index,
          1
        );

        if(
          state.activeTabId===id
        ){
          if(!state.tabs.length){
            state.tabs.push(
              createTab({
                url:"nova://newtab"
              })
            );
          }

          const nextIndex =
            Math.min(
              index,
              state.tabs.length-1
            );

          state.activeTabId =
            state.tabs[
              nextIndex
            ].id;
        }

        renderCurrentTab();
        persistTabs();

        toast(
          "Tab closed"
        );
      }

      function reopenClosedTab(){
        if(
          !state.closedTabs.length
        ){
          toast(
            "No closed tabs to reopen"
          );

          return;
        }

        const closed =
          state.closedTabs.shift();

        const tab =
          createTab({
            url:closed.url,
            title:closed.title,
            privateMode:false
          });

        tab.history =
          Array.isArray(
            closed.history
          ) &&
          closed.history.length
            ? [
                ...closed.history
              ]
            : [
                closed.url
              ];

        tab.historyIndex =
          Math.max(
            0,
            Math.min(
              tab.history.length-1,
              Number(
                closed.historyIndex
              ) || 0
            )
          );

        tab.url =
          tab.history[
            tab.historyIndex
          ];

        state.tabs.push(
          tab
        );

        state.activeTabId=
          tab.id;

        persistClosedTabs();
        persistTabs();
        renderCurrentTab();
      }

      function cycleTab(
        direction
      ){
        if(
          state.tabs.length<2
        ){
          return;
        }

        const index =
          state.tabs.findIndex(
            t=>t.id===
              state.activeTabId
          );

        const next =
          (
            index+
            direction+
            state.tabs.length
          ) %
          state.tabs.length;

        switchTab(
          state.tabs[next].id
        );
      }

      function getZoomPercent(){
        const current =
          Number(
            state.settings.zoom
          );

        return ZOOM_LEVELS.includes(
          current
        )
          ? current
          : 100;
      }

      function updateZoomUI(){
        const zoom =
          getZoomPercent();

        document.documentElement
          .style.setProperty(
            "--page-zoom",
            String(
              zoom/100
            )
          );

        document.getElementById(
          "menuZoomValue"
        ).textContent =
          zoom + "%";

        document.getElementById(
          "desktopSiteLabel"
        ).textContent =
          state.settings.desktopSite
            ? "On"
            : "Off";
      }

      function setZoom(
        value
      ){
        let best =
          ZOOM_LEVELS[0];

        for(
          const level
          of ZOOM_LEVELS
        ){
          if(
            Math.abs(
              level-value
            ) <
            Math.abs(
              best-value
            )
          ){
            best=level;
          }
        }

        state.settings.zoom=best;

        saveStorage(
          STORAGE.settings,
          state.settings
        );

        updateZoomUI();
        renderCurrentTab();
      }

      function changeZoom(
        delta
      ){
        const current =
          getZoomPercent();

        const index =
          ZOOM_LEVELS.indexOf(
            current
          );

        const next =
          Math.max(
            0,
            Math.min(
              ZOOM_LEVELS.length-1,
              index+delta
            )
          );

        setZoom(
          ZOOM_LEVELS[next]
        );
      }

        return state.bookmarks.folders.some(

                item.url===url
            )
        );
      }

                    state.bookmarks.folders.find(

                  if(targetFolder){

                closeModal();

                toast(

      function moveBookmark(
        id,
        sourceId
      ){
        const source =
          state.bookmarks.folders.find(
            f=>f.id===sourceId
          );

        if(!source){
          return;
        }

        openModal(
          "Move Bookmark",
          `
            <div class="form-grid">

              <div class="field">
                <label>
                  Destination folder
                </label>

                <select
                  id="moveFolder"
                >
                  ${
                    state.bookmarks.folders
                      .filter(
                        f=>f.id!==sourceId
                      )
                      .map(
                        f=>`
                          <option
                            value="${esc(f.id)}"
                          >
                            ${esc(f.name)}
                          </option>
                        `
                      )
                      .join("")
                  }
                </select>
              </div>

            </div>
          `,
          [
            {
              label:"Cancel",
              className:"secondary-btn",
              action:closeModal
            },
            {
              label:"Move",
              className:"primary-btn",
              action:()=>{
                const targetId =
                  document
                    .getElementById(
                      "moveFolder"
                    )
                    .value;

                const target =
                  state.bookmarks.folders.find(
                    f=>f.id===targetId
                  );

                const index =
                  source.items.findIndex(
                    item=>item.id===id
                  );

                if(
                  !target ||
                  index<0
                ){
                  return;
                }

                const item =
                  source.items.splice(
                    index,
                    1
                  )[0];

                target.items.push(
                  item
                );

                saveStorage(
                  STORAGE.bookmarks,
                  state.bookmarks
                );

                closeModal();
                renderBookmarksPage();
                renderBookmarkBar();

                toast(
                  "Bookmark moved"
                );
              }
            }
          ]
        );
      }
