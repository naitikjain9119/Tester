              className:"primary-btn",
              action:()=>{
                const targetId =
                  document
                    .getElementById("moveFolder")
                    .value;

                const source =
                  state.bookmarks.folders.find(
                    f=>f.id===currentFolderId
                  );

                const target =
                  state.bookmarks.folders.find(
                    f=>f.id===targetId
                  );

                const index =
                  source?.items.findIndex(
                    i=>i.id===id
                  );

                if(
                  !source ||
                  !target ||
                  index<0
                ){
                  return;
                }

                const [item] =
                  source.items.splice(
                    index,
                    1
                  );

                target.items.push(item);

                saveStorage(
                  STORAGE.bookmarks,
                  state.bookmarks
                );

                closeModal();
                renderBookmarksPage();
                renderBookmarkBar();

                toast(
                  "Bookmark moved"
                );
              }
            }
          ]
        );
      }

      function deleteFolder(folderId){
        const folder =
          state.bookmarks.folders.find(
            f=>f.id===folderId
          );

        if(!folder) return;

        openConfirm(
          "Delete Folder",
          `Delete "${folder.name}" and move its bookmarks to Other Bookmarks?`,
          ()=>{
            const other =
              state.bookmarks.folders.find(
                f=>f.id==="folder-other"
              );

            if(other){
              other.items.push(
                ...folder.items
              );
            }

            state.bookmarks.folders =
              state.bookmarks.folders.filter(
                f=>f.id!==folderId
              );

            saveStorage(
              STORAGE.bookmarks,
              state.bookmarks
            );

            renderBookmarksPage();
            renderBookmarkBar();

            toast(
              "Folder deleted"
            );
          }
        );
      }

      function renderBookmarkBar(){
        const bar =
          document.getElementById(
            "bookmarkBar"
          );

        bar.innerHTML="";

        if(
          !state.settings.showBookmarksBar ||
          getCurrentTab()?.private
        ){
          return;
        }

        const folder =
          state.bookmarks.folders.find(
            f=>f.id==="folder-bar"
          );

        if(
          !folder ||
          !folder.items.length
        ){
          const text =
            document.createElement("span");

          text.style.color =
            "var(--muted)";

          text.style.fontSize =
            "10px";

          text.textContent =
            "Bookmarks Bar";

          bar.appendChild(text);

          return;
        }

        folder.items.forEach(
          item=>{
            const b =
              document.createElement("button");

            b.className =
              "bookmark-link";

            b.innerHTML =
              `★ ${esc(item.title)}`;

            b.title =
              item.url;

            b.addEventListener(
              "click",
              ()=>navigateTo(
                item.url,
                {addHistory:true}
              )
            );

            bar.appendChild(b);
          }
        );
      }

      function wireSettingsEvents(){
        const saveSetting =
          (
            key,
            value,
            msg="Settings saved"
          )=>{
            state.settings[key]=value;

            saveStorage(
              STORAGE.settings,
              state.settings
            );

            persistTabs();
            applyTheme();
            renderCurrentTab();

            toast(msg);
          };

        document
          .getElementById("setHomepage")
          .addEventListener(
            "change",
            ()=>{
              const raw =
                document
                  .getElementById("setHomepage")
                  .value
                  .trim();

              const normalized =
                raw==="nova://newtab" ||
                raw===""
                  ? "nova://newtab"
                  : normalizeUrl(raw);

              if(normalized===null){
                toast(
                  "Enter a valid URL."
                );

                document

      function navigateFromInput(
        value,
        newTab=false
      ){
        closeSuggestions();

        const result =
          detectInput(value);

        if(!result.value){
          toast(
            "Enter a search query or web address."
          );

          return;
        }

        if(result.type==="url"){
          navigateTo(
            result.value,
            {
              addHistory:true,
              newTab
            }
          );
        }else{
          const url =
            providerSearchUrl(
              state.settings.searchProvider,
              result.value
            );

          navigateTo(
            url,
            {
              addHistory:true,
              newTab,
              title:
                `Search: ${result.value}`
            }
          );
        }
      }

      function navigateTo(
        url,
        {
          addHistory=true,
          newTab=false,
          title=null,
          privateMode=null
        }={}
      ){
        const current =
          getCurrentTab();

        const targetPrivate =
          privateMode ??
          current?.private ??
          false;

        if(newTab){
          const tab =
            createTab({
              url,
              privateMode:targetPrivate,
              title
            });

          state.tabs.push(tab);
          state.activeTabId=tab.id;

          if(
            addHistory &&
            !tab.private
          ){
            pushHistory(
              url,
              title ||
              titleFromUrl(url)
            );
          }

          renderCurrentTab();
          persistTabs();

          return;
        }

        if(!current){
          addTab(targetPrivate);

          return navigateTo(
            url,
            {
              addHistory,
              newTab:false,
              title,
              privateMode:
                targetPrivate
            }
          );
        }

        if(
          current.historyIndex <
          current.history.length-1
        ){
          current.history =
            current.history.slice(
              0,
              current.historyIndex+1
            );
        }

        if(
          current.history[
            current.history.length-1
          ] !== url
        ){
          current.history.push(url);

          current.historyIndex =
            current.history.length-1;
        }

        current.url=url;

        current.title =
          title ||
          titleFromUrl(url);

        if(
          addHistory &&
          !current.private
        ){
          pushHistory(
            url,
            current.title
          );
        }

        renderCurrentTab();
        persistTabs();
      }

      function goBack(){

        if(

        tab.title =

      function addTab(
        privateMode=false
      ){
        const tab =
          createTab({
            url:"nova://newtab",
            privateMode

        state.tabs.push(tab);

      function switchTab(id){
        if(
          !state.tabs.some(
            t=>t.id===id
          )
        ){
          return;
        }

        state.activeTabId=id;

        renderCurrentTab();
      }

      function duplicateTab(id){
        const original =
          state.tabs.find(
            t=>t.id===id
          );

        if(!original) return;

        const duplicate =
          createTab({
            url:original.url,
            privateMode:original.private,
            title:original.title
          });

        duplicate.history =
          [...original.history];

        duplicate.historyIndex =
          original.historyIndex;

        state.tabs.push(duplicate);
        state.activeTabId =
          duplicate.id;

        renderCurrentTab();
        persistTabs();

        toast(
          "Tab duplicated"
        );
      }

      function closeTab(id){
        const index =
          state.tabs.findIndex(
            t=>t.id===id
          );

        if(index<0) return;

        const tab =
          state.tabs[index];

        if(!tab.private){
          state.closedTabs.unshift({
            title:tab.title,
            url:tab.url,
            history:[...tab.history],
            historyIndex:
              tab.historyIndex
          });

          persistClosed();
        }

        state.tabs.splice(
          index,
          1
        );

        if(!state.tabs.length){
          addTab(false);

          toast(
            "Tab closed"
          );

          return;
        }

        if(
          state.activeTabId===id
        ){
          const next =
            state.tabs[
              Math.min(
                index,
                state.tabs.length-1
              )
            ];

          state.activeTabId =
            next.id;
        }

        renderCurrentTab();
        persistTabs();

        toast(
          "Tab closed"
        );
      }

      function reopenClosedTab(){
        if(!state.closedTabs.length){
          toast(
            "No closed tabs to reopen"
          );

          return;
        }

        const closed =
          state.closedTabs.shift();

        const tab =
          createTab({
            url:closed.url,
            privateMode:false,
            title:closed.title
          });

        tab.history =
          Array.isArray(
            closed.history
          ) &&
          closed.history.length
            ? closed.history
            : [closed.url];

        tab.historyIndex =
          Math.min(
            Number(
              closed.historyIndex
            ) || 0,
            tab.history.length-1
          );

        state.tabs.push(tab);
        state.activeTabId =
          tab.id;

        persistClosed();
        persistTabs();

        renderCurrentTab();
      }

      function cycleTab(direction){
        if(state.tabs.length<2){
          return;
        }

        const idx =
          state.tabs.findIndex(
            t=>t.id===state.activeTabId
          );

        const next =
          (
            idx +
            direction +
            state.tabs.length
          ) %
          state.tabs.length;

        switchTab(
          state.tabs[next].id
        );
      }

      function setZoom(value){
        const nearest =
          ZOOM_LEVELS.reduce(
            (
              prev,
              curr
            ) =>
              Math.abs(
                curr-value
              ) <
              Math.abs(
                prev-value
              )
                ? curr
                : prev
          );

        state.settings.zoom =
          nearest;

        saveStorage(
          STORAGE.settings,
          state.settings
        );

        updateZoomUI();
        renderCurrentTab();
      }

      function changeZoom(delta){
        const current =
          getZoomPercent();

        const index =
          ZOOM_LEVELS.indexOf(
            current
          );

        setZoom(
          ZOOM_LEVELS[
            Math.max(
              0,
              Math.min(
                ZOOM_LEVELS.length-1,
                index+delta
              )
            )
          ]
        );
      }

      function clearFindMarks(){
        state.currentFindMatches=[];
        state.currentFindIndex=-1;

        document.getElementById(
          "findCount"

        const host =

        host

      function findInCurrentPage(term){
        clearFindMarks();

        term =
          String(term||"")
            .trim();

        if(!term) return;

        const tab =
          getCurrentTab();

        if(!tab) return;

        if(!isInternal(tab.url)){
          document.getElementById(
            "findCount"
          ).textContent =
            "—";

          toast(
            "Find in external pages is controlled by the embedded website's own document."
          );

          return;
        }

        const host =
          document.getElementById(
            "pageHost"
          );

        const walker =
          document.createTreeWalker(
            host,
            NodeFilter.SHOW_TEXT
          );

        const nodes=[];

        let node;

        while(
          node=walker.nextNode()
        ){
          if(
            node.parentElement?.closest(
              "#findBar"
            )
          ){
            continue;
          }

          if(
            (node.nodeValue||"")
              .toLowerCase()
              .includes(
                term.toLowerCase()
              )
          ){
            nodes.push(node);
          }
        }

        const matches=[];

        nodes.forEach(
          textNode=>{
            const text =
              textNode.nodeValue ||
              "";

            const lower =
              text.toLowerCase();

            const needle =
              term.toLowerCase();

            let pos=0;

            while(
              (pos=
                lower.indexOf(
                  needle,
                  pos
                )
              ) !== -1
            ){
              matches.push({
                node:textNode,
                index:pos,
                length:
                  needle.length
              });

              pos +=
                needle.length;
            }
          }
        );

        if(!matches.length){
          document.getElementById(
            "findCount"
          ).textContent =
            "0/0";

          return;
        }

        const byNode =
          new Map();

        matches.forEach(
          m=>{
            if(
              !byNode.has(m.node)
            ){
              byNode.set(
                m.node,
                []
              );
            }

            byNode
              .get(m.node)
              .push(m);
          }
        );

        for(
          const [
            textNode,
            nodeMatches
          ]
          of byNode.entries()
        ){
          const text =
            textNode.nodeValue ||
            "";

          let cursor=0;

          const frag =
            document.createDocumentFragment();

          nodeMatches
            .sort(
              (a,b)=>
                a.index-b.index
            )
            .forEach(m=>{
              frag.appendChild(
                document.createTextNode(
                  text.slice(
                    cursor,
                    m.index
                  )
                )
              );

              const mark =
                document.createElement(
                  "mark"
                );

              mark.className =
                "find-mark";

              mark.textContent =
                text.slice(
                  m.index,
                  m.index+m.length
                );

              frag.appendChild(mark);

              cursor =
                m.index+m.length;
            });

          frag.appendChild(
            document.createTextNode(
              text.slice(cursor)
            )
          );

          textNode.parentNode
            ?.replaceChild(
              frag,
              textNode
            );
        }

        state.currentFindMatches =
          [
            ...host.querySelectorAll(
              ".find-mark"
            )
          ];

        state.currentFindIndex=0;

        updateFindDisplay();
      }

      function updateFindDisplay(){
        const matches =
          state.currentFindMatches;

        const count =
          matches.length;

        document.getElementById(
          "findCount"
        ).textContent =
          count
            ? `${state.currentFindIndex+1}/${count}`
            : "0/0";

        matches.forEach(
          (m,i)=>{
            m.style.outline =
              i===state.currentFindIndex
                ? "2px solid var(--primary)"
                : "none";
          }
        );

        matches[
          state.currentFindIndex
        ]?.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });
      }

      function moveFind(delta){
        if(
          !state.currentFindMatches.length
        ){
          return;
        }

        state.currentFindIndex =
          (
            state.currentFindIndex +
            delta +
            state.currentFindMatches.length
          ) %
          state.currentFindMatches.length;

        updateFindDisplay();
      }

      async function copyText(text){
        try{
          await navigator.clipboard.writeText(
            text
          );

          toast(
            "Link copied!"
          );
        }catch{
          const ta =
            document.createElement(
              "textarea"
            );

          ta.value=text;
          ta.style.position="fixed";
          ta.style.opacity="0";

          document.body.appendChild(ta);

          ta.select();

          const ok =
            document.execCommand(
              "copy"
            );

          ta.remove();

          toast(
            ok
              ? "Link copied!"
              : "Clipboard access was denied."
          );
        }
      }

      function copyCurrentUrl(){

        if(!tab) return;

        copyText(

      async function shareCurrent(){
        const tab =
          getCurrentTab();

        if(!tab) return;

        if(navigator.share){
          try{
            await navigator.share({
              title:
                tab.title ||
                "NOVA Search",
              text:
                "Shared from NOVA Search",
              url:
                isInternal(tab.url)
                  ? location.href
                  : tab.url
            });

            return;
          }catch(error){
            if(
              error?.name==="AbortError"
            ){
              return;
            }
          }
        }

        await copyText(
          isInternal(tab.url)
            ? location.href
            : tab.url
        );
      }

      function startVoiceSearch(){
        const SpeechRecognition =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;

        if(!SpeechRecognition){
          toast(
            "Voice search is not supported by this browser."
          );

          return;
        }

        const rec =
          new SpeechRecognition();

        rec.lang =
          navigator.language ||
          "en-US";

        rec.interimResults=false;
        rec.maxAlternatives=1;

        rec.onstart=()=>{
          toast(
            "Listening…"
          );
        };

        rec.onerror=()=>{
          toast(
            "Voice search could not start."
          );
        };

        rec.onresult=event=>{
          const text =
            event.results?.[0]?.[0]
              ?.transcript ||
            "";

          const addr =
            document.getElementById(
              "addressBar"
            );

          addr.value=text;

          if(
            state.settings.voiceAutoSearch
          ){
            navigateFromInput(
              text,
              false
            );
          }
        };

        try{
          rec.start();
        }catch{
          toast(
            "Voice search is already active."
          );
        }
      }

          document
            .getElementById("clearPrefs")
            ?.checked;

        const range =
          document
            .getElementById("clearRange")
            ?.value;

        if(clearHistory){
          if(range==="all"){
            state.history=[];
          }else if(range==="today"){
            const start =
              new Date();

            start.setHours(
              0,
              0,
              0,
              0
            );

            state.history =
              state.history.filter(
                h =>
                  h.timestamp <
                  start.getTime()
              );
          }else{
            const cutoff =
              Date.now() -
              3600000;

            state.history =
              state.history.filter(
                h =>
                  h.timestamp <
                  cutoff
              );
          }

          saveStorage(
            STORAGE.history,
            state.history
          );
        }

        if(clearBookmarks){
          state.bookmarks =
            structuredCloneSafe(
              DEFAULT_BOOKMARKS
            );

          saveStorage(
            STORAGE.bookmarks,
            state.bookmarks
          );
        }

        if(clearPrefs){
          state.settings =
            structuredCloneSafe(
              DEFAULT_SETTINGS
            );

          saveStorage(
            STORAGE.settings,
            state.settings
          );
        }

        closeModal();

        applyTheme();
        renderCurrentTab();

        toast(
          "Browsing data cleared"
        );
      }

      function exportData(){
        const data = {
          version:1,
          exportedAt:
            new Date().toISOString(),
          history:
            state.history,
          bookmarks:
            state.bookmarks,
          settings:
            state.settings,
          shortcuts:
            state.shortcuts
        };

        const blob =
          new Blob(
            [
              JSON.stringify(
                data,
                null,
                2
              )
            ],
            {
              type:"application/json"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        const a =
          document.createElement(
            "a"
          );

        a.href=url;
        a.download=
          "nova-search-data.json";

        a.click();

        setTimeout(
          ()=>{
            URL.revokeObjectURL(url);
          },
          1000
        );

        toast(
          "Data exported"
        );
      }

      function handleImportFile(
        event
      ){
        const file =
          event.target.files?.[0];

        if(!file) return;

        const reader =
          new FileReader();

        reader.onload=()=>{
          const data =
            safeParse(
              String(
                reader.result || ""
              ),
              null
            );

          if(
            !data ||
            typeof data!=="object"
          ){
            toast(
              "Invalid JSON file."
            );

            event.target.value="";
            return;
          }

          const validBookmarks =
            data.bookmarks &&
            Array.isArray(
              data.bookmarks.folders
            );

          const validHistory =
            Array.isArray(
              data.history
            );

          const validSettings =
            data.settings &&
            typeof data.settings==="object";

          const validShortcuts =
            Array.isArray(
              data.shortcuts
            );

          if(
            !validBookmarks &&
            !validHistory &&
            !validSettings &&
            !validShortcuts
          ){
            toast(
              "The selected file does not contain valid NOVA data."
            );

            event.target.value="";
            return;
          }

          openConfirm(
            "Import Data",
            "Import validated NOVA data and replace matching local data?",
            ()=>{
              if(validHistory){
                state.history =
                  data.history.filter(
                    x =>
                      x &&
                      typeof x.url==="string"
                  );

                saveStorage(
                  STORAGE.history,
                  state.history
                );
              }

              if(validBookmarks){
                state.bookmarks =
                  data.bookmarks;

                saveStorage(
                  STORAGE.bookmarks,
                  state.bookmarks
                );
              }

              if(validSettings){
                state.settings = {
                  ...DEFAULT_SETTINGS,
                  ...data.settings
                };

                saveStorage(
                  STORAGE.settings,
                  state.settings
                );
              }

              if(validShortcuts){
                state.shortcuts =
                  data.shortcuts.filter(
                    x =>
                      x &&
                      x.name &&
                      x.url
                  );

                saveStorage(
                  STORAGE.shortcuts,
                  state.shortcuts
                );
              }

              applyTheme();
              renderCurrentTab();

              toast(
                "Data imported"
              );
            }
          );

          event.target.value="";
        };

        reader.onerror=()=>{
          toast(
            "Unable to read the selected file."
          );
        };

        reader.readAsText(file);
      }

      function resetApplication(){
        openConfirm(
          "Reset NOVA Search",
          "This removes NOVA-managed history, bookmarks, preferences, shortcuts, tabs and download metadata.",
          ()=>{
            Object.values(
              STORAGE
            ).forEach(k=>{
              try{
                localStorage.removeItem(k);
              }catch{}
            });

            state.history=[];

            state.bookmarks =
              structuredCloneSafe(
                DEFAULT_BOOKMARKS
              );

            state.settings =
              structuredCloneSafe(
                DEFAULT_SETTINGS
              );

            state.shortcuts =
              structuredCloneSafe(
                DEFAULT_SHORTCUTS
              );

            state.downloads=[];

            state.closedTabs=[];

            state.tabs=[
              createTab({
                url:"nova://newtab"
              })
            ];

            state.activeTabId =
              state.tabs[0].id;

            applyTheme();
            renderCurrentTab();

            toast(
              "NOVA Search has been reset"
            );
          }
        );
      }

      function triggerDownload(
        url,
        name
      ){
        if(!isHttpUrl(url)){
          toast(
            "Only web URLs can be opened as downloads."
          );

          return;
        }

        const item = {
          id:uid("download"),
          name:
            name ||
            deriveFilename(url),
          url,
          timestamp:Date.now(),
          status:"started"
        };

        state.downloads.unshift(item);

        if(
          state.downloads.length>300
        ){
          state.downloads.length=300;
        }

        saveStorage(
          STORAGE.downloads,
          state.downloads
        );

        const a =
          document.createElement("a");

        a.href=url;
        a.target="_blank";
        a.rel=
          "noopener noreferrer";
        a.download=item.name;

        document.body.appendChild(a);

        a.click();
        a.remove();

        toast(
          "Download started. Browser download permissions apply."
        );
      }

      function deriveFilename(url){
        try{
          const u =
            new URL(url);

          const last =
            u.pathname
              .split("/")
              .filter(Boolean)
              .pop();

          return (
            last ||
            u.hostname
          );
        }catch{
          return "download";
        }
      }

      function cycleTheme(){
        const next =
          state.settings.theme==="light"
            ? "dark"
            : state.settings.theme==="dark"
              ? "system"
              : "light";

        state.settings.theme=next;

        saveStorage(
          STORAGE.settings,
          state.settings
        );

        applyTheme();
        renderCurrentTab();

        toast(
          "Theme: "+next
        );
      }

      /*
        CHANGE 2:
        Toggle the client-side Desktop Site mode.
        This changes the embedded viewport width but cannot change the
        browser/network user-agent used by a real external browser tab.
      */
      function toggleDesktopSite(){
        state.settings.desktopSite =
          !state.settings.desktopSite;

        saveStorage(
          STORAGE.settings,
          state.settings
        );

        applyTheme();
        renderCurrentTab();

        toast(
          state.settings.desktopSite
            ? "Desktop Site enabled"
            : "Desktop Site disabled"
        );
      }

      function handleMenuAction(
        action
      ){
        closeMenu();

        switch(action){
          case "new-tab":
            addTab(false);
            break;

          case "new-private":
            addTab(true);
            break;

          case "reopen":
            reopenClosedTab();
            break;

          case "history":
            navigateTo(
              "nova://history",
              {addHistory:false}
            );
            break;

          case "clear-data":
            openClearDataModal();
            break;

          case "bookmark":
            toggleBookmarkCurrent();
            break;

          case "bookmarks":
            navigateTo(
              "nova://bookmarks",
              {addHistory:false}
            );
            break;

          case "downloads":
            navigateTo(
              "nova://downloads",
              {addHistory:false}
            );
            break;

          case "zoom-out":
            changeZoom(-1);
            break;

          case "zoom-reset":
            setZoom(100);
            break;

          case "zoom-in":
            changeZoom(1);
            break;

          case "find":
            openFind();
            break;

          case "print":
            window.print();
            break;

          case "share":
            shareCurrent();
            break;

          case "fullscreen":
            toggleFullscreen();
            break;

          /*
            CHANGE 2: menu action
          */
          case "desktop-site":
            toggleDesktopSite();
            break;

          case "devtools":
            toast(
              "Developer Tools are controlled by the browser and cannot be programmatically opened universally."
            );
            break;

          case "save-page":
            toast(
              "Saving arbitrary external pages is browser-managed and cannot be implemented reliably from a webpage."
            );
            break;

          case "theme":
            cycleTheme();
            break;

          case "settings":
            navigateTo(
              "nova://settings",
              {addHistory:false}
            );
            break;

          case "about":
            navigateTo(
              "nova://about",
              {addHistory:false}
            );
            break;
        }
      }

      async function toggleFullscreen(){
        try{
          if(document.fullscreenElement){
            await document.exitFullscreen();
          }else{
            await document.documentElement.requestFullscreen();
          }
        }catch{
          toast(
            "Fullscreen is not supported or permission was denied."
          );
        }
      }

      function showSuggestions(
        value
      ){
        const box =
          document.getElementById(
            "suggestions"
          );

        const query =
          String(value||"").trim();

        if(!query){
          box.classList.remove(
            "show"
          );

          box.innerHTML="";

          return;
        }

        const recent =
          state.history
            .filter(
              h =>
                h.title
                  ?.toLowerCase()
                  .includes(
                    query.toLowerCase()
                  ) ||
                h.url
                  ?.toLowerCase()
                  .includes(
                    query.toLowerCase()
                  )
            )
            .slice(0,4)
            .map(
              h=>({
                text:
                  h.title ||
                  h.url,
                source:"History"
              })
            );

        const generated=[
          {
            text:query,
            source:"Search"
          },
          {
            text:query+" news",
            source:"Search"
          },
          {
            text:
              query+
              " latest information",
            source:"Search"
          },
          {
            text:
              query+
              " near me",
            source:"Search"
          },
          {
            text:
              query+
              " guide",
            source:"Search"
          }
        ];

        const seen=
          new Set();

        const suggestions =
          [
            ...recent,
            ...generated
          ]
            .filter(
              x=>{
                if(
                  seen.has(
                    x.text.toLowerCase()
                  )
                ){
                  return false;
                }

                seen.add(
                  x.text.toLowerCase()
                );

                return true;
              }
            )
            .slice(0,7);

        box.innerHTML="";

        suggestions.forEach(
          item=>{
            const row =
              document.createElement(
                "div"
              );

            row.className =
              "suggestion";

            row.setAttribute(
              "role",
              "option"
            );

            row.innerHTML = `
              <div class="suggestion-icon">
                ${
                  item.source==="History"
                    ? "◷"
                    : "⌕"
                }
              </div>

              <div class="suggestion-text">
                ${esc(item.text)}
              </div>
            `;

            row.addEventListener(
              "mousedown",
              e=>{
                e.preventDefault();

                document.getElementById(
                  "addressBar"
                ).value =
                  item.text;

                closeSuggestions();

                navigateFromInput(
                  item.text,
                  false
                );
              }
            );

            box.appendChild(row);
          }
        );

        box.classList.toggle(
          "show",
          !!suggestions.length
        );
      }

      function closeSuggestions(){
        document
          .getElementById(
            "suggestions"
          )
          .classList.remove("show");
      }

      function focusAddress(){
        const input =
          document.getElementById(
            "addressBar"
          );

        input.focus();
        input.select();
      }

      function handleContextMenu(event){
        event.preventDefault();

        const menu =
          document.getElementById(
            "contextMenu"
          );

        state.contextX =
          Math.min(
            event.clientX,
            window.innerWidth-225
          );

        state.contextY =
          Math.min(
            event.clientY,
            window.innerHeight-285
          );

        menu.style.left =
          state.contextX+"px";

        menu.style.top =
          state.contextY+"px";

        menu.classList.add(
          "show"
        );
      }

      function hideContextMenu(){
        document
          .getElementById(
            "contextMenu"
          )
          .classList.remove(
            "show"
          );
      }

      function handleContextAction(
        action
      ){
        hideContextMenu();

        switch(action){
          case "back":
            goBack();
            break;

          case "forward":
            goForward();
            break;

          case "reload":
            reloadCurrent();
            break;

          case "bookmark":
            toggleBookmarkCurrent();
            break;

          case "copy":
            copyCurrentUrl();
            break;

          case "new-tab":{
            const tab =
              getCurrentTab();

            if(tab){
              navigateTo(
                tab.url,
                {
                  addHistory:false,
                  newTab:true
                }
              );
            }

            break;
          }

          case "new-window":{
            const tab =
              getCurrentTab();

            if(tab){
              openInNewWindow(
                tab.url
              );
            }

            break;
          }

          case "inspect":
            toast(
              "Inspect is controlled by your browser's Developer Tools."
            );
            break;
        }
      }

      document
        .getElementById("backBtn")
        .addEventListener(
          "click",
          goBack
        );

      document
        .getElementById("forwardBtn")
        .addEventListener(
          "click",
          goForward
        );

      document
        .getElementById("reloadBtn")
        .addEventListener(
          "click",
          reloadCurrent
        );

      document
        .getElementById("homeBtn")
        .addEventListener(
          "click",
          goHome
        );

      document
        .getElementById("newTabBtn")
        .addEventListener(
          "click",
          ()=>addTab(false)
        );

      document
        .getElementById(
          "bookmarkCurrentBtn"
        )
        .addEventListener(
          "click",
          toggleBookmarkCurrent
        );

      document
        .getElementById("shareBtn")
        .addEventListener(
          "click",
          shareCurrent
        );

      document
        .getElementById("copyBtn")
        .addEventListener(
          "click",
          copyCurrentUrl
        );

      document
        .getElementById("menuBtn")
        .addEventListener(
          "click",
          e=>{
            e.stopPropagation();
            toggleMenu();
          }
        );

      document
        .querySelectorAll(
          ".menu-row,.menu-zoom-btn"
        )
        .forEach(
          el=>{
            el.addEventListener(
              "click",
              ()=>{
                handleMenuAction(
                  el.dataset.action
                );
              }
            );
          }
        );

      const address =
        document.getElementById(
          "addressBar"
        );

      address.addEventListener(
        "focus",
        ()=>{
          address.select();
        }
      );

      address.addEventListener(
        "input",
        ()=>{
          showSuggestions(
            address.value
          );
        }
      );

      address.addEventListener(
        "keydown",
        e=>{
          if(e.key==="Enter"){
            navigateFromInput(
              address.value,
              false
            );
          }else if(
            e.key==="Escape"
          ){
            closeSuggestions();
          }
        }
      );

      document
        .getElementById("findInput")
        .addEventListener(
          "input",
          e=>{
            findInCurrentPage(
              e.target.value
            );
          }
        );

      document
        .getElementById("findNext")
        .addEventListener(
          "click",
          ()=>moveFind(1)
        );

      document
        .getElementById("findPrev")
        .addEventListener(
          "click",
          ()=>moveFind(-1)
        );

      document
        .getElementById("findClose")
        .addEventListener(
          "click",
          closeFind
        );

      document
        .getElementById("mobileBack")
        .addEventListener(
          "click",
          goBack
        );

      document
        .getElementById("mobileHome")
        .addEventListener(
          "click",
          goHome
        );

      document
        .getElementById("mobileTabs")
        .addEventListener(
          "click",
          ()=>{
            document
              .getElementById(
                "tabsScroll"
              )
              .scrollIntoView({
                behavior:"smooth",
                block:"nearest"
              });
          }
        );

      document
        .getElementById("mobileMenu")
        .addEventListener(
          "click",
          toggleMenu
        );

      document
        .getElementById("modalBackdrop")
        .addEventListener(
          "click",
          e=>{
            if(
              e.target===e.currentTarget
            ){
              closeModal();
            }
          }
        );

      document.addEventListener(
        "click",
        e=>{
          if(
            !e.target.closest(
              ".menu-wrap"
            )
          ){
            closeMenu();
          }

          if(
            !e.target.closest(
              ".address-wrap"
            )
          ){
            closeSuggestions();
          }

          if(
            !e.target.closest(
              "#contextMenu"
            )
          ){
            hideContextMenu();
          }
        }
      );

      document
        .querySelectorAll(
          ".context-item"
        )
        .forEach(
          btn=>{
            btn.addEventListener(
              "click",
              ()=>{
                handleContextAction(
                  btn.dataset.context
                );
              }
            );
          }
        );

      document.addEventListener(
        "contextmenu",
        handleContextMenu
      );

      document.addEventListener(
        "keydown",
        e=>{
          const key =
            e.key.toLowerCase();

          const ctrl =
            e.ctrlKey ||
            e.metaKey;

          if(
            ctrl &&
            key==="l"
          ){
            e.preventDefault();

            focusAddress();

            return;
          }

          if(
            ctrl &&
            key==="t"
          ){
            e.preventDefault();

            addTab(false);

            return;
          }

          if(
            ctrl &&
            key==="w"
          ){
            e.preventDefault();

            const tab =
              getCurrentTab();

            if(tab){
              closeTab(tab.id);
            }

            return;
          }

          if(
            ctrl &&
            e.shiftKey &&
            key==="t"
          ){
            e.preventDefault();

            reopenClosedTab();

            return;
          }

          if(
            ctrl &&
            key==="f"
          ){
            e.preventDefault();

            openFind();

            return;
          }

          if(
            ctrl &&
            key==="d"
          ){
            e.preventDefault();

            toggleBookmarkCurrent();

            return;
          }

          if(
            ctrl &&
            key==="r"
          ){
            e.preventDefault();

            reloadCurrent();

            return;
          }

          if(
            ctrl &&
            key==="h"
          ){
            e.preventDefault();

            navigateTo(
              "nova://history",
              {
                addHistory:false
              }
            );

            return;
          }

          if(
            ctrl &&
            key==="j"
          ){
            e.preventDefault();

            navigateTo(
              "nova://downloads",
              {
                addHistory:false
              }
            );

            return;
          }

          if(
            ctrl &&
            e.shiftKey &&
            key==="tab"
          ){
            e.preventDefault();

            cycleTab(-1);

            return;
          }

          if(
            ctrl &&
            key==="tab"
          ){
            e.preventDefault();

            cycleTab(1);

            return;
          }

          if(
            ctrl &&
            (
              key==="+" ||
              key==="="
            )
          ){
            e.preventDefault();

            changeZoom(1);

            return;
          }

          if(
            ctrl &&
            key==="-"
          ){
            e.preventDefault();

            changeZoom(-1);

            return;
          }

          if(
            ctrl &&
            key==="0"
          ){
            e.preventDefault();

            setZoom(100);

            return;
          }

          if(
            e.key==="Escape"
          ){
            closeSuggestions();
            closeMenu();
            hideContextMenu();
          }
        }
      );

      window
        .matchMedia?.(
          "(prefers-color-scheme: dark)"
        )
        ?.addEventListener?.(
          "change",
          ()=>{
            if(
              state.settings.theme==="system"
            ){
              applyTheme();
              renderCurrentTab();
            }
          }
        );

      window.addEventListener(
        "beforeunload",
        ()=>{
          persistTabs();
        }
      );

      function initialize(){
        ensureBookmarkFolders();

        state.history =
          loadStorage(
            STORAGE.history,
            []
          );

        state.closedTabs =
          loadStorage(
            STORAGE.closedTabs,
            []
          );

        const savedSession =
          loadStorage(
            STORAGE.tabs,
            null
          );

        state.tabs=[];

        if(
          state.settings.restoreSession &&
          savedSession?.tabs?.length &&
          state.settings.startup==="restore"
        ){
          savedSession.tabs.forEach(
            raw=>{
              if(
                !raw.private &&
                raw.url
              ){
                const tab =
                  createTab({
                    url:raw.url,
                    title:
                      raw.title ||
                      titleFromUrl(
                        raw.url
                      ),
                    privateMode:false
                  });

                if(
                  Array.isArray(
                    raw.history
                  ) &&
                  raw.history.length
                ){
                  tab.history =
                    raw.history.filter(
                      Boolean
                    );

                  tab.historyIndex =
                    Math.min(
                      Math.max(
                        Number(
                          raw.historyIndex
                        ) || 0,
                        0
                      ),
                      tab.history.length-1
                    );

                  tab.url =
                    tab.history[
                      tab.historyIndex
                    ];
                }

                state.tabs.push(
                  tab
                );
              }
            }
          );

          if(state.tabs.length){
            const activeIndex =
              Number(
                savedSession.activeIndex
              );

            state.activeTabId =
              state.tabs[
                Math.max(
                  0,
                  Math.min(
                    state.tabs.length-1,
                    Number.isFinite(
                      activeIndex
                    )
                      ? activeIndex
                      : 0
                  )
                )
              ].id;
          }
        }

        if(!state.tabs.length){
          state.tabs.push(
            createTab({
              url:"nova://newtab"
            })
          );

          state.activeTabId =
            state.tabs[0].id;
        }

        applyTheme();
        renderCurrentTab();
      }

      initialize();
    })();
  </script>
