<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="NOVA Search — a modern browser-style search experience built as a single-file web application." />
  <title>NOVA Search</title>

  <style>
    :root{
      --bg:#f4f7fb;
      --surface:#ffffff;
      --surface-2:#eef2f8;
      --surface-3:#e7ecf4;
      --text:#142033;
      --muted:#667085;
      --line:#d8dee9;
      --primary:#5b5ce2;
      --primary-2:#7879f2;
      --danger:#e74c3c;
      --success:#1f9d67;
      --warning:#d99100;
      --shadow:0 10px 30px rgba(22,32,51,.10);
      --shadow-soft:0 3px 14px rgba(22,32,51,.08);
      --radius:16px;
      --toolbar-height:62px;
      --tabs-height:44px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-top:env(safe-area-inset-top,0px);
      --page-zoom:1;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    [data-theme="dark"]{
      --bg:#090d18;
      --surface:#111827;
      --surface-2:#182133;
      --surface-3:#202b40;
      --text:#edf2ff;
      --muted:#9aa8c0;
      --line:#29354b;
      --primary:#8586ff;
      --primary-2:#9a9bff;
      --shadow:0 12px 35px rgba(0,0,0,.30);
      --shadow-soft:0 4px 16px rgba(0,0,0,.22);
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
    body{font-size:14px}
    button,input,select,textarea{font:inherit}
    button{border:0}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
      outline:3px solid color-mix(in srgb,var(--primary) 38%,transparent);
      outline-offset:2px;
    }
    a{color:inherit}

    .app{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      background:var(--bg);
    }

    .private-mode{
      --bg:#08090f;
      --surface:#12131c;
      --surface-2:#191b27;
      --surface-3:#242635;
      --text:#f6f1ff;
      --muted:#ada7bb;
      --line:#302f42;
      --primary:#9a72ff;
      --primary-2:#b08cff;
      --shadow:0 12px 35px rgba(0,0,0,.38);
      --shadow-soft:0 4px 16px rgba(0,0,0,.30);
    }

    .private-mode .brand-mark{
      box-shadow:0 0 0 5px rgba(154,114,255,.10),0 0 24px rgba(154,114,255,.30);
    }

    .tabs-bar{
      height:calc(var(--tabs-height) + var(--safe-top));
      padding-top:var(--safe-top);
      background:var(--surface-2);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:flex-end;
      padding-left:8px;
      padding-right:8px;
      gap:5px;
      flex-shrink:0;
    }

    .tabs-scroll{
      display:flex;
      align-items:flex-end;
      gap:5px;
      min-width:0;
      flex:1;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      height:100%;
    }

    .tabs-scroll::-webkit-scrollbar{display:none}

    .tab{
      height:38px;
      min-width:130px;
      max-width:240px;
      padding:0 8px 0 10px;
      display:flex;
      align-items:center;
      gap:8px;
      background:transparent;
      color:var(--muted);
      border-radius:12px 12px 0 0;
      cursor:pointer;
      user-select:none;
      position:relative;
      transition:.18s ease;
    }

    .tab:hover{background:color-mix(in srgb,var(--surface) 66%,transparent)}

    .tab.active{
      background:var(--surface);
      color:var(--text);
      box-shadow:var(--shadow-soft);
    }

    .tab.private{
      background:color-mix(in srgb,#6d4ca0 18%,transparent);
    }

    .tab.private.active{
      background:#171423;
    }

    .tab-favicon{
      width:18px;
      height:18px;
      border-radius:5px;
      flex:none;
      object-fit:cover;
      background:var(--surface-3);
    }

    .tab-title{
      flex:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:12px;
      font-weight:600;
    }

    .tab-close{
      width:25px;
      height:25px;
      border-radius:7px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      display:grid;
      place-items:center;
      flex:none;
      transition:.15s ease;
    }

    .tab-close:hover{
      color:var(--text);
      background:var(--surface-3);
    }

    .new-tab-btn{
      width:38px;
      height:38px;
      flex:none;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
      font-size:23px;
      margin-bottom:0;
    }

    .new-tab-btn:hover{background:var(--surface-3)}

    .browser-toolbar{
      height:var(--toolbar-height);
      min-height:var(--toolbar-height);
      padding:8px 10px;
      display:flex;
      align-items:center;
      gap:7px;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      box-shadow:0 2px 12px rgba(0,0,0,.04);
      position:relative;
      z-index:20;
    }

    .nav-btn,.toolbar-btn{
      width:39px;
      height:39px;
      border-radius:12px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
      flex:none;
      transition:.15s ease;
    }

    .nav-btn:hover,.toolbar-btn:hover{background:var(--surface-2)}
    .nav-btn:disabled{opacity:.36;cursor:not-allowed}
    .nav-icon{font-size:20px;line-height:1}
    .toolbar-btn.small-label{width:auto;padding:0 11px;font-size:12px;font-weight:700}

    .address-wrap{
      min-width:0;
      flex:1;
      position:relative;
    }

    .address-bar{
      width:100%;
      height:42px;
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--text);
      border-radius:18px;
      padding:0 42px 0 40px;
      transition:.18s ease;
    }

    .address-bar:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}

    .address-bar:focus{
      background:var(--surface);
      border-color:var(--primary);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent);
    }

    .address-leading,.address-trailing{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:30px;
      height:30px;
      border-radius:9px;
      display:grid;
      place-items:center;
      pointer-events:none;
    }

    .address-leading{left:6px}
    .address-trailing{right:6px}

    .security-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--success);
      box-shadow:0 0 10px color-mix(in srgb,var(--success) 42%,transparent);
    }

    .suggestions{
      position:absolute;
      left:0;
      right:0;
      top:48px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:none;
      z-index:100;
      max-height:340px;
      overflow-y:auto;
    }

    .suggestions.show{display:block}

    .suggestion{
      display:flex;
      gap:11px;
      align-items:center;
      padding:12px 14px;
      cursor:pointer;
    }

    .suggestion:hover,.suggestion.active{background:var(--surface-2)}

    .suggestion-icon{
      width:31px;
      height:31px;
      border-radius:10px;
      background:var(--surface-2);
      display:grid;
      place-items:center;
      flex:none;
      color:var(--muted);
    }

    .suggestion-text{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .private-indicator{
      display:none;
      height:34px;
      padding:0 11px;
      border-radius:11px;
      background:#211a30;
      color:#dacbff;
      align-items:center;
      gap:7px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      flex:none;
    }

    .private-mode .private-indicator{display:flex}

    .menu-wrap{position:relative;flex:none}

    .menu{
      position:absolute;
      top:48px;
      right:0;
      width:330px;
      max-height:calc(100vh - 66px);
      overflow:auto;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:8px;
      display:none;
      z-index:120;
    }

    .menu.show{
      display:block;
      animation:menuIn .16s ease;
    }

    @keyframes menuIn{
      from{opacity:0;transform:translateY(-4px) scale(.99)}
      to{opacity:1;transform:none}
    }

    .menu-section{padding:4px 0}

    .menu-title{
      padding:7px 11px 5px;
      color:var(--muted);
      font-size:10px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .menu-row{
      width:100%;
      min-height:40px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      padding:0 11px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      text-align:left;
    }

    .menu-row:hover{background:var(--surface-2)}

    .menu-row .mi{
      width:20px;
      text-align:center;
      color:var(--muted);
      flex:none;
    }

    .menu-row .ms{flex:1}

    .menu-row .shortcut{
      color:var(--muted);
      font-size:11px;
    }

    .menu-divider{
      height:1px;
      background:var(--line);
      margin:5px 2px;
    }

    .menu-zoom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .menu-zoom-btn{
      width:36px;
      height:34px;
      border-radius:9px;
      background:var(--surface-2);
      color:var(--text);
      cursor:pointer;
      font-size:18px;
    }

    .menu-zoom-value{
      min-width:52px;
      text-align:center;
      font-weight:800;
    }

    .bookmark-bar{
      min-height:33px;
      display:none;
      align-items:center;
      gap:5px;
      padding:3px 10px;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      overflow-x:auto;
      scrollbar-width:none;
    }

    .bookmark-bar.show{display:flex}
    .bookmark-bar::-webkit-scrollbar{display:none}

    .bookmark-link{
      height:27px;
      white-space:nowrap;
      border-radius:8px;
      padding:0 9px;
      display:flex;
      align-items:center;
      gap:6px;
      color:var(--text);
      cursor:pointer;
      font-size:11px;
    }

    .bookmark-link:hover{background:var(--surface-2)}

    .content-viewport{
      position:relative;
      flex:1;
      min-height:0;
      overflow:hidden;
      background:var(--bg);
    }

    .page-host{
      width:100%;
      height:100%;
      position:relative;
      overflow:auto;
      background:var(--bg);
    }

    .page-host.desktop-site-host{
      overflow:auto;
    }

    .zoom-surface{
      width:100%;
      min-height:100%;
      transform-origin:top left;
      transform:scale(var(--page-zoom));
      width:calc(100% / var(--page-zoom));
      min-height:calc(100% / var(--page-zoom));
    }

    .web-frame{
      display:block;
      width:calc(100% / var(--page-zoom));
      height:calc(100% / var(--page-zoom));
      transform:scale(var(--page-zoom));
      transform-origin:top left;
      border:0;
      background:#fff;
    }

    /* CHANGE 2: Desktop Site makes embedded pages use a desktop-width viewport. */
    .web-frame.desktop-site{
      width:1280px !important;
      max-width:none !important;
    }

    .internal-page{
      min-height:100%;
      padding:28px;
      background:var(--bg);
    }

    .newtab-page{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 18px 70px;
    }

    .newtab-inner{
      width:min(980px,100%);
    }

    .newtab-brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-bottom:25px;
    }

    .brand-mark{
      width:82px;
      height:82px;
      border-radius:27px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,var(--primary),var(--primary-2));
      box-shadow:0 15px 40px color-mix(in srgb,var(--primary) 30%,transparent);
      position:relative;
      overflow:hidden;
    }

    .brand-mark:before,
    .brand-mark:after{
      content:"";
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,.16);
    }

    .brand-mark:before{
      width:100px;
      height:100px;
      right:-45px;
      top:-50px;
    }

    .brand-mark:after{
      width:75px;
      height:75px;
      left:-36px;
      bottom:-30px;
    }

    .brand-n{
      position:relative;
      z-index:1;
      color:#fff;
      font-size:43px;
      font-weight:950;
      letter-spacing:-.08em;
      transform:skewX(-9deg);
    }

    .newtab-title{
      margin-top:15px;
      font-size:28px;
      font-weight:950;
      letter-spacing:-.04em;
    }

    .newtab-subtitle{
      color:var(--muted);
      text-align:center;
      margin-top:5px;
    }

    .hero-search{
      width:min(760px,100%);
      margin:0 auto;
      position:relative;
    }

    .hero-search input{
      width:100%;
      height:58px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:21px;
      padding:0 118px 0 22px;
      box-shadow:var(--shadow-soft);
      font-size:16px;
    }

    .hero-search button{
      position:absolute;
      top:7px;
      width:44px;
      height:44px;
      border-radius:14px;
      background:var(--surface-2);
      color:var(--text);
      cursor:pointer;
    }

    .hero-search .hero-submit{
      right:7px;
      background:var(--primary);
      color:#fff;
    }

    .hero-search .hero-mic{right:57px}
    .hero-search button:hover{filter:brightness(.97)}

    .quick-title{
      width:min(760px,100%);
      margin:30px auto 10px;
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.12em;
    }

    .shortcuts-grid{
      width:min(760px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }

    .shortcut-card{
      min-height:98px;
      padding:15px 11px;
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:9px;
      position:relative;
      transition:.18s ease;
    }

    .shortcut-card:hover{
      transform:translateY(-2px);
      border-color:color-mix(in srgb,var(--primary) 28%,var(--line));
    }

    .shortcut-icon{
      width:36px;
      height:36px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:var(--surface-2);
      font-size:18px;
    }

    .shortcut-name{
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    .shortcut-actions{
      position:absolute;
      top:6px;
      right:6px;
      display:flex;
      gap:3px;
      opacity:0;
      transition:.15s ease;
    }

    .shortcut-card:hover .shortcut-actions{opacity:1}

    .shortcut-action{
      width:24px;
      height:24px;
      border-radius:7px;
      background:var(--surface-2);
      color:var(--muted);
      cursor:pointer;
      font-size:11px;
    }

    .add-shortcut{border-style:dashed}

    .internal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .internal-title{
      font-size:25px;
      font-weight:950;
      letter-spacing:-.03em;
    }

    .internal-subtitle{
      color:var(--muted);
      margin-top:4px;
    }

    .header-actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    .primary-btn,.secondary-btn,.danger-btn{
      min-height:38px;
      padding:0 13px;
      border-radius:11px;
      cursor:pointer;
      font-weight:800;
    }

    .primary-btn{background:var(--primary);color:#fff}

    .secondary-btn{
      background:var(--surface);
      color:var(--text);
      border:1px solid var(--line);
    }

    .danger-btn{
      background:color-mix(in srgb,var(--danger) 12%,var(--surface));
      color:var(--danger);
      border:1px solid color-mix(in srgb,var(--danger) 20%,var(--line));
    }

    .primary-btn:hover,.secondary-btn:hover,.danger-btn:hover{
      filter:brightness(.98);
    }

    .panel{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
    }

    .panel + .panel{margin-top:14px}

    .history-controls{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .search-input{
      height:42px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:12px;
      padding:0 12px;
      min-width:240px;
    }

    .filter-select{
      height:42px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:12px;
      padding:0 10px;
    }

    .history-list,.bookmark-list,.download-list{
      display:flex;
      flex-direction:column;
    }

    .list-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      border-top:1px solid var(--line);
    }

    .list-item:first-child{border-top:0}

    .list-icon{
      width:37px;
      height:37px;
      border-radius:11px;
      background:var(--surface-2);
      display:grid;
      place-items:center;
      flex:none;
    }

    .list-main{
      min-width:0;
      flex:1;
    }

    .list-title{
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .list-url{
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:4px;
    }

    .list-meta{
      color:var(--muted);
      font-size:10px;
      margin-top:4px;
    }

    .list-actions{
      display:flex;
      gap:5px;
      flex:none;
    }

    .icon-btn{
      width:32px;
      height:32px;
      border-radius:9px;
      background:var(--surface-2);
      color:var(--text);
      cursor:pointer;
    }

    .icon-btn:hover{background:var(--surface-3)}

    .bookmark-section{padding:14px}

    .folder-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 3px;
      font-weight:900;
    }

    .folder-items{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }

    .folder-empty{
      padding:20px;
      text-align:center;
      color:var(--muted);
    }

    .bookmark-folder-actions{
      display:flex;
      gap:5px;
    }

    .download-status{
      font-size:10px;
      font-weight:900;
      padding:4px 7px;
      border-radius:7px;
      background:var(--surface-2);
      color:var(--muted);
      margin-left:7px;
    }

    .download-status.completed{color:var(--success)}
    .download-status.started{color:var(--warning)}

    .settings-layout{
      display:grid;
      grid-template-columns:220px minmax(0,1fr);
      gap:16px;
      align-items:start;
    }

    .settings-nav{
      position:sticky;
      top:0;
      padding:8px;
    }

    .settings-nav button{
      width:100%;
      min-height:40px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      text-align:left;
      padding:0 11px;
    }

    .settings-nav button.active,.settings-nav button:hover{
      background:var(--surface-2);
    }

    .settings-content{min-width:0}

    .setting-card{
      padding:18px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
      margin-bottom:14px;
    }

    .setting-card h3{
      margin:0 0 5px;
      font-size:16px;
    }

    .setting-card p{
      margin:0;
      color:var(--muted);
      line-height:1.5;
      font-size:12px;
    }

    .setting-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      padding:13px 0;
      border-top:1px solid var(--line);
    }

    .setting-row:first-of-type{border-top:0}

    .setting-info{min-width:0}

    .setting-label{font-weight:850}

    .setting-help{
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
      line-height:1.4;
    }

    .setting-control{flex:none}

    .switch{
      width:45px;
      height:25px;
      border-radius:30px;
      background:var(--surface-3);
      position:relative;
      cursor:pointer;
      border:1px solid var(--line);
      display:inline-block;
    }

    .switch input{display:none}

    .switch span{
      position:absolute;
      width:19px;
      height:19px;
      top:2px;
      left:2px;
      background:#fff;
      border-radius:50%;
      transition:.18s ease;
      box-shadow:0 1px 5px rgba(0,0,0,.2);
    }

    .switch input:checked + span{
      transform:translateX(20px);
      background:var(--primary);
    }

    .text-control,.select-control{
      min-width:190px;
      height:40px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface-2);
      color:var(--text);
      padding:0 10px;
    }

    .shortcut-table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
    }

    .shortcut-table td{
      padding:9px 0;
      border-top:1px solid var(--line);
      font-size:12px;
    }

    kbd{
      padding:4px 7px;
      border:1px solid var(--line);
      border-bottom-width:2px;
      border-radius:7px;
      background:var(--surface-2);
      font-size:10px;
      font-weight:900;
    }

    .about-card{
      width:min(760px,100%);
      margin:0 auto;
      padding:28px;
      text-align:center;
    }

    .about-logo{
      margin:0 auto 16px;
    }

    .about-list{
      text-align:left;
      margin-top:20px;
      padding:0;
      list-style:none;
    }

    .about-list li{
      padding:11px 0;
      border-top:1px solid var(--line);
      color:var(--muted);
    }

    .credit{
      margin-top:22px;
      padding:12px;
      border-radius:12px;
      background:var(--surface-2);
      font-weight:850;
    }

    .blocked-page,.error-page{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:30px;
    }

    .error-card{
      width:min(650px,100%);
      text-align:center;
      padding:32px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
    }

    .error-icon{
      width:58px;
      height:58px;
      border-radius:18px;
      background:var(--surface-2);
      display:grid;
      place-items:center;
      margin:0 auto 16px;
      font-size:25px;
    }

    .error-title{
      font-size:22px;
      font-weight:950;
    }

    .error-text{
      color:var(--muted);
      line-height:1.55;
      margin:9px auto 20px;
      max-width:510px;
    }

    .error-actions{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .loading-overlay{
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:3px;
      background:transparent;
      z-index:8;
      overflow:hidden;
      pointer-events:none;
    }

    .loading-overlay.active:before{
      content:"";
      display:block;
      width:30%;
      height:100%;
      background:linear-gradient(90deg,transparent,var(--primary),transparent);
      animation:loading 1s infinite;
    }

    @keyframes loading{
      0%{transform:translateX(-140%)}
      100%{transform:translateX(450%)}
    }

    .find-bar{
      position:absolute;
      top:13px;
      right:14px;
      width:min(430px,calc(100% - 28px));
      min-height:54px;
      display:none;
      align-items:center;
      gap:6px;
      padding:7px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      z-index:50;
    }

    .find-bar.show{display:flex}

    .find-input{
      min-width:0;
      flex:1;
      height:38px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface-2);
      color:var(--text);
      padding:0 9px;
    }

    .find-count{
      min-width:55px;
      text-align:center;
      color:var(--muted);
      font-size:11px;
    }

    .find-mark{
      background:color-mix(in srgb,#f4c542 45%,transparent);
      border-radius:3px;
    }

    .context-menu{
      position:fixed;
      z-index:500;
      width:220px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:6px;
      display:none;
    }

    .context-menu.show{display:block}

    .context-item{
      width:100%;
      height:37px;
      border-radius:9px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      text-align:left;
      padding:0 10px;
      font-size:12px;
    }

    .context-item:hover{background:var(--surface-2)}

    .context-sep{
      height:1px;
      background:var(--line);
      margin:5px 2px;
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.48);
      backdrop-filter:blur(3px);
      display:none;
      place-items:center;
      z-index:400;
      padding:18px;
    }

    .modal-backdrop.show{display:grid}

    .modal{
      width:min(650px,100%);
      max-height:min(760px,calc(100vh - 30px));
      overflow:auto;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
      animation:modalIn .16s ease;
    }

    @keyframes modalIn{
      from{opacity:0;transform:translateY(8px) scale(.985)}
      to{opacity:1;transform:none}
    }

    .modal-header{
      padding:17px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .modal-title{
      font-size:16px;
      font-weight:950;
    }

    .modal-body{padding:18px}

    .modal-footer{
      padding:13px 18px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:flex-end;
      gap:7px;
    }

    .check-grid{
      display:grid;
      gap:10px;
    }

    .check-option{
      display:flex;
      align-items:flex-start;
      gap:9px;
      padding:11px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--surface-2);
    }

    .check-option input{margin-top:3px}

    .check-option strong{display:block}

    .check-option span{
      font-size:11px;
      color:var(--muted);
    }

    .form-grid{
      display:grid;
      gap:12px;
    }

    .field{
      display:grid;
      gap:6px;
    }

    .field label{
      font-size:11px;
      color:var(--muted);
      font-weight:800;
    }

    .field input,.field select,.field textarea{
      width:100%;
      height:40px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface-2);
      color:var(--text);
      padding:0 10px;
    }

    .field textarea{
      height:96px;
      padding:10px;
      resize:vertical;
    }

    .toast-zone{
      position:fixed;
      right:15px;
      bottom:calc(15px + var(--safe-bottom));
      z-index:600;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      pointer-events:none;
    }

    .toast{
      max-width:min(370px,calc(100vw - 30px));
      background:#151b28;
      color:#fff;
      border-radius:12px;
      padding:10px 13px;
      box-shadow:var(--shadow);
      font-size:12px;
      animation:toastIn .18s ease;
    }

    @keyframes toastIn{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1;transform:none}
    }

    .mobile-bottom{
      display:none;
      min-height:56px;
      padding:5px 9px calc(5px + var(--safe-bottom));
      background:var(--surface);
      border-top:1px solid var(--line);
      justify-content:space-around;
      flex:none;
      z-index:25;
    }

    .mobile-bottom button{
      background:transparent;
      color:var(--muted);
      min-width:58px;
      border-radius:11px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      cursor:pointer;
      font-size:10px;
    }

    .mobile-bottom button strong{
      font-size:18px;
      font-weight:500;
    }

    .mobile-bottom button.active{color:var(--primary)}

    .no-data{
      padding:50px 20px;
      text-align:center;
      color:var(--muted);
    }

    .no-data-icon{
      font-size:34px;
      margin-bottom:10px;
    }

    .no-data-title{
      color:var(--text);
      font-weight:950;
      font-size:15px;
    }

    .no-data-text{
      margin-top:4px;
      font-size:12px;
    }

    .data-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:13px;
    }

    @media (max-width:900px){
      .shortcuts-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }

      .settings-layout{
        grid-template-columns:1fr;
      }

      .settings-nav{
        position:static;
        display:flex;
        overflow:auto;
        gap:5px;
      }

      .settings-nav button{
        width:auto;
        white-space:nowrap;
      }
    }

    @media (max-width:700px){
      :root{
        --toolbar-height:57px;
        --tabs-height:41px;
      }

      .tabs-bar{
        padding-left:5px;
        padding-right:5px;
      }

      .tab{
        min-width:118px;
        max-width:190px;
        height:35px;
      }

      .new-tab-btn{
        width:34px;
        height:34px;
      }

      .browser-toolbar{
        padding:6px 7px;
        gap:5px;
      }

      .nav-btn,.toolbar-btn{
        width:35px;
        height:35px;
        border-radius:10px;
      }

      .browser-toolbar .nav-btn:nth-child(1),
      .browser-toolbar .nav-btn:nth-child(2){
        display:none;
      }

      .private-indicator{
        height:30px;
        padding:0 8px;
      }

      .address-bar{
        height:39px;
        border-radius:15px;
        padding-left:36px;
        font-size:12px;
      }

      .suggestions{top:45px}

      .mobile-bottom{display:flex}

      .content-viewport{height:auto}

      .internal-page{
        padding:18px 12px 28px;
      }

      .newtab-page{
        padding:22px 12px 55px;
      }

      .shortcuts-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .shortcut-card{
        min-height:90px;
      }

      .hero-search input{
        height:54px;
        font-size:14px;
        padding-left:17px;
      }

      .hero-search button{
        height:40px;
        width:40px;
        top:7px;
      }

      .hero-search .hero-mic{right:53px}

      .newtab-title{font-size:24px}

      .brand-mark{
        width:72px;
        height:72px;
      }

      .brand-n{font-size:37px}

      .menu{
        position:fixed;
        top:calc(var(--safe-top) + var(--tabs-height) + var(--toolbar-height) + 4px);
        right:7px;
        width:min(350px,calc(100vw - 14px));
        max-height:calc(100vh - 100px);
      }

      .list-item{
        align-items:flex-start;
      }

      .list-actions{flex-wrap:wrap}

      .text-control,.select-control{
        min-width:150px;
        max-width:52vw;
      }

      .setting-row{
        align-items:flex-start;
      }

      .setting-control{
        margin-top:2px;
      }

      .about-card{padding:20px}
    }

    @media (max-width:450px){
      .tabs-scroll{gap:3px}

      .tab{
        min-width:104px;
        max-width:160px;
        padding-left:8px;
        gap:6px;
      }

      .tab-title{font-size:11px}

      .tab-close{
        width:23px;
        height:23px;
      }

      .browser-toolbar .toolbar-btn:nth-last-child(2){
        display:none;
      }

      .newtab-subtitle{font-size:11px}

      .quick-title{margin-top:23px}

      .internal-title{font-size:22px}

      .search-input{
        min-width:0;
        flex:1;
      }

      .list-icon{
        width:32px;
        height:32px;
      }

      .icon-btn{
        width:30px;
        height:30px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="app">
    <div id="tabsBar" class="tabs-bar" aria-label="Browser tabs">
      <div id="tabsScroll" class="tabs-scroll"></div>
      <button id="newTabBtn" class="new-tab-btn" aria-label="New tab" title="New tab">+</button>
    </div>

    <div id="toolbar" class="browser-toolbar">
      <button id="backBtn" class="nav-btn" aria-label="Back" title="Back">
        <span class="nav-icon">←</span>
      </button>

      <button id="forwardBtn" class="nav-btn" aria-label="Forward" title="Forward">
        <span class="nav-icon">→</span>
      </button>

      <button id="reloadBtn" class="nav-btn" aria-label="Reload" title="Reload">
        <span class="nav-icon">↻</span>
      </button>

      <button id="homeBtn" class="toolbar-btn" aria-label="Home" title="Home">
        <span>⌂</span>
      </button>

      <div id="privateIndicator" class="private-indicator" aria-label="Private browsing active">
        <span>◉</span><span>Private</span>
      </div>

      <div class="address-wrap">
        <div class="address-leading" aria-hidden="true">
          <span id="securityDot" class="security-dot"></span>
        </div>

        <input
          id="addressBar"
          class="address-bar"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search or enter address"
          placeholder="Search or enter address"
        />

        <div class="address-trailing" aria-hidden="true">⌕</div>
        <div id="suggestions" class="suggestions" role="listbox"></div>
      </div>

      <button id="bookmarkCurrentBtn" class="toolbar-btn" aria-label="Bookmark current page" title="Bookmark current page">☆</button>
      <button id="shareBtn" class="toolbar-btn" aria-label="Share current page" title="Share current page">↗</button>
      <button id="copyBtn" class="toolbar-btn" aria-label="Copy current URL" title="Copy current URL">⧉</button>

      <div class="menu-wrap">
        <button id="menuBtn" class="toolbar-btn" aria-label="Browser menu" title="More">⋮</button>

        <div id="browserMenu" class="menu" role="menu">
          <div class="menu-section">
            <div class="menu-title">New</div>
            <button class="menu-row" data-action="new-tab"><span class="mi">＋</span><span class="ms">New Tab</span><span class="shortcut">Ctrl+T</span></button>
            <button class="menu-row" data-action="new-private"><span class="mi">◉</span><span class="ms">New Private Tab</span></button>
            <button class="menu-row" data-action="reopen"><span class="mi">↶</span><span class="ms">Reopen Closed Tab</span><span class="shortcut">Ctrl+Shift+T</span></button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">History</div>
            <button class="menu-row" data-action="history"><span class="mi">◷</span><span class="ms">History</span><span class="shortcut">Ctrl+H</span></button>
            <button class="menu-row" data-action="clear-data"><span class="mi">⌫</span><span class="ms">Clear Browsing Data</span></button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Bookmarks</div>
            <button class="menu-row" data-action="bookmark"><span class="mi">☆</span><span class="ms">Bookmark This Page</span><span class="shortcut">Ctrl+D</span></button>
            <button class="menu-row" data-action="bookmarks"><span class="mi">★</span><span class="ms">Bookmark Manager</span></button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Downloads</div>
            <button class="menu-row" data-action="downloads"><span class="mi">↓</span><span class="ms">Downloads</span><span class="shortcut">Ctrl+J</span></button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Zoom</div>
            <div class="menu-zoom">
              <button class="menu-zoom-btn" data-action="zoom-out" aria-label="Zoom out">−</button>
              <div class="menu-zoom-value" id="menuZoomValue">100%</div>
              <button class="menu-zoom-btn" data-action="zoom-reset" aria-label="Reset zoom">100%</button>
              <button class="menu-zoom-btn" data-action="zoom-in" aria-label="Zoom in">+</button>
            </div>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Tools</div>
            <button class="menu-row" data-action="find"><span class="mi">⌕</span><span class="ms">Find in Page</span><span class="shortcut">Ctrl+F</span></button>
            <button class="menu-row" data-action="print"><span class="mi">⎙</span><span class="ms">Print</span></button>
            <button class="menu-row" data-action="share"><span class="mi">↗</span><span class="ms">Share</span></button>
            <button class="menu-row" data-action="fullscreen"><span class="mi">⛶</span><span class="ms">Fullscreen</span></button>

            <!-- CHANGE 2: Desktop Site option -->
            <button class="menu-row" data-action="desktop-site">
              <span class="mi">▣</span>
              <span class="ms">Desktop Site</span>
              <span id="desktopSiteLabel" class="shortcut">Off</span>
            </button>

            <button class="menu-row" data-action="devtools"><span class="mi">⌘</span><span class="ms">Developer Tools <small>(unavailable)</small></span></button>
            <button class="menu-row" data-action="save-page"><span class="mi">▣</span><span class="ms">Save Page <small>(browser-managed)</small></span></button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Appearance</div>
            <button class="menu-row" data-action="theme"><span class="mi">◐</span><span class="ms">Theme</span><span id="menuThemeLabel" class="shortcut">System</span></button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Settings</div>
            <button class="menu-row" data-action="settings"><span class="mi">⚙</span><span class="ms">Settings</span></button>
          </div>

          <div class="menu-divider"></div>

          <div class="menu-section">
            <div class="menu-title">Help</div>
            <button class="menu-row" data-action="about"><span class="mi">?</span><span class="ms">About NOVA Search</span></button>
          </div>
        </div>
      </div>
    </div>

    <div id="bookmarkBar" class="bookmark-bar" aria-label="Bookmarks bar"></div>

    <main id="contentViewport" class="content-viewport">
      <div id="loadingOverlay" class="loading-overlay"></div>
      <div id="pageHost" class="page-host"></div>

      <div id="findBar" class="find-bar" aria-label="Find in page">
        <input id="findInput" class="find-input" type="text" placeholder="Find in page..." autocomplete="off" />
        <div id="findCount" class="find-count">0/0</div>
        <button id="findPrev" class="icon-btn" title="Previous result" aria-label="Previous result">↑</button>
        <button id="findNext" class="icon-btn" title="Next result" aria-label="Next result">↓</button>
        <button id="findClose" class="icon-btn" title="Close" aria-label="Close find bar">×</button>
      </div>
    </main>

    <nav id="mobileBottom" class="mobile-bottom" aria-label="Mobile controls">
      <button id="mobileBack"><strong>←</strong><span>Back</span></button>
      <button id="mobileHome"><strong>⌂</strong><span>Home</span></button>
      <button id="mobileTabs"><strong>▱</strong><span>Tabs</span></button>
      <button id="mobileMenu"><strong>⋮</strong><span>Menu</span></button>
    </nav>
  </div>

  <div id="contextMenu" class="context-menu" role="menu">
    <button class="context-item" data-context="back">Back</button>
    <button class="context-item" data-context="forward">Forward</button>
    <button class="context-item" data-context="reload">Reload</button>
    <div class="context-sep"></div>
    <button class="context-item" data-context="bookmark">Save Bookmark</button>
    <button class="context-item" data-context="copy">Copy Link</button>
    <button class="context-item" data-context="new-tab">Open in New Tab</button>
    <button class="context-item" data-context="new-window">Open in New Window</button>
    <div class="context-sep"></div>
    <button class="context-item" data-context="inspect">Inspect <small>(browser-managed)</small></button>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>

  <div id="toastZone" class="toast-zone" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE = {
        history: "nova_history",
        bookmarks: "nova_bookmarks",
        settings: "nova_settings",
        tabs: "nova_tabs",
        shortcuts: "nova_shortcuts",
        downloads: "nova_downloads",
        closedTabs: "nova_closed_tabs"
      };

      const ZOOM_LEVELS = [50,60,70,80,90,100,110,120,130,140,150];

      const DEFAULT_SHORTCUTS = [
        {id:"yt", name:"YouTube", url:"https://www.youtube.com/", icon:"▶"},
        {id:"wiki", name:"Wikipedia", url:"https://www.wikipedia.org/", icon:"W"},
        {id:"git", name:"GitHub", url:"https://github.com/", icon:"◖"},
        {id:"gmail", name:"Gmail", url:"https://mail.google.com/", icon:"✉"},
        {id:"maps", name:"Maps", url:"https://maps.google.com/", icon:"⌖"},
        {id:"news", name:"News", url:"https://www.bing.com/news", icon:"📰"}
      ];

      const DEFAULT_BOOKMARKS = {
        folders: [
          {id:"folder-bar", name:"Bookmarks Bar", items:[]},
          {id:"folder-other", name:"Other Bookmarks", items:[]}
        ]
      };

      const DEFAULT_SETTINGS = {
        homepage:"nova://newtab",
        startup:"newtab",
        searchProvider:"bing",
        customSearchUrl:"https://www.bing.com/search?q={query}",
        theme:"system",
        zoom:100,
        showBookmarksBar:false,
        saveHistory:true,
        openLinksNewTab:false,
        restoreSession:true,
        voiceAutoSearch:true,

        /* CHANGE 2: persisted Desktop Site setting */
        desktopSite:false
      };

      const DEFAULT_DOWNLOADS = [];

      /*
        CHANGE 1:
        These hosts commonly prevent iframe embedding using X-Frame-Options
        or Content-Security-Policy. NOVA opens them in a normal browser tab
        instead of showing the browser's "refused to connect" iframe error.
      */
      const EXTERNAL_FALLBACK_HOSTS = [
        "google.com",
        "www.google.com",
        "google.co.in",
        "www.google.co.in",
        "youtube.com",
        "www.youtube.com",
        "youtu.be",
        "github.com",
        "www.github.com",
        "gitlab.com",
        "www.gitlab.com",
        "facebook.com",
        "www.facebook.com",
        "instagram.com",
        "www.instagram.com",
        "linkedin.com",
        "www.linkedin.com",
        "x.com",
        "www.x.com",
        "twitter.com",
        "www.twitter.com",
        "reddit.com",
        "www.reddit.com",
        "discord.com",
        "www.discord.com",
        "web.whatsapp.com",
        "whatsapp.com",
        "www.whatsapp.com",
        "gmail.com",
        "mail.google.com",
        "drive.google.com",
        "docs.google.com",
        "maps.google.com",
        "meet.google.com",
        "accounts.google.com",
        "bing.com",
        "www.bing.com",
        "duckduckgo.com",
        "www.duckduckgo.com",
        "search.brave.com",
        "brave.com",
        "www.brave.com",
        "amazon.com",
        "www.amazon.com",
        "amazon.in",
        "www.amazon.in",
        "netflix.com",
        "www.netflix.com",
        "spotify.com",
        "open.spotify.com",
        "twitch.tv",
        "www.twitch.tv",
        "pinterest.com",
        "www.pinterest.com"
      ];

      const state = {
        tabs: [],
        activeTabId: null,
        closedTabs: [],
        history: [],
        bookmarks: loadStorage(STORAGE.bookmarks, DEFAULT_BOOKMARKS),
        settings: loadStorage(STORAGE.settings, DEFAULT_SETTINGS),
        shortcuts: loadStorage(STORAGE.shortcuts, DEFAULT_SHORTCUTS),
        downloads: loadStorage(STORAGE.downloads, DEFAULT_DOWNLOADS),
        currentFindMatches: [],
        currentFindIndex: -1,
        contextX:0,
        contextY:0
      };

      function uid(prefix="id"){
        return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
      }

      function safeParse(raw, fallback){
        try{
          const parsed = JSON.parse(raw);
          return parsed;
        }catch{
          return structuredCloneSafe(fallback);
        }
      }

      function structuredCloneSafe(value){
        try{
          return JSON.parse(JSON.stringify(value));
        }catch{
          return value;
        }
      }

      function loadStorage(key, fallback){
        try{
          const raw = localStorage.getItem(key);
          if(raw === null) return structuredCloneSafe(fallback);
          const parsed = safeParse(raw, fallback);
          return parsed ?? structuredCloneSafe(fallback);
        }catch{
          return structuredCloneSafe(fallback);
        }
      }

      function saveStorage(key, value){
        try{
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        }catch{
          toast("Storage is unavailable or full. Changes may not persist.");
          return false;
        }
      }

      function esc(value){
        return String(value ?? "")
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#39;");
      }

      function getCurrentTab(){
        return state.tabs.find(t => t.id === state.activeTabId) || null;
      }

      function isHttpUrl(url){
        return /^https?:\/\//i.test(url || "");
      }

      function isInternal(url){
        return /^nova:\/\//i.test(url || "");
      }

      function normalizeUrl(value){
        let input = String(value || "").trim();

        if(!input) return "";

        if(/^https?:\/\//i.test(input)) return input;

        if(/^www\./i.test(input)) return "https://" + input;

        if(/^localhost(?::\d+)?(?:\/.*)?$/i.test(input)) return "http://" + input;

        if(/^[a-z0-9.-]+\.[a-z]{2,}(?::\d+)?(?:\/.*)?$/i.test(input)){
          return "https://" + input;
        }

        return null;
      }

      function providerSearchUrl(provider, query){
        const q = encodeURIComponent(query);

        switch(provider){
          case "bing":
            return "https://www.bing.com/search?q=" + q;

          case "duckduckgo":
            return "https://duckduckgo.com/?q=" + q;

          case "google":
            return "https://www.google.com/search?q=" + q;

          case "brave":
            return "https://search.brave.com/search?q=" + q;

          case "custom":
            return (state.settings.customSearchUrl || DEFAULT_SETTINGS.customSearchUrl).replace(/\{query\}/g,q);

          default:
            return "https://www.bing.com/search?q=" + q;
        }
      }

      function detectInput(value){
        const normalized = normalizeUrl(value);

        if(normalized){
          return {
            type:"url",
            value:normalized
          };
        }

        return {
          type:"search",
          value:String(value || "").trim()
        };
      }

      function titleFromUrl(url){
        if(!url) return "NOVA Search";

        if(isInternal(url)){
          const name = url.replace("nova://","").split("?")[0];

          const labels = {
            newtab:"New Tab",
            history:"History",
            bookmarks:"Bookmarks",
            downloads:"Downloads",
            settings:"Settings",
            about:"About NOVA Search"
          };

          return labels[name] || "NOVA Search";
        }

        try{
          const u = new URL(url);
          return u.hostname.replace(/^www\./,"");
        }catch{
          return "Web Page";
        }
      }

      function faviconFor(url){
        if(!isHttpUrl(url)) return "";

        try{
          const host = new URL(url).hostname;

          return "https://icons.duckduckgo.com/ip3/" +
            encodeURIComponent(host) +
            ".ico";
        }catch{
          return "";
        }
      }

      function createTab({
        url="nova://newtab",
        privateMode=false,
        title=null
      }={}){
        return {
          id:uid("tab"),
          title:title || titleFromUrl(url),
          url,
          private:!!privateMode,
          history:[url],
          historyIndex:0,
          createdAt:Date.now()
        };
      }

      function serializeTabs(){
        return state.tabs
          .filter(t => !t.private)
          .map(t => ({
            id:t.id,
            title:t.title,
            url:t.url,
            history:t.history.filter(u => !String(u).startsWith("nova://private")),
            historyIndex:Math.min(t.historyIndex,t.history.length-1),
            private:false
          }));
      }

      function persistTabs(){
        if(state.settings.restoreSession){
          saveStorage(STORAGE.tabs, {
            tabs:serializeTabs(),
            activeIndex:Math.max(
              0,
              state.tabs.filter(t=>!t.private).findIndex(
                t=>t.id===state.activeTabId
              )
            )
          });
        }
      }

      function persistClosed(){
        state.closedTabs =
          state.closedTabs
            .filter(t => !t.private)
            .slice(0,20);

        saveStorage(STORAGE.closedTabs,state.closedTabs);
      }

      function pushHistory(url,title){
        if(!state.settings.saveHistory) return;

        if(!isHttpUrl(url) && !isInternal(url)) return;

        const now = Date.now();
        const last = state.history[0];

        if(
          last &&
          last.url === url &&
          now-last.timestamp < 5000
        ){
          state.history[0] = {
            ...last,
            timestamp:now,
            title
          };
        }else{
          state.history.unshift({
            id:uid("hist"),
            title:title || titleFromUrl(url),
            url,
            timestamp:now,
            favicon:faviconFor(url)
          });
        }

        if(state.history.length > 1000){
          state.history.length = 1000;
        }

        saveStorage(STORAGE.history,state.history);
      }

      /*
        CHANGE 1:
        Opening a blocked website in a real top-level browsing context is
        the only legitimate browser-based fallback when iframe embedding
        is prevented by the destination website.
      */
      function openInNewWindow(url){
        const w = window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );

        if(!w){
          toast("Popup blocked. Please allow pop-ups for NOVA Search.");
          return false;
        }

        return true;
      }

      function shouldOpenExternally(url){
        if(!isHttpUrl(url)) return false;

        try{
          const host = new URL(url).hostname.toLowerCase();

          return EXTERNAL_FALLBACK_HOSTS.some(
            blockedHost =>
              host === blockedHost ||
              host.endsWith("." + blockedHost)
          );
        }catch{
          return false;
        }
      }

      function toast(message){
        const zone = document.getElementById("toastZone");

        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = message;

        zone.appendChild(el);

        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transform = "translateY(5px)";

          setTimeout(() => el.remove(),180);
        },2600);
      }

      function setLoading(active){
        document
          .getElementById("loadingOverlay")
          .classList.toggle("active",!!active);
      }

      function applyTheme(){
        const theme = state.settings.theme || "system";

        if(theme === "system"){
          const dark =
            window.matchMedia?.("(prefers-color-scheme: dark)")?.matches;

          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          );
        }else{
          document.documentElement.setAttribute(
            "data-theme",
            theme
          );
        }

        const tab = getCurrentTab();

        document
          .getElementById("app")
          .classList.toggle(
            "private-mode",
            !!tab?.private
          );

        document
          .getElementById("bookmarkBar")
          .classList.toggle(
            "show",
            !!state.settings.showBookmarksBar && !tab?.private
          );

        document.getElementById("menuThemeLabel").textContent =
          theme.charAt(0).toUpperCase() + theme.slice(1);

        const desktop = !!state.settings.desktopSite;

        document.getElementById("desktopSiteLabel").textContent =
          desktop ? "On" : "Off";

        updateZoomUI();
      }

      function renderTabs(){
        const container =
          document.getElementById("tabsScroll");

        container.innerHTML = "";

        if(!state.tabs.length){
          addTab(false);
          return;
        }

        state.tabs.forEach(tab => {
          const el = document.createElement("div");

          el.className =
            "tab" +
            (tab.id===state.activeTabId ? " active":"") +
            (tab.private ? " private":"");

          el.draggable = true;
          el.dataset.tabId = tab.id;

          const favicon = document.createElement("img");

          favicon.className = "tab-favicon";
          favicon.alt = "";
          favicon.src = faviconFor(tab.url) || "";

          favicon.onerror = () => {
            favicon.removeAttribute("src");
            favicon.alt = "◈";
          };

          const title = document.createElement("div");

          title.className = "tab-title";
          title.textContent =
            tab.private
              ? "Private · " + (tab.title || "New Tab")
              : (tab.title || "New Tab");

          const close = document.createElement("button");

          close.className = "tab-close";
          close.type = "button";
          close.setAttribute("aria-label","Close tab");
          close.textContent = "×";

          close.addEventListener("click",e => {
            e.stopPropagation();
            closeTab(tab.id);
          });

          el.append(
            favicon,
            title,
            close
          );

          el.addEventListener(
            "click",
            () => switchTab(tab.id)
          );

          el.addEventListener(
            "dblclick",
            () => {
              if(tab.url !== "nova://newtab"){
                duplicateTab(tab.id);
              }
            }
          );

          el.addEventListener(
            "dragstart",
            e => {
              e.dataTransfer.setData(
                "text/plain",
                tab.id
              );
            }
          );

          el.addEventListener(
            "dragover",
            e => e.preventDefault()
          );

          el.addEventListener(
            "drop",
            e => {
              e.preventDefault();

              const fromId =
                e.dataTransfer.getData("text/plain");

              reorderTabs(fromId,tab.id);
            }
          );

          container.appendChild(el);
        });

        const active =
          container.querySelector(".tab.active");

        active?.scrollIntoView({
          block:"nearest",
          inline:"nearest"
        });
      }

      function reorderTabs(fromId,toId){
        if(
          !fromId ||
          !toId ||
          fromId===toId
        ){
          return;
        }

        const from =
          state.tabs.findIndex(
            t=>t.id===fromId
          );

        const to =
          state.tabs.findIndex(
            t=>t.id===toId
          );

        if(from<0 || to<0) return;

        const [tab] =
          state.tabs.splice(from,1);

        state.tabs.splice(to,0,tab);

        persistTabs();
        renderTabs();
      }

      function renderCurrentTab(){
        const tab = getCurrentTab();

        if(!tab) return;

        applyTheme();
        renderTabs();
        updateToolbarState();
        renderBookmarkBar();

        const host =
          document.getElementById("pageHost");

        host.innerHTML = "";

        host.classList.toggle(
          "desktop-site-host",
          !!state.settings.desktopSite
        );

        setAddressValue(tab.url);

        if(isInternal(tab.url)){
          setLoading(true);

          renderInternalPage(tab.url);

          setTimeout(
            ()=>setLoading(false),
            120
          );

        }else if(isHttpUrl(tab.url)){
          renderWebPage(tab.url);

        }else{
          renderErrorPage(
            "Invalid URL",
            "This address doesn't look valid.",
            tab.url
          );
        }
      }

      function setAddressValue(value){
        document.getElementById("addressBar").value =
          value==="nova://newtab" ? "" : value;
      }

      function updateToolbarState(){
        const tab = getCurrentTab();

        const back =
          document.getElementById("backBtn");

        const forward =
          document.getElementById("forwardBtn");

        back.disabled =
          !tab ||
          tab.historyIndex<=0;

        forward.disabled =
          !tab ||
          tab.historyIndex>=tab.history.length-1;

        const secure =
          document.getElementById("securityDot");

        if(
          tab &&
          /^https:\/\//i.test(tab.url)
        ){
          secure.style.background =
            "var(--success)";
        }else{
          secure.style.background =
            "var(--warning)";
        }

        const starred =
          isBookmarked(tab?.url);

        document.getElementById(
          "bookmarkCurrentBtn"
        ).textContent =
          starred ? "★" : "☆";

        document.getElementById(
          "menuZoomValue"
        ).textContent =
          getZoomPercent()+"%";

        document.getElementById(
          "desktopSiteLabel"
        ).textContent =
          state.settings.desktopSite
            ? "On"
            : "Off";
      }

      function renderWebPage(url){
        const host =
          document.getElementById("pageHost");

        /*
          CHANGE 1:
          Known iframe-blocking destinations are opened in a normal browser
          tab immediately. This removes the grey "refused to connect" frame
          instead of displaying a fake or misleading page.
        */
        if(shouldOpenExternally(url)){
          setLoading(false);

          const opened =
            openInNewWindow(url);

          host.innerHTML = `
            <div class="blocked-page">
              <div class="error-card">
                <div class="error-icon">↗</div>
                <div class="error-title">
                  Website opened in a browser tab
                </div>
                <div class="error-text">
                  This website does not allow embedded viewing in NOVA.
                  It has been opened in a normal browser tab so its own
                  security policies remain intact.
                </div>
                <div class="error-actions">
                  <button class="primary-btn" data-page-action="open-external">
                    Open Again
                  </button>
                  <button class="secondary-btn" data-page-action="copy-url">
                    Copy Link
                  </button>
                </div>
              </div>
            </div>
          `;

          host
            .querySelector(
              '[data-page-action="open-external"]'
            )
            ?.addEventListener(
              "click",
              ()=>openInNewWindow(url)
            );

          host
            .querySelector(
              '[data-page-action="copy-url"]'
            )
            ?.addEventListener(
              "click",
              ()=>copyText(url)
            );

          if(!opened){
            toast(
              "Allow pop-ups to open this website."
            );
          }

          return;
        }

        const notice =
          document.createElement("div");

        notice.style.cssText = `
          position:absolute;
          left:12px;
          right:12px;
          top:10px;
          z-index:4;
          display:flex;
          align-items:center;
          justify-content:center;
          pointer-events:none;
        `;

        const noticeInner =
          document.createElement("div");

        noticeInner.style.cssText = `
          pointer-events:auto;
          max-width:850px;
          padding:7px 10px;
          border-radius:10px;
          background:color-mix(in srgb,var(--surface) 90%,transparent);
          border:1px solid var(--line);
          box-shadow:var(--shadow-soft);
          color:var(--muted);
          font-size:10px;
        `;

        noticeInner.textContent =
          state.settings.desktopSite
            ? "Desktop Site is enabled. Some websites may still use mobile content because a webpage cannot change the browser's user-agent."
            : "External websites may block iframe embedding. Use the browser controls or open the page in a new tab if needed.";

        notice.appendChild(noticeInner);

        const frame =
          document.createElement("iframe");

        frame.className =
          "web-frame" +
          (state.settings.desktopSite
            ? " desktop-site"
            : "");

        frame.title =
          titleFromUrl(url);

        frame.referrerPolicy =
          "no-referrer";

        frame.allow =
          "fullscreen; clipboard-read; clipboard-write; geolocation; microphone; camera; autoplay; payment";

        frame.src = url;

        frame.addEventListener(
          "load",
          () => {
            setLoading(false);

            const tab =
              getCurrentTab();

            if(
              tab &&
              tab.id===state.activeTabId
            ){
              tab.title =
                titleFromUrl(url);

              renderTabs();
              updateToolbarState();
            }
          }
        );

        frame.addEventListener(
          "error",
          () => {
            setLoading(false);
            renderBlockedPage(url);
          }
        );

        host.append(
          notice,
          frame
        );

        setLoading(true);

        window.setTimeout(
          () => setLoading(false),
          7000
        );
      }

      function renderBlockedPage(url){
        const host =
          document.getElementById("pageHost");

        host.innerHTML = `
          <div class="blocked-page">
            <div class="error-card">
              <div class="error-icon">↗</div>

              <div class="error-title">
                Website cannot be displayed here
              </div>

              <div class="error-text">
                This website may block embedding through browser
                security policies such as X-Frame-Options or
                Content-Security-Policy. NOVA cannot bypass those protections.
              </div>

              <div class="error-actions">
                <button
                  class="primary-btn"
                  data-page-action="open-external"
                >
                  Open in New Browser Tab
                </button>

                <button
                  class="secondary-btn"
                  data-page-action="copy-url"
                >
                  Copy Link
                </button>
              </div>
            </div>
          </div>
        `;

        host
          .querySelector(
            '[data-page-action="open-external"]'
          )
          ?.addEventListener(
            "click",
            ()=>openInNewWindow(url)
          );

        host
          .querySelector(
            '[data-page-action="copy-url"]'
          )
          ?.addEventListener(
            "click",
            ()=>copyText(url)
          );
      }

      function renderErrorPage(
        title,
        text,
        url=""
      ){
        const host =
          document.getElementById("pageHost");

        host.innerHTML = `
          <div class="error-page">
            <div class="error-card">
              <div class="error-icon">!</div>

              <div class="error-title">
                ${esc(title)}
              </div>

              <div class="error-text">
                ${esc(text)}
              </div>

              <div class="error-actions">
                ${
                  url
                    ? '<button class="secondary-btn" data-page-action="open">Open in New Browser Tab</button>'
                    : ''
                }

                <button
                  class="primary-btn"
                  data-page-action="home"
                >
                  Go Home
                </button>
              </div>
            </div>
          </div>
        `;

        host
          .querySelector(
            '[data-page-action="open"]'
          )
          ?.addEventListener(
            "click",
            ()=>openInNewWindow(url)
          );

        host
          .querySelector(
            '[data-page-action="home"]'
          )
          ?.addEventListener(
            "click",
            ()=>goHome()
          );
      }

      function renderInternalPage(url){
        const page =
          url.replace("nova://","").split("?")[0];

        switch(page){
          case "newtab":
            return renderNewTab();

          case "history":
            return renderHistoryPage();

          case "bookmarks":
            return renderBookmarksPage();

          case "downloads":
            return renderDownloadsPage();

          case "settings":
            return renderSettingsPage();

          case "about":
            return renderAboutPage();

          default:
            return renderErrorPage(
              "Page Not Found",
              "The requested NOVA page does not exist."
            );
        }
      }

      function renderNewTab(){
        const host =
          document.getElementById("pageHost");

        const page =
          document.createElement("div");

        page.className =
          "internal-page newtab-page";

        page.innerHTML = `
          <div class="newtab-inner">
            <div class="newtab-brand">
              <div class="brand-mark">
                <div class="brand-n">N</div>
              </div>

              <div class="newtab-title">
                NOVA Search
              </div>

              <div class="newtab-subtitle">
                Search the web or enter a URL
              </div>
            </div>

            <div class="hero-search">
              <input
                id="heroSearch"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search the web or enter a URL"
                aria-label="NOVA Search"
              >

              <button
                class="hero-mic"
                id="heroMic"
                aria-label="Voice search"
                title="Voice search"
              >
                🎙
              </button>

              <button
                class="hero-submit"
                id="heroSubmit"
                aria-label="Search"
                title="Search"
              >
                ⌕
              </button>
            </div>

            <div class="quick-title">
              Quick shortcuts
            </div>

            <div
              id="shortcutsGrid"
              class="shortcuts-grid"
            ></div>
          </div>
        `;

        host.appendChild(page);

        const input =
          page.querySelector("#heroSearch");

        const submit =
          page.querySelector("#heroSubmit");

        const mic =
          page.querySelector("#heroMic");

        submit.addEventListener(
          "click",
          ()=>navigateFromInput(input.value,true)
        );

        input.addEventListener(
          "keydown",
          e=>{
            if(e.key==="Enter"){
              navigateFromInput(
                input.value,
                true
              );
            }
          }
        );

        mic.addEventListener(
          "click",
          startVoiceSearch
        );

        renderShortcuts(
          page.querySelector("#shortcutsGrid")
        );
      }

      function renderShortcuts(container){
        container.innerHTML = "";

        state.shortcuts.forEach(
          (item,index) => {
            const card =
              document.createElement("div");

            card.className =
              "shortcut-card";

            card.dataset.shortcutId =
              item.id;

            card.innerHTML = `
              <div class="shortcut-actions">
                <button
                  class="shortcut-action"
                  data-shortcut-action="up"
                  title="Move up"
                  aria-label="Move shortcut up"

      function manageShortcut(
        action,
        id,
        index
      ){
        if(action==="delete"){
          state.shortcuts =
            state.shortcuts.filter(
              s=>s.id!==id
            );

          saveStorage(
            STORAGE.shortcuts,
            state.shortcuts
          );

          renderCurrentTab();

          toast("Shortcut deleted");

          return;
        }

        if(
          action==="up" &&
          index>0
        ){
          [
            state.shortcuts[index-1],
            state.shortcuts[index]
          ]=[
            state.shortcuts[index],
            state.shortcuts[index-1]
          ];

          saveStorage(
            STORAGE.shortcuts,
            state.shortcuts
          );

          renderCurrentTab();

          return;
        }

        if(
          action==="down" &&
          index<state.shortcuts.length-1
        ){
          [
            state.shortcuts[index+1],
            state.shortcuts[index]
          ]=[
            state.shortcuts[index],
            state.shortcuts[index+1]
          ];

          saveStorage(
            STORAGE.shortcuts,
            state.shortcuts
          );

          renderCurrentTab();

          return;
        }

        if(action==="edit"){
          const item =
            state.shortcuts.find(
              s=>s.id===id
            );

          if(!item) return;

          openModal(
            "Edit Shortcut",
            `
              <div class="form-grid">
                <div class="field">
                  <label>Name</label>
                  <input
                    id="scName"
                    value="${esc(item.name)}"

              </div>
            `,
            [

                action:closeModal

              {

                action:()=>{
                  const name =

                  const url =

                        .trim()

                  const icon =

                  if(!name || !url){

                  item.name=name;

      function drawHistoryList(
        container,
        query="",
        filter="all"
      ){
        const now =
          new Date();

        const startToday =
          new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          ).getTime();

        const startYesterday =
          startToday - 86400000;

        const start7 =
          startToday - 6*86400000;

        const q =
          query
            .trim()
            .toLowerCase();

        const list =
          state.history.filter(
            item=>{
              const matchesText =
                !q ||
                `${item.title} ${item.url}`
                  .toLowerCase()
                  .includes(q);

              const t =
                item.timestamp;

              let matchesFilter=true;

              if(filter==="today"){
                matchesFilter =
                  t>=startToday;
              }else if(filter==="yesterday"){
                matchesFilter =
                  t>=startYesterday &&
                  t<startToday;
              }else if(filter==="7days"){
                matchesFilter =
                  t>=start7;
              }else if(filter==="older"){
                matchesFilter =
                  t<start7;
              }

              return (
                matchesText &&
                matchesFilter
              );
            }
          );

        if(!list.length){
          container.innerHTML = `
            <div class="no-data">
              <div class="no-data-icon">
                ◷
              </div>

              <div class="no-data-title">
                No browsing history
              </div>

              <div class="no-data-text">
                Pages you visit will appear here.
              </div>
            </div>
          `;

          return;
        }

        container.innerHTML="";

        list.forEach(item=>{
          const row =
            document.createElement("div");

          row.className =
            "list-item";

          const icon =
            document.createElement("div");

          icon.className =
            "list-icon";

          const img =
            document.createElement("img");

          img.width=24;
          img.height=24;
          img.alt="";
          img.src =
            item.favicon ||
            faviconFor(item.url) ||
            "";

          img.onerror=()=>{
            img.removeAttribute("src");
            icon.textContent="◈";
          };

          icon.appendChild(img);

          const main =
            document.createElement("div");

          main.className =
            "list-main";

          const title =
            document.createElement("div");

          title.className =
            "list-title";

          title.textContent =
            item.title ||
            "Web page";

          const url =
            document.createElement("div");

          url.className =
            "list-url";

          url.textContent =
            item.url;

          const meta =
            document.createElement("div");

          meta.className =
            "list-meta";

          meta.textContent =
            new Date(
              item.timestamp
            ).toLocaleString();

          main.append(
            title,
            url,
            meta
          );

          const actions =
            document.createElement("div");

          actions.className =
            "list-actions";

          const openBtn =
            iconButton(
              "↗",
              "Open"
            );

          openBtn.addEventListener(
            "click",
            ()=>navigateTo(
              item.url,
              {addHistory:false}
            )
          );

          const delBtn =
            iconButton(
              "×",
              "Delete"
            );

          delBtn.addEventListener(
            "click",
            ()=>{
              state.history =
                state.history.filter(
                  h=>h.id!==item.id
                );

              saveStorage(
                STORAGE.history,
                state.history
              );

              renderHistoryPage();

              toast(
                "History item deleted"
              );
            }
          );

          actions.append(
            openBtn,
            delBtn
          );

          row.append(
            icon,
            main,
            actions
          );

          container.appendChild(row);
        });
      }

      function isBookmarked(url){
        if(!url) return false;

        return state.bookmarks.folders.some(
          f =>
            f.items.some(
              i=>i.url===url
            )
        );
      }

      function addBookmark(
        url,
        title,
        folderId="folder-bar"
      ){
        if(!url) return;

        if(isBookmarked(url)){
          toast(
            "Page is already bookmarked"
          );

          return;
        }

        const folder =
          state.bookmarks.folders.find(
            f=>f.id===folderId
          ) ||
          state.bookmarks.folders[0];

        folder.items.push({
          id:uid("bm"),
          title:
            title ||
            titleFromUrl(url),
          url,
          createdAt:Date.now()
        });

        saveStorage(
          STORAGE.bookmarks,
          state.bookmarks
        );

        updateToolbarState();
        renderBookmarkBar();

        toast(
          "Bookmark added"
        );
      }

      function removeBookmark(
        id,
        folderId
      ){
        const folder =
          state.bookmarks.folders.find(
            f=>f.id===folderId
          );

        if(!folder) return;

        folder.items =
          folder.items.filter(
            i=>i.id!==id
          );

        saveStorage(
          STORAGE.bookmarks,
          state.bookmarks
        );

        renderBookmarksPage();
        renderBookmarkBar();
        updateToolbarState();

        toast(
          "Bookmark removed"
        );
      }

        if(
          !tab ||
          tab.url==="nova://newtab"
        ){
          toast(
            "Open a web page before bookmarking."
          );

          return;
        }

        if(isBookmarked(tab.url)){
          state.bookmarks.folders.forEach(
            f=>{
              f.items =
                f.items.filter(
                  i=>i.url!==tab.url
                );
            }
          );

          saveStorage(
            STORAGE.bookmarks,
            state.bookmarks
          );

          updateToolbarState();
          renderBookmarkBar();

          toast(
            "Bookmark removed"
          );
        }else{
          addBookmark(
            tab.url,
            tab.title
          );
        }
      }
