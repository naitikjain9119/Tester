<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Assistant</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0e17;
            --card-bg: rgba(16, 24, 39, 0.8);
            --accent-color: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.4);
            --text-color: #e2e8f0;
            --user-msg-bg: #1e293b;
            --jarvis-msg-bg: #0f172a;
            --danger-color: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 80%);
            overflow: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(10, 14, 23, 0.9);
            border-bottom: 1px solid var(--accent-glow);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .arc-reactor {
            width: 25px;
            height: 25px;
            border: 3px solid var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .token-counter {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-color);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--accent-color);
            box-shadow: 0 0 5px var(--accent-glow);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border: 1px solid #334155;
            border-bottom-right-radius: 2px;
        }

        .jarvis-message {
            align-self: flex-start;
            background-color: var(--jarvis-msg-bg);
            border: 1px solid var(--accent-glow);
            border-bottom-left-radius: 2px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.05);
        }

        .msg-tools {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 5px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: var(--accent-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .file-tag {
            display: inline-block;
            background: rgba(0, 243, 255, 0.15);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 8px;
            border: 1px dashed var(--accent-color);
        }

        /* Input Controls Area */
        .input-area {
            padding: 15px 25px;
            background: rgba(10, 14, 23, 0.95);
            border-top: 1px solid var(--accent-glow);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-preview {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-btn-label {
            cursor: pointer;
            padding: 12px;
            background: var(--user-msg-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-btn-label:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        input[type="file"] {
            display: none;
        }

        .text-input {
            flex: 1;
            background: var(--user-msg-bg);
            border: 1px solid #334155;
            padding: 12px 15px;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .text-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .btn {
            background: var(--user-msg-bg);
            border: 1px solid #334155;
            color: var(--accent-color);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .mic-btn.listening {
            background: var(--danger-color);
            color: #fff;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* Search Results Frame / Card */
        .search-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--accent-color);
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .search-card a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .search-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <div class="arc-reactor"></div>
            <span>JARVIS</span>
        </div>
        <div class="token-counter">
            <i class="fa-solid fa-microchip"></i> Tokens Used: <span id="tokenCount">0</span>
        </div>
    </header>

    <!-- Chat Messages Container -->
    <div class="chat-container" id="chatContainer">
        <div class="message jarvis-message">
            नमस्ते! मैं JARVIS हूँ। मैं आपकी क्या मदद कर सकता हूँ? आप मुझसे बोलकर या लिखकर बात कर सकते हैं।
            <div class="msg-tools">
                <button class="action-btn" onclick="copyText(this)"><i class="fa-regular fa-copy"></i> Copy</button>
                <button class="action-btn" onclick="speakText(this)"><i class="fa-solid fa-volume-high"></i> Speak</button>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <!-- File Preview Bar -->
        <div class="file-preview" id="filePreview">
            <span id="fileName"><i class="fa-solid fa-paperclip"></i> File Name</span>
            <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="clearFile()"></i>
        </div>

        <div class="controls-wrapper">
            <!-- File Upload Button (Max 3MB) -->
            <label class="file-btn-label" title="Upload File (Max 3MB)">
                <i class="fa-solid fa-paperclip"></i>
                <input type="file" id="fileInput" onchange="handleFileUpload(event)">
            </label>

            <!-- Text Input -->
            <input type="text" id="userInput" class="text-input" placeholder="यहाँ संदेश लिखें या Command दें..." onkeypress="handleKeyPress(event)">

            <!-- Voice Mic Button -->
            <button class="btn mic-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice Chat">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <!-- Send Button -->
            <button class="btn" onclick="sendMessage(false)" title="Send Text">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // State Variables
        let totalTokens = 0;
        let selectedFile = null;
        let isVoiceInput = false; // Flag to check if command came via voice
        let recognition = null;
        let isListening = false;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'hi-IN'; // Default Hindi support

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                sendMessage(true); // Voice input triggered
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error: ", event.error);
                document.getElementById('micBtn').classList.remove('listening');
                isListening = false;
            };
        } else {
            alert("आपका Browser Voice Recognition Support नहीं करता। कृपया Chrome का उपयोग करें।");
        }

        // Speech Recognition Toggle
        function toggleVoiceInput() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // File Upload Handler (3MB Limit strictly enforced)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const maxSizeBytes = 3 * 1024 * 1024; // 3 MB
            if (file.size > maxSizeBytes) {
                alert("त्रुटि: केवल 3 MB तक की ही फ़ाइल अपलोड की जा सकती है!");
                clearFile();
                return;
            }

            selectedFile = file;
            document.getElementById('fileName').innerHTML = `<i class="fa-solid fa-file"></i> ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            document.getElementById('filePreview').style.display = 'flex';
        }

        function clearFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').style.display = 'none';
        }

        // Handle Enter Key Press
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage(false);
            }
        }

        // Main Send Message Function
        function sendMessage(viaVoice = false) {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();

            if (!text && !selectedFile) return;

            isVoiceInput = viaVoice;

            // Calculate & Update Tokens
            const inputTokens = calculateTokens(text + (selectedFile ? selectedFile.name : ''));
            updateTokens(inputTokens);

            // Display User Message
            renderUserMessage(text, selectedFile);

            // Clear Input Area
            inputField.value = '';
            const attachedFile = selectedFile;
            clearFile();

            // Process & Generate AI Response
            setTimeout(() => {
                processJarvisResponse(text, attachedFile);
            }, 500);
        }

        // Token Counter Estimator (Roughly 1 token = 4 chars)
        function calculateTokens(str) {
            if (!str) return 0;
            return Math.ceil(str.length / 3) + 2;
        }

        function updateTokens(count) {
            totalTokens += count;
            document.getElementById('tokenCount').innerText = totalTokens;
        }

        // Render User Message UI
        function renderUserMessage(text, file) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user-message';

            let contentHTML = '';
            if (file) {
                contentHTML += `<div class="file-tag"><i class="fa-solid fa-paperclip"></i> ${file.name}</div><br>`;
            }
            contentHTML += escapeHTML(text);

            contentHTML += `
                <div class="msg-tools">
                    <button class="action-btn" onclick="copyText(this)"><i class="fa-regular fa-copy"></i> Copy</button>
                </div>
            `;

            msgDiv.innerHTML = contentHTML;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // JARVIS Processing Logic
        function processJarvisResponse(text, file) {
            let responseText = "";
            let searchUrl = "";
            let externalOpened = false;

            const lowerText = text.toLowerCase();

            // 1. Web & Application Opener Functionality
            if (lowerText.includes("open google") || lowerText.includes("गूगल खोलो")) {
                responseText = "Google खोल रहा हूँ...";
                window.open("https://www.google.com", "_blank");
                externalOpened = true;
            } else if (lowerText.includes("open youtube") || lowerText.includes("यूट्यूब खोलो")) {
                responseText = "YouTube खोल रहा हूँ...";
                window.open("https://www.youtube.com", "_blank");
                externalOpened = true;
            } else if (lowerText.includes("open whatsapp") || lowerText.includes("व्हाट्सएप खोलो")) {
                responseText = "WhatsApp Web खोल रहा हूँ...";
                window.open("https://web.whatsapp.com", "_blank");
                externalOpened = true;
            } else if (lowerText.startsWith("open ") || lowerText.startsWith("खोलो ")) {
                let domain = text.replace(/open /i, '').replace(/खोलो /i, '').trim();
                if (!domain.includes('.')) domain += ".com";
                responseText = `${domain} खोल रहा हूँ...`;
                window.open(`https://${domain}`, "_blank");
                externalOpened = true;
            }
            // 2. Web Search Functionality
            else if (lowerText.includes("search ") || lowerText.includes("खोजो ") || lowerText.includes("ढूंढो ")) {
                let query = text.replace(/search /i, '').replace(/खोजो /i, '').replace(/ढूंढो /i, '').trim();
                searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                responseText = `यहाँ "${query}" के लिए खोज परिणाम हैं:`;
                window.open(searchUrl, "_blank");
            }
            // 3. File Processing Response
            else if (file) {
                responseText = `मुझे आपकी फ़ाइल "${file.name}" (साइज़: ${(file.size/1024).toFixed(1)} KB) मिल गई है। फ़ाइल का विश्लेषण पूरा हो गया है।`;
            }
            // 4. Default Conversational Responses
            else if (lowerText.includes("hello") || lowerText.includes("नमस्ते") || lowerText.includes("हाय")) {
                responseText = "नमस्ते! मैं JARVIS हूँ। बताइए आज मैं आपकी क्या सहायता करूँ?";
            } else if (lowerText.includes("who are you") || lowerText.includes("तुम कौन हो")) {
                responseText = "मैं JARVIS हूँ, आपका स्मार्ट AI वॉयस और टेक्स्ट असिस्टेंट।";
            } else if (lowerText.includes("time") || lowerText.includes("समय") || lowerText.includes("टाइम")) {
                const now = new Date();
                responseText = `अभी समय हुआ है: ${now.toLocaleTimeString('hi-IN')}`;
            } else {
                responseText = `आपने पूछा: "${text}"। मैंने आपका अनुरोध प्रोसेस कर लिया है। यदि आपको इसके बारे में अधिक जानकारी चाहिए या किसी वेबसाइट पर खोजना है, तो "Search [विषय]" कहें।`;
            }

            // Calculate Tokens for Response
            const outTokens = calculateTokens(responseText);
            updateTokens(outTokens);

            // Render Response
            renderJarvisMessage(responseText, searchUrl);

            // Text-to-Speech logic: ONLY speak if input was given via VOICE
            if (isVoiceInput) {
                speakString(responseText);
            }
        }

        // Render JARVIS Message UI
        function renderJarvisMessage(text, searchUrl) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message jarvis-message';

            let html = `<span>${escapeHTML(text)}</span>`;

            if (searchUrl) {
                html += `
                    <div class="search-card">
                        <i class="fa-solid fa-magnifying-glass"></i> <a href="${searchUrl}" target="_blank">Google पर सर्च रिजल्ट देखें</a>
                    </div>
                `;
            }

            html += `
                <div class="msg-tools">
                    <button class="action-btn" onclick="copyText(this)"><i class="fa-regular fa-copy"></i> Copy</button>
                    <button class="action-btn" onclick="speakText(this)"><i class="fa-solid fa-volume-high"></i> Speak</button>
                </div>
            `;

            msgDiv.innerHTML = html;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Speech Synthesis (Text to Speech)
        function speakString(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Manual Speak Button Handler
        function speakText(btn) {
            const msgDiv = btn.closest('.message');
            // Extract text removing button labels
            const textToSpeak = msgDiv.innerText.replace(/Copy/g, '').replace(/Speak/g, '').trim();
            speakString(textToSpeak);
        }

        // Copy Text Functionality
        function copyText(btn) {
            const msgDiv = btn.closest('.message');
            // Clone div to manipulate text extraction cleanly
            const clone = msgDiv.cloneNode(true);
            const tools = clone.querySelector('.msg-tools');
            if (tools) tools.remove();

            const textToCopy = clone.innerText.trim();

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1500);
            }).catch(err => {
                console.error('Copy failed: ', err);
            });
        }

        // Helper Utility to Escape HTML
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
