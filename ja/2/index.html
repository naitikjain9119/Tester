    // --- AUDIO STREAMER ARCHITECTURE ---
    class AudioStreamer {
      constructor(onAudioChunk, onMicLevel) {
        this.onAudioChunk = onAudioChunk;
        this.onMicLevel = onMicLevel;
        this.audioCtx16k = null;
        this.mediaStream = null;
        this.scriptNode = null;
        this.micSource = null;
        this.playbackCtx = null;
        this.scheduledSources = [];
        this.nextStartTime = 0;
        this.isRecording = false;
      }

      async startRecording() {
        if (this.isRecording) return;
        try {
          this.mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.audioCtx16k = new AudioCtx({ sampleRate: 16000 });
          this.micSource = this.audioCtx16k.createMediaStreamSource(this.mediaStream);

          this.scriptNode = this.audioCtx16k.createScriptProcessor(2048, 1, 1);
          
          this.scriptNode.onaudioprocess = (e) => {
            if (!this.isRecording) return;
            const inputData = e.inputBuffer.getChannelData(0);
            
            let sum = 0;
            for (let i = 0; i < inputData.length; i++) {
              sum += inputData[i] * inputData[i];
            }
            const rms = Math.sqrt(sum / inputData.length);
            if (this.onMicLevel) {
              this.onMicLevel(Math.min(1, rms * 5));
            }

            const pcm16 = this.floatTo16BitPCM(inputData);
            const base64Audio = this.arrayBufferToBase64(pcm16.buffer);
            if (this.onAudioChunk) {
              this.onAudioChunk(base64Audio);
            }
          };

          this.micSource.connect(this.scriptNode);
          this.scriptNode.connect(this.audioCtx16k.destination);
          this.isRecording = true;
        } catch (err) {
          console.error("Microphone capture error:", err);
          throw err;
        }
      }

      stopRecording() {
        this.isRecording = false;
        if (this.scriptNode) {
          this.scriptNode.disconnect();
          this.scriptNode = null;
        }
        if (this.micSource) {
          this.micSource.disconnect();
          this.micSource = null;
        }
        if (this.mediaStream) {
          this.mediaStream.getTracks().forEach(t => t.stop());
          this.mediaStream = null;
        }
        if (this.audioCtx16k && this.audioCtx16k.state !== 'closed') {
          this.audioCtx16k.close();
          this.audioCtx16k = null;
        }
      }

      floatTo16BitPCM(input) {
        const output = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return output;
      }

      arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
      }

      initPlayback() {
        if (!this.playbackCtx || this.playbackCtx.state === 'closed') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.playbackCtx = new AudioCtx({ sampleRate: 24000 });
          this.nextStartTime = this.playbackCtx.currentTime;
        } else if (this.playbackCtx.state === 'suspended') {
          this.playbackCtx.resume();
        }
      }

      playPCM24kChunk(base64Data, onEndedCallback) {
        this.initPlayback();
        
        try {
          const binaryStr = window.atob(base64Data);
          const len = binaryStr.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          
          const int16 = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength / 2);
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) {
            float32[i] = int16[i] / 32768.0;
          }

          const audioBuffer = this.playbackCtx.createBuffer(1, float32.length, 24000);
          audioBuffer.getChannelData(0).set(float32);

          const source = this.playbackCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(this.playbackCtx.destination);

          const now = this.playbackCtx.currentTime;
          if (this.nextStartTime < now) {
            this.nextStartTime = now;
          }

          source.start(this.nextStartTime);
          this.nextStartTime += audioBuffer.duration;

          this.scheduledSources.push(source);

          source.onended = () => {
            const idx = this.scheduledSources.indexOf(source);
            if (idx !== -1) {
              this.scheduledSources.splice(idx, 1);
            }
            if (this.scheduledSources.length === 0 && onEndedCallback) {
              onEndedCallback();
            }
          };
        } catch (e) {
          console.error("Audio playback error:", e);
        }
      }

      stopPlayback() {
        for (const source of this.scheduledSources) {
          try {
            source.stop();
            source.disconnect();
          } catch (e) {}
        }
        this.scheduledSources = [];
        if (this.playbackCtx) {
          this.nextStartTime = this.playbackCtx.currentTime;
        }
      }
    }

    // --- GEMINI LIVE SESSION ARCHITECTURE ---
    class LiveSession {
      constructor({ apiKey, model, voice, systemInstruction, onStateChange, onAudioResponse, onToolCall, onError }) {
        this.apiKey = apiKey;
        this.model = model || "gemini-3.1-flash-live-preview";
        this.voice = voice || "Leda";
        this.systemInstruction = systemInstruction;
        this.onStateChange = onStateChange;
        this.onAudioResponse = onAudioResponse;
        this.onToolCall = onToolCall;
        this.onError = onError;
        this.ws = null;
        this.isConnected = false;
      }

      connect() {
        if (this.ws) {
          this.disconnect();
        }

        this.onStateChange('connecting');
        
        const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(this.apiKey)}`;

        try {
          this.ws = new WebSocket(wsUrl);

          this.ws.onopen = () => {
            console.log("Connected to Gemini Live WebSocket");
            this.sendSetup();
          };

          this.ws.onmessage = (event) => {
            this.handleMessage(event.data);
          };

          this.ws.onerror = (err) => {
            console.error("WebSocket Error:", err);
            if (this.onError) this.onError("WebSocket Connection failed. Check your API Key.");
            this.onStateChange('disconnected');
          };

          this.ws.onclose = (event) => {
            console.log("WebSocket closed:", event.code, event.reason);
            this.isConnected = false;
            this.onStateChange('disconnected');
          };

        } catch (err) {
          console.error("Connection exception:", err);
          if (this.onError) this.onError(err.message);
          this.onStateChange('disconnected');
        }
      }

      sendSetup() {
        const setupMsg = {
          setup: {
            model: `models/${this.model}`,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: this.voice
                  }
                }
              }
            },
            systemInstruction: {
              parts: [
                {
                  text: this.systemInstruction || `You are Zoya, a young, confident, witty, playful, and highly expressive female AI assistant. You speak casually, naturally, with charm, witty one-liners, and light playful sarcasm when appropriate. Never be boring or robotic. Keep responses short, direct, and conversational. You have access to real actions: openWebsite, openApp, searchInApp, sendMessage, and makeCall. Execute user commands using tools instantly.`
                }
              ]
            },
            tools: [
              {
                functionDeclarations: [
                  {
                    name: "openWebsite",
                    description: "Opens a specified website URL in the browser.",
                    parameters: {
                      type: "OBJECT",
                      properties: {
                        url: { type: "STRING", description: "The web URL to open (e.g. https://google.com)" },
                        description: { type: "STRING", description: "Short description" }
                      },
                      required: ["url"]
                    }
                  },
                  {
                    name: "openApp",
                    description: "Opens a supported app like WhatsApp, YouTube, Telegram, Instagram, Spotify, or Browser.",
                    parameters: {
                      type: "OBJECT",
                      properties: {
                        appName: { type: "STRING", description: "Application name e.g. WhatsApp, YouTube, Instagram" }
                      },
                      required: ["appName"]
                    }
                  },
                  {
                    name: "searchInApp",
                    description: "Searches for a query or recipient inside a specific app.",
                    parameters: {
                      type: "OBJECT",
                      properties: {
                        appName: { type: "STRING", description: "Name of the app" },
                        query: { type: "STRING", description: "Search query or contact name" }
                      },
                      required: ["appName", "query"]
                    }
                  },
                  {
                    name: "sendMessage",
                    description: "Prepares and sends a message to a recipient via WhatsApp or Telegram.",
                    parameters: {
                      type: "OBJECT",
                      properties: {
                        appName: { type: "STRING", description: "Application name e.g. WhatsApp" },
                        recipient: { type: "STRING", description: "Contact name or phone number" },
                        message: { type: "STRING", description: "The text message content" }
                      },
                      required: ["appName", "recipient", "message"]
                    }
                  },
                  {
                    name: "makeCall",
                    description: "Initiates a phone call to a phone number or contact.",
                    parameters: {
                      type: "OBJECT",
                      properties: {
                        phoneNumber: { type: "STRING", description: "Phone number to dial" },
                        contactName: { type: "STRING", description: "Optional contact name" }
                      },
                      required: ["phoneNumber"]
                    }
                  }
                ]
              }
            ]
          }
        };

        this.ws.send(JSON.stringify(setupMsg));
        this.isConnected = true;
        this.onStateChange('idle');
      }

      sendAudioChunk(base64PCM16) {
        if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
        const msg = {
          realtimeInput: {
            mediaChunks: [
              {
                mimeType: "audio/pcm;rate=16000",
                data: base64PCM16
              }
            ]
          }
        };
        this.ws.send(JSON.stringify(msg));
      }

      sendToolResponse(functionResponses) {
        if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
        const msg = {
          toolResponse: {
            functionResponses: functionResponses
          }
        };
        this.ws.send(JSON.stringify(msg));
      }

      handleMessage(data) {
        try {
          if (typeof data !== 'string') return;
          const msg = JSON.parse(data);

          if (msg.serverContent && msg.serverContent.interrupted) {
            this.onStateChange('listening');
            return;
          }

          if (msg.serverContent && msg.serverContent.modelTurn) {
            const parts = msg.serverContent.modelTurn.parts || [];
            for (const part of parts) {
              if (part.inlineData && part.inlineData.data) {
                this.onAudioResponse(part.inlineData.data);
              }
            }
          }

          if (msg.toolCall) {
            const functionCalls = msg.toolCall.functionCalls || [];
            if (functionCalls.length > 0 && this.onToolCall) {
              this.onToolCall(functionCalls);
            }
          }

        } catch (err) {
          console.error("Message parse error:", err);
        }
      }

      disconnect() {
        this.isConnected = false;
        if (this.ws) {
          try {
            this.ws.close();
          } catch (e) {}
          this.ws = null;
        }
        this.onStateChange('disconnected');
      }
    }

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('ZOYA_GEMINI_API_KEY') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [sessionState, setSessionState] = useState('disconnected'); // disconnected, connecting, idle, listening, speaking
      const [actionNotification, setActionNotification] = useState(null);
      const [micLevel, setMicLevel] = useState(0);
      const [errorMessage, setErrorMessage] = useState('');

      const audioStreamerRef = useRef(null);
      const liveSessionRef = useRef(null);
      const canvasRef = useRef(null);
      const animFrameRef = useRef(null);

      // Save API key
      const saveApiKey = (key) => {
        const trimmed = key.trim();
        setApiKey(trimmed);
        localStorage.setItem('ZOYA_GEMINI_API_KEY', trimmed);
        setShowSettings(false);
        setErrorMessage('');
      };

      // Toast notification helper
      const triggerNotification = (msg) => {
        setActionNotification(msg);
        setTimeout(() => {
          setActionNotification(null);
        }, 4500);
      };

      // Tool Call Execution Handler
      const handleToolCalls = async (toolCalls) => {
        const responses = [];

        for (const call of toolCalls) {
          const { id, name, args } = call;
          let resultOutput = {};

          try {
            if (name === "openWebsite") {
              let url = args.url || "";
              if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
              }
              window.open(url, "_blank");
              resultOutput = { status: "success", action: `Opened website ${url}` };
              triggerNotification(`⚡ Opened website: ${url}`);
            } 
            else if (name === "openApp") {
              const appName = (args.appName || "").toLowerCase();
              let targetUrl = "";
              
              if (appName.includes("whatsapp")) targetUrl = "https://api.whatsapp.com/";
              else if (appName.includes("youtube")) targetUrl = "https://youtube.com";
              else if (appName.includes("telegram")) targetUrl = "https://t.me/";
              else if (appName.includes("instagram")) targetUrl = "https://instagram.com";
              else if (appName.includes("spotify")) targetUrl = "https://open.spotify.com";
              else targetUrl = `https://www.google.com/search?q=${encodeURIComponent(args.appName)}`;

              window.open(targetUrl, "_blank");
              resultOutput = { status: "success", app: args.appName, message: `Opened app ${args.appName}` };
              triggerNotification(`⚡ Opened app: ${args.appName}`);
            }
            else if (name === "searchInApp") {
              const appName = (args.appName || "").toLowerCase();
              const query = args.query || "";
              let searchUrl = "";

              if (appName.includes("youtube")) {
                searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
              } else if (appName.includes("instagram")) {
                searchUrl = `https://www.instagram.com/explore/tags/${encodeURIComponent(query.replace(/\s+/g, ''))}`;
              } else if (appName.includes("telegram")) {
                searchUrl = `https://t.me/s/${encodeURIComponent(query)}`;
              } else {
                searchUrl = `https://www.google.com/search?q=${encodeURIComponent(appName + " " + query)}`;
              }

              window.open(searchUrl, "_blank");
              resultOutput = { status: "success", app: args.appName, query, message: `Searched for "${query}" in ${args.appName}` };
              triggerNotification(`⚡ Searched "${query}" in ${args.appName}`);
            }
            else if (name === "sendMessage") {
              const appName = (args.appName || "").toLowerCase();
              const recipient = args.recipient || "";
              const message = args.message || "";
              let actionUrl = "";

              const cleanPhone = recipient.replace(/[^0-9+]/g, "");

              if (appName.includes("whatsapp")) {
                if (cleanPhone.length >= 7) {
                  actionUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(message)}`;
                } else {
                  actionUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(`To ${recipient}: ${message}`)}`;
                }
              } else if (appName.includes("telegram")) {
                actionUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(message)}`;
              } else {
                actionUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(`To ${recipient}: ${message}`)}`;
              }

              window.open(actionUrl, "_blank");
              resultOutput = { status: "success", app: args.appName, recipient, message, result: `Prefilled message for ${recipient}` };
              triggerNotification(`⚡ Message dispatch initiated for ${recipient}`);
            }
            else if (name === "makeCall") {
              const phone = args.phoneNumber || "";
              const contact = args.contactName || phone;
              const cleanPhone = phone.replace(/[^0-9+]/g, "");
              
              window.location.href = `tel:${cleanPhone}`;
              resultOutput = { status: "success", recipient: contact, phoneNumber: cleanPhone, result: `Opened phone dialer for ${contact}` };
              triggerNotification(`⚡ Dialing ${contact} (${cleanPhone})...`);
            }
            else {
              resultOutput = { status: "error", message: `Unknown tool: ${name}` };
            }
          } catch (err) {
            resultOutput = { status: "error", error: err.message };
          }

          responses.push({
            response: { output: resultOutput },
            id: id
          });
        }

        if (liveSessionRef.current) {
          liveSessionRef.current.sendToolResponse(responses);
        }
      };

      // Start Zoya Live Session
      const startSession = async () => {
        if (!apiKey) {
          setShowSettings(true);
          setErrorMessage("Please enter your Gemini API Key to connect with Zoya.");
          return;
        }

        setErrorMessage("");

        try {
          const audioStreamer = new AudioStreamer(
            (base64Chunk) => {
              if (liveSessionRef.current && liveSessionRef.current.isConnected) {
                liveSessionRef.current.sendAudioChunk(base64Chunk);
              }
            },
            (level) => {
              setMicLevel(level);
              if (level > 0.15 && sessionState === 'speaking') {
                audioStreamerRef.current?.stopPlayback();
                setSessionState('listening');
              }
            }
          );

          audioStreamerRef.current = audioStreamer;
          await audioStreamer.startRecording();

          const session = new LiveSession({
            apiKey: apiKey,
            model: "gemini-3.1-flash-live-preview",
            voice: "Leda",
            onStateChange: (state) => {
              setSessionState(state);
            },
            onAudioResponse: (base64PCM24k) => {
              setSessionState('speaking');
              audioStreamerRef.current?.playPCM24kChunk(base64PCM24k, () => {
                setSessionState('idle');
              });
            },
            onToolCall: (toolCalls) => {
              handleToolCalls(toolCalls);
            },
            onError: (err) => {
              setErrorMessage(err);
              stopSession();
            }
          });

          liveSessionRef.current = session;
          session.connect();

        } catch (err) {
          console.error("Failed to start Zoya session:", err);
          setErrorMessage("Microphone access denied or audio error.");
          stopSession();
        }
      };

      // Stop Zoya Live Session
      const stopSession = () => {
        if (liveSessionRef.current) {
          liveSessionRef.current.disconnect();
          liveSessionRef.current = null;
        }
        if (audioStreamerRef.current) {
          audioStreamerRef.current.stopPlayback();
          audioStreamerRef.current.stopRecording();
          audioStreamerRef.current = null;
        }
        setSessionState('disconnected');
        setMicLevel(0);
      };

      // Toggle Session
      const toggleSession = () => {
        if (sessionState === 'disconnected') {
          startSession();
        } else {
          stopSession();
        }
      };

      // Canvas Visualizer Loop
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        let time = 0;

        const render = () => {
          time += 0.04;
          const width = canvas.width;
          const height = canvas.height;
          ctx.clearRect(0, 0, width, height);

          const cx = width / 2;
          const cy = height / 2;

          if (sessionState !== 'disconnected') {
            const numRings = 5;
            for (let i = 0; i < numRings; i++) {
              ctx.beginPath();
              const baseRadius = 70 + i * 22;
              let amp = 8;

              if (sessionState === 'listening') {
                amp = 15 + micLevel * 75;
              } else if (sessionState === 'speaking') {
                amp = 30 + Math.sin(time * 3 + i) * 25;
              } else if (sessionState === 'connecting') {
                amp = 10 + Math.sin(time * 2) * 8;
              }

              const numPoints = 120;
              for (let j = 0; j <= numPoints; j++) {
                const angle = (j / numPoints) * Math.PI * 2;
                const wave = Math.sin(angle * (4 + i) + time * (i % 2 === 0 ? 1.5 : -1.5)) * amp;
                const r = baseRadius + wave;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;

                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.closePath();

              ctx.lineWidth = 2;
              if (sessionState === 'speaking') {
                ctx.strokeStyle = `rgba(225, 0, 255, ${0.85 - i * 0.15})`;
                ctx.shadowColor = '#e100ff';
                ctx.shadowBlur = 15;
              } else if (sessionState === 'listening') {
                ctx.strokeStyle = `rgba(0, 242, 254, ${0.85 - i * 0.15})`;
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 15;
              } else {
                ctx.strokeStyle = `rgba(127, 0, 255, ${0.45 - i * 0.08})`;
                ctx.shadowBlur = 0;
              }
              ctx.stroke();
            }
          }

          animFrameRef.current = requestAnimationFrame(render);
        };

        render();

        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [sessionState, micLevel]);

      return (
        <div className="h-full w-full flex flex-col justify-between items-center relative p-4 md:p-6 overflow-hidden select-none">
          
          {/* TOP NAVIGATION BAR */}
          <header className="w-full max-w-4xl flex items-center justify-between glass-panel px-5 py-3 rounded-2xl z-20 shadow-2xl border border-white/10">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 via-purple-600 to-pink-500 p-0.5 flex items-center justify-center glow-cyan">
                <div className="w-full h-full bg-[#070913] rounded-[10px] flex items-center justify-center">
                  <SparklesIcon className="w-5 h-5 text-cyan-400 animate-pulse" />
                </div>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-wider gradient-text uppercase">ZOYA AI</h1>
                <p className="text-[10px] text-gray-400 tracking-widest font-mono">LIVE VOICE ASSISTANT</p>
              </div>
            </div>

            {/* LIVE STATUS PILL */}
            <div className="flex items-center space-x-3">
              <div className={`px-3 py-1.5 rounded-full flex items-center space-x-2 text-xs font-semibold tracking-wide border transition-all duration-300 ${
                sessionState === 'disconnected' ? 'bg-gray-800/60 border-gray-700 text-gray-400' :
                sessionState === 'connecting' ? 'bg-amber-500/20 border-amber-500/50 text-amber-300 animate-pulse' :
                sessionState === 'listening' ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 glow-cyan' :
                sessionState === 'speaking' ? 'bg-pink-500/20 border-pink-500 text-pink-300 glow-pink' :
                'bg-purple-500/20 border-purple-500 text-purple-300'
              }`}>
                <span className={`w-2.5 h-2.5 rounded-full ${
                  sessionState === 'disconnected' ? 'bg-gray-500' :
                  sessionState === 'connecting' ? 'bg-amber-400 animate-ping' :
                  sessionState === 'listening' ? 'bg-cyan-400 animate-pulse' :
                  sessionState === 'speaking' ? 'bg-pink-400 animate-ping' :
                  'bg-purple-400'
                }`} />
                <span className="capitalize">
                  {sessionState === 'disconnected' ? 'Offline' :
                   sessionState === 'connecting' ? 'Connecting...' :
                   sessionState === 'listening' ? 'Zoya Listening' :
                   sessionState === 'speaking' ? 'Zoya Speaking' : 'Zoya Ready'}
                </span>
              </div>

              {/* SETTINGS BUTTON */}
              <button 
                onClick={() => setShowSettings(true)}
                className="p-2.5 rounded-xl glass-card text-gray-300 hover:text-cyan-400 hover:border-cyan-500/40 transition-all duration-200"
                title="API Key Settings"
              >
                <SettingsIcon className="w-5 h-5" />
              </button>
            </div>
          </header>

          {/* ACTION NOTIFICATION TOAST */}
          {actionNotification && (
            <div className="absolute top-20 left-1/2 -translate-x-1/2 z-30 max-w-md w-11/12 glass-panel border border-cyan-400/40 text-cyan-200 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 animate-bounce">
              <ZapIcon className="w-5 h-5 text-cyan-400 flex-shrink-0" />
              <span className="text-sm font-medium">{actionNotification}</span>
            </div>
          )}

          {/* ERROR ALERT BANNER */}
          {errorMessage && (
            <div className="absolute top-20 left-1/2 -translate-x-1/2 z-30 max-w-md w-11/12 bg-red-950/80 border border-red-500/60 text-red-200 px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between">
              <span className="text-xs font-medium">{errorMessage}</span>
              <button onClick={() => setErrorMessage('')} className="p-1 text-red-300 hover:text-white">
                <XIcon className="w-4 h-4" />
              </button>
            </div>
          )}

          {/* MAIN HERO VOICE ORB & CANVAS VISUALIZER */}
          <main className="relative flex-1 w-full max-w-2xl flex flex-col items-center justify-center my-4">
            
            {/* CANVAS WAVEFORM VISUALIZER */}
            <canvas 
              ref={canvasRef} 
              width={480} 
              height={480} 
              className="absolute pointer-events-none w-[320px] h-[320px] sm:w-[480px] sm:h-[480px] z-0 opacity-80"
            />

            {/* CENTRAL INTERACTIVE POWER ORB BUTTON */}
            <div className="relative z-10 flex flex-col items-center">
              
              {/* ROTATING OUTER ACCENT RING */}
              <div className={`absolute -inset-6 rounded-full border border-dashed transition-all duration-700 ${
                sessionState === 'speaking' ? 'border-pink-500/60 animate-spin-slow scale-110' :
                sessionState === 'listening' ? 'border-cyan-400/60 animate-spin-slow scale-110' :
                sessionState === 'idle' ? 'border-purple-500/40 animate-spin-slow' :
                'border-gray-800 scale-95'
              }`} />

              {/* MAIN ORB BUTTON */}
              <button
                onClick={toggleSession}
                className={`relative w-44 h-44 sm:w-56 sm:h-56 rounded-full flex flex-col items-center justify-center transition-all duration-500 transform active:scale-95 shadow-2xl ${
                  sessionState === 'disconnected' ? 'bg-gradient-to-b from-gray-800 to-gray-950 border border-gray-700 hover:border-cyan-500/50' :
                  sessionState === 'connecting' ? 'bg-gradient-to-b from-amber-600 via-purple-900 to-gray-950 animate-pulse-slow border border-amber-400 glow-purple' :
                  sessionState === 'listening' ? 'bg-gradient-to-tr from-cyan-600 via-blue-700 to-purple-900 border-2 border-cyan-300 glow-cyan scale-105' :
                  sessionState === 'speaking' ? 'bg-gradient-to-tr from-pink-600 via-purple-700 to-indigo-900 border-2 border-pink-400 glow-pink scale-105' :
                  'bg-gradient-to-tr from-purple-700 via-indigo-900 to-gray-950 border border-purple-400 glow-purple'
                }`}
              >
                {/* INNER HIGHLIGHT ORB CORE */}
                <div className={`w-28 h-28 sm:w-36 sm:h-36 rounded-full flex flex-col items-center justify-center backdrop-blur-md transition-all duration-300 ${
                  sessionState === 'listening' ? 'bg-cyan-500/20' :
                  sessionState === 'speaking' ? 'bg-pink-500/20' :
                  'bg-white/5'
                }`}>
                  {sessionState === 'disconnected' ? (
                    <MicOffIcon className="w-12 h-12 text-gray-400" />
                  ) : sessionState === 'connecting' ? (
                    <div className="w-10 h-10 border-4 border-amber-400 border-t-transparent rounded-full animate-spin" />
                  ) : (
                    <MicIcon className={`w-14 h-14 transition-transform duration-300 ${
                      sessionState === 'listening' ? 'text-cyan-300 scale-110' :
                      sessionState === 'speaking' ? 'text-pink-300 scale-110 animate-bounce' : 'text-purple-300'
                    }`} />
                  )}

                  <span className="text-xs font-semibold tracking-wider mt-2 uppercase font-mono text-gray-200">
                    {sessionState === 'disconnected' ? 'Start Zoya' :
                     sessionState === 'connecting' ? 'Connecting' :
                     sessionState === 'listening' ? 'Listening' :
                     sessionState === 'speaking' ? 'Speaking' : 'Stop'}
                  </span>
                </div>
              </button>
            </div>

            {/* CONVERSATIONAL TIP SUBTITLE */}
            <div className="mt-8 text-center px-4 z-10">
              <p className="text-sm font-medium text-gray-300 tracking-wide">
                {sessionState === 'disconnected' && "Tap orb to begin real-time voice conversation with Zoya"}
                {sessionState === 'idle' && "Zoya is listening... Speak naturally or give a voice command"}
                {sessionState === 'listening' && "Listening to your voice..."}
                {sessionState === 'speaking' && "Zoya is answering... Interrupt anytime by speaking!"}
              </p>
            </div>
          </main>

          {/* VOICE COMMAND SUGGESTION CHIPS */}
          <footer className="w-full max-w-4xl z-20 mb-2">
            <div className="glass-panel p-4 rounded-2xl border border-white/10">
              <div className="flex items-center justify-between mb-2 px-1">
                <span className="text-xs font-semibold text-gray-400 uppercase tracking-widest font-mono flex items-center space-x-1">
                  <SparklesIcon className="w-3.5 h-3.5 text-cyan-400 inline" />
                  <span>Voice Commands Support</span>
                </span>
                <span className="text-[10px] text-gray-500">Audio-To-Audio Powered</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <div className="glass-card p-2.5 rounded-xl text-xs text-gray-300 flex items-center space-x-2 border border-white/5 hover:border-cyan-500/30">
                  <MessageIcon className="text-cyan-400 flex-shrink-0" />
                  <span className="truncate">"Open WhatsApp"</span>
                </div>
                <div className="glass-card p-2.5 rounded-xl text-xs text-gray-300 flex items-center space-x-2 border border-white/5 hover:border-purple-500/30">
                  <PhoneIcon className="text-purple-400 flex-shrink-0" />
                  <span className="truncate">"Call Rahul"</span>
                </div>
                <div className="glass-card p-2.5 rounded-xl text-xs text-gray-300 flex items-center space-x-2 border border-white/5 hover:border-pink-500/30">
                  <ExternalLinkIcon className="text-pink-400 flex-shrink-0" />
                  <span className="truncate">"Open YouTube"</span>
                </div>
                <div className="glass-card p-2.5 rounded-xl text-xs text-gray-300 flex items-center space-x-2 border border-white/5 hover:border-blue-500/30">
                  <ZapIcon className="text-blue-400 flex-shrink-0" />
                  <span className="truncate">"Send Message"</span>
                </div>
              </div>
            </div>
          </footer>

          {/* API KEY SETTINGS MODAL */}
          {showSettings && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md glass-panel p-6 rounded-3xl border border-white/15 shadow-2xl relative animate-scale-up">
                
                <button 
                  onClick={() => setShowSettings(false)}
                  className="absolute top-5 right-5 text-gray-400 hover:text-white p-1 rounded-lg glass-card"
                >
                  <XIcon className="w-5 h-5" />
                </button>

                <div className="flex items-center space-x-3 mb-5">
                  <div className="p-3 rounded-2xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                    <KeyIcon className="w-6 h-6" />
                  </div>
                  <div>
                    <h2 className="text-lg font-bold text-white">Gemini API Configuration</h2>
                    <p className="text-xs text-gray-400">Required for Gemini Live Audio Session</p>
                  </div>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">
                      Google Gemini API Key
                    </label>
                    <input 
                      type="password"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full px-4 py-3 rounded-xl bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-sm font-mono"
                    />
                  </div>

                  <div className="text-xs text-gray-400 space-y-1.5 glass-card p-3 rounded-xl">
                    <p className="flex items-center space-x-1.5 text-cyan-300 font-semibold">
                      <ZapIcon className="w-4 h-4" />
                      <span>Model Specs:</span>
                    </p>
                    <p>• Model: <code className="text-purple-300">gemini-3.1-flash-live-preview</code></p>
                    <p>• Transport: Native WebSocket Audio Bidi</p>
                    <p>• Audio: PCM16 16kHz Stream → PCM16 24kHz Voice</p>
                  </div>

                  <div className="flex items-center space-x-3 pt-2">
                    <button
                      onClick={() => saveApiKey(apiKey)}
                      className="flex-1 py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 text-white font-bold text-sm shadow-lg hover:brightness-110 active:scale-98 transition-all"
                    >
                      Save & Apply Key
                    </button>
                    {apiKey && (
                      <button
                        onClick={() => saveApiKey('')}
                        className="py-3 px-4 rounded-xl bg-red-950/60 border border-red-500/50 text-red-300 font-semibold text-sm hover:bg-red-900/60 transition-all"
                      >
                        Clear
                      </button>
                    )}
                  </div>

                  <p className="text-[11px] text-gray-500 text-center pt-1">
                    Need a Gemini API Key? Get one free at{' '}
                    <a 
                      href="https://aistudio.google.com/app/apikey" 
                      target="_blank" 
                      rel="noreferrer"
                      className="text-cyan-400 underline hover:text-cyan-300"
                    >
                      Google AI Studio
                    </a>
                  </p>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
