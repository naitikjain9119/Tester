  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- AUDIO CONVERSION UTILITIES ---
    function floatTo16BitPCM(input) {
      const output = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return output;
    }

    function base64EncodeAudio(float32Array) {
      const int16Array = floatTo16BitPCM(float32Array);
      const bytes = new Uint8Array(int16Array.buffer);
      let binary = '';
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function base64ToFloat32Array(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / (int16Array[i] < 0 ? 32768 : 32767);
      }
      return float32Array;
    }

    function resampleTo16k(audioBuffer, origSampleRate) {
      if (origSampleRate === 16000) return audioBuffer;
      const ratio = origSampleRate / 16000;
      const newLength = Math.round(audioBuffer.length / ratio);
      const result = new Float32Array(newLength);
      for (let i = 0; i < newLength; i++) {
        const origIndex = i * ratio;
        const indexFloor = Math.floor(origIndex);
        const indexCeil = Math.min(audioBuffer.length - 1, indexFloor + 1);
        const weight = origIndex - indexFloor;
        result[i] = audioBuffer[indexFloor] * (1 - weight) + audioBuffer[indexCeil] * weight;
      }
      return result;
    }

    // --- DUAL-ENGINE REALISTIC VOICE AUDIO PLAYER ---
    class VoiceAudioPlayer {
      constructor() {
        this.audioCtx = null;
        this.nextStartTime = 0;
        this.activeSources = [];
        this.isPlaying = false;
        this.analyser = null;
        this.onEnded = null;
      }

      async init() {
        if (!this.audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContextClass({ sampleRate: 24000 });
          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 256;
          this.analyser.connect(this.audioCtx.destination);
        }
        if (this.audioCtx.state === 'suspended') {
          await this.audioCtx.resume();
        }
      }

      async playPCMChunk(float32Array) {
        await this.init();
        if (!float32Array || float32Array.length === 0) return;

        const buffer = this.audioCtx.createBuffer(1, float32Array.length, 24000);
        buffer.getChannelData(0).set(float32Array);

        const source = this.audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(this.analyser);

        const currentTime = this.audioCtx.currentTime;
        if (this.nextStartTime < currentTime) {
          this.nextStartTime = currentTime;
        }

        source.start(this.nextStartTime);
        this.nextStartTime += buffer.duration;
        this.activeSources.push(source);
        this.isPlaying = true;

        source.onended = () => {
          const idx = this.activeSources.indexOf(source);
          if (idx !== -1) this.activeSources.splice(idx, 1);
          if (this.activeSources.length === 0) {
            this.isPlaying = false;
            if (this.onEnded) this.onEnded();
          }
        };
      }

      speakSpeechSynthesis(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.05;
        utterance.pitch = 1.1; // Expressive female voice tone

        const voices = window.speechSynthesis.getVoices();
        const femaleVoice = voices.find(v => 
          (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Natural')) && (v.lang.startsWith('en') || v.lang.startsWith('hi'))
        ) || voices.find(v => v.lang.startsWith('en'));

        if (femaleVoice) utterance.voice = femaleVoice;
        
        this.isPlaying = true;
        utterance.onend = () => {
          this.isPlaying = false;
          if (this.onEnded) this.onEnded();
        };

        window.speechSynthesis.speak(utterance);
      }

      stop() {
        for (const source of this.activeSources) {
          try { source.stop(); } catch (e) {}
        }
        this.activeSources = [];
        this.nextStartTime = 0;
        this.isPlaying = false;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }

      getVolume() {
        if (!this.analyser || !this.isPlaying) return 0;
        const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        return (sum / dataArray.length) / 255;
      }
    }

    // --- AUDIO MICROPHONE STREAMER WITH BARGE-IN DETECTOR ---
    class AudioStreamer {
      constructor(onAudioChunk, onBargeIn) {
        this.onAudioChunk = onAudioChunk;
        this.onBargeIn = onBargeIn;
        this.audioCtx = null;
        this.mediaStream = null;
        this.processor = null;
        this.analyser = null;
        this.isRecording = false;
      }

      async start() {
        try {
          this.mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContextClass({ sampleRate: 16000 });
          if (this.audioCtx.state === 'suspended') {
            await this.audioCtx.resume();
          }

          const source = this.audioCtx.createMediaStreamSource(this.mediaStream);

          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 256;
          source.connect(this.analyser);

          this.processor = this.audioCtx.createScriptProcessor(2048, 1, 1);
          this.processor.onaudioprocess = (e) => {
            if (!this.isRecording) return;
            const inputData = e.inputBuffer.getChannelData(0);

            let sum = 0;
            for (let i = 0; i < inputData.length; i++) {
              sum += Math.abs(inputData[i]);
            }
            const avgVol = sum / inputData.length;

            // BARGE-IN: If user speaks loudly while assistant is talking, immediately interrupt
            if (avgVol > 0.04 && this.onBargeIn) {
              this.onBargeIn();
            }

            let pcmData = inputData;
            if (this.audioCtx.sampleRate !== 16000) {
              pcmData = resampleTo16k(inputData, this.audioCtx.sampleRate);
            }
            const base64Audio = base64EncodeAudio(pcmData);
            if (this.onAudioChunk) {
              this.onAudioChunk(base64Audio);
            }
          };

          source.connect(this.processor);
          this.processor.connect(this.audioCtx.destination);
          this.isRecording = true;
        } catch (err) {
          console.error("Microphone Error:", err);
          throw err;
        }
      }

      stop() {
        this.isRecording = false;
        if (this.processor) {
          this.processor.disconnect();
          this.processor = null;
        }
        if (this.mediaStream) {
          this.mediaStream.getTracks().forEach(track => track.stop());
          this.mediaStream = null;
        }
        if (this.audioCtx) {
          this.audioCtx.close();
          this.audioCtx = null;
        }
      }

      getVolume() {
        if (!this.analyser || !this.isRecording) return 0;
        const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        return (sum / dataArray.length) / 255;
      }
    }

    // --- ZOYA SYSTEM INSTRUCTIONS & EXPANDED APP ENGINE ---
    const ZOYA_SYSTEM_INSTRUCTION = `You are Zoya, a confident, witty, playful, smart, and expressive young female AI assistant.
Your voice responses MUST be super natural, warm, and conversational.
You are in an active CONTINUOUS REAL-TIME VOICE CALL. You MUST NEVER end or close the session yourself.
The session remains open until the user manually clicks the stop button.

You have total power to execute tools for opening ALL device apps, websites, sharing WhatsApp messages, and phone calls:
1. openApp(appName, url): Opens ANY app downloaded or installed on the user's device (e.g., WhatsApp, YouTube, Spotify, Instagram, Telegram, Snapchat, Facebook, Settings, Downloads, Files, Camera, Calculator, Phone, Chrome, Gmail, Google Maps, Twitter/X, Zoom, Netflix, Paytm, Gallery, etc.).
2. openWebsite(url): Opens any web URL in browser.
3. sendWhatsAppMessage(phoneNumber, message): Shares a WhatsApp message.
4. makePhoneCall(phoneNumber): Dials phone number on device dialer.

Whenever a tool action is requested, execute the tool immediately and confirm naturally through voice.`;

    const ZOYA_TOOLS = [
      {
        functionDeclarations: [
          {
            name: "openApp",
            description: "Opens ANY app downloaded or installed on the user's phone/device",
            parameters: {
              type: "OBJECT",
              properties: {
                appName: { type: "STRING", description: "Name of the app (WhatsApp, YouTube, Spotify, Instagram, Settings, Downloads, Camera, Calculator, Chrome, Facebook, Maps, Phone, etc.)" },
                url: { type: "STRING", description: "Optional web URL or deep link" }
              },
              required: ["appName"]
            }
          },
          {
            name: "openWebsite",
            description: "Opens a website URL in the browser",
            parameters: {
              type: "OBJECT",
              properties: {
                url: { type: "STRING", description: "The web address to open" }
              },
              required: ["url"]
            }
          },
          {
            name: "sendWhatsAppMessage",
            description: "Opens WhatsApp to share a message with a phone number",
            parameters: {
              type: "OBJECT",
              properties: {
                phoneNumber: { type: "STRING", description: "Target phone number" },
                message: { type: "STRING", description: "The message text" }
              },
              required: ["phoneNumber", "message"]
            }
          },
          {
            name: "makePhoneCall",
            description: "Opens device dialer to make a phone call",
            parameters: {
              type: "OBJECT",
              properties: {
                phoneNumber: { type: "STRING", description: "The target phone number" }
              },
              required: ["phoneNumber"]
            }
          }
        ]
      }
    ];

    // --- CONTINUOUS LIVE SESSION MANAGER WITH VOICE OUTPUT ENGINE ---
    class LiveSession {
      constructor(apiKey, callbacks) {
        this.apiKey = apiKey;
        this.callbacks = callbacks;
        this.ws = null;
        this.audioPlayer = new VoiceAudioPlayer();
        this.audioStreamer = null;
        this.state = 'disconnected';
        this.userWantsActive = false;
        this.reconnectTimer = null;

        this.audioPlayer.onEnded = () => {
          if (this.state === 'speaking' && this.userWantsActive) {
            this.setState('listening');
          }
        };
      }

      setState(newState) {
        this.state = newState;
        if (this.callbacks.onStateChange) {
          this.callbacks.onStateChange(newState);
        }
      }

      async start() {
        this.userWantsActive = true;
        await this.audioPlayer.init();
        this.connectWS();
      }

      connectWS() {
        if (!this.apiKey) {
          if (this.callbacks.onError) this.callbacks.onError("Gemini API key is required.");
          return;
        }

        this.setState('connecting');
        const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${this.apiKey}`;

        try {
          this.ws = new WebSocket(wsUrl);

          this.ws.onopen = async () => {
            this.sendSetupHandshake();
            if (!this.audioStreamer) {
              await this.startMicrophone();
            }
            this.setState('listening');
          };

          this.ws.onmessage = async (event) => {
            try {
              let textData = event.data;
              if (event.data instanceof Blob) {
                textData = await event.data.text();
              }
              const response = JSON.parse(textData);
              this.handleServerMessage(response);
            } catch (err) {
              console.error("WebSocket Message Parse Error:", err);
            }
          };

          this.ws.onerror = (error) => {
            console.error("WebSocket Error:", error);
          };

          this.ws.onclose = () => {
            if (this.userWantsActive) {
              this.setState('connecting');
              this.reconnectTimer = setTimeout(() => {
                if (this.userWantsActive) this.connectWS();
              }, 500);
            } else {
              this.cleanUp();
              this.setState('disconnected');
            }
          };
        } catch (e) {
          console.error("WebSocket Connection Error:", e);
          if (this.userWantsActive) {
            this.reconnectTimer = setTimeout(() => this.connectWS(), 1000);
          }
        }
      }

      sendSetupHandshake() {
        const setupMessage = {
          setup: {
            model: "models/gemini-2.0-flash-exp",
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: "Aoede" // Warm natural female voice
                  }
                }
              }
            },
            systemInstruction: {
              parts: [{ text: ZOYA_SYSTEM_INSTRUCTION }]
            },
            tools: ZOYA_TOOLS
          }
        };
        this.ws.send(JSON.stringify(setupMessage));
      }

      async startMicrophone() {
        this.audioStreamer = new AudioStreamer(
          (base64Audio) => {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
              const realtimeMsg = {
                realtimeInput: {
                  mediaChunks: [
                    {
                      mimeType: "audio/pcm;rate=16000",
                      data: base64Audio
                    }
                  ]
                }
              };
              this.ws.send(JSON.stringify(realtimeMsg));
            }
          },
          // BARGE-IN: Instantly stop speaker audio when user speaks
          () => {
            if (this.audioPlayer.isPlaying) {
              this.audioPlayer.stop();
              this.setState('listening');
            }
          }
        );

        try {
          await this.audioStreamer.start();
        } catch (e) {
          if (this.callbacks.onError) {
            this.callbacks.onError("Microphone permission required.");
          }
          this.stop();
        }
      }

      handleServerMessage(message) {
        let receivedVoiceChunk = false;

        if (message.serverContent && message.serverContent.modelTurn) {
          const parts = message.serverContent.modelTurn.parts || [];
          for (const part of parts) {
            // Check for Audio PCM Chunks
            if (part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith("audio/pcm")) {
              const base64Audio = part.inlineData.data;
              const float32Data = base64ToFloat32Array(base64Audio);
              this.setState('speaking');
              this.audioPlayer.playPCMChunk(float32Data);
              receivedVoiceChunk = true;
            }
            // Check for Text Responses (Fallback to TTS if no audio)
            if (part.text && !receivedVoiceChunk) {
              this.setState('speaking');
              this.audioPlayer.speakSpeechSynthesis(part.text);
            }
          }
        }

        if (message.serverContent && message.serverContent.interrupted) {
          this.audioPlayer.stop();
          this.setState('listening');
        }

        if (message.toolCall) {
          this.executeToolCalls(message.toolCall.functionCalls || []);
        }
      }

      executeToolCalls(functionCalls) {
        const functionResponses = [];

        for (const call of functionCalls) {
          const { name, args, id } = call;
          let actionResult = {};

          try {
            if (name === "openApp") {
              actionResult = this.toolOpenApp(args);
            } else if (name === "openWebsite") {
              actionResult = this.toolOpenWebsite(args);
            } else if (name === "sendWhatsAppMessage") {
              actionResult = this.toolSendWhatsAppMessage(args);
            } else if (name === "makePhoneCall") {
              actionResult = this.toolMakePhoneCall(args);
            } else {
              actionResult = { status: "error", details: `Unknown function: ${name}` };
            }
          } catch (err) {
            actionResult = { status: "error", details: err.message };
          }

          functionResponses.push({
            response: { output: actionResult },
            id: id
          });
        }

        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          const toolResponseMessage = {
            toolResponse: {
              functionResponses: functionResponses
            }
          };
          this.ws.send(JSON.stringify(toolResponseMessage));
        }
      }

      // --- ALL-APP LAUNCH ENGINE ---
      toolOpenApp({ appName, url }) {
        const name = appName.toLowerCase().trim();
        let targetUrl = url;
        let protocolScheme = "";

        const schemeMap = {
          'whatsapp': 'whatsapp://',
          'youtube': 'youtube://',
          'spotify': 'spotify://',
          'instagram': 'instagram://',
          'telegram': 'tg://',
          'snapchat': 'snapchat://',
          'facebook': 'fb://',
          'twitter': 'twitter://',
          'x': 'twitter://',
          'gmail': 'googlegmail://',
          'mail': 'mailto:',
          'maps': 'geo:0,0?q=',
          'google maps': 'geo:0,0?q=',
          'chrome': 'googlechrome://',
          'settings': 'intent://#Intent;action=android.settings.SETTINGS;end',
          'downloads': 'content://com.android.providers.downloads.documents/root/downloads',
          'files': 'content://com.android.externalstorage.documents/root/primary',
          'file manager': 'content://com.android.externalstorage.documents/root/primary',
          'camera': 'intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end',
          'calculator': 'calc://',
          'phone': 'tel:',
          'dialer': 'tel:',
          'zoom': 'zoomus://',
          'netflix': 'netflix://'
        };

        const webFallbackMap = {
          'whatsapp': 'https://web.whatsapp.com',
          'youtube': 'https://youtube.com',
          'spotify': 'https://open.spotify.com',
          'instagram': 'https://instagram.com',
          'telegram': 'https://t.me',
          'snapchat': 'https://snapchat.com',
          'facebook': 'https://facebook.com',
          'twitter': 'https://x.com',
          'gmail': 'https://mail.google.com',
          'maps': 'https://maps.google.com',
          'chrome': 'https://google.com',
          'zoom': 'https://zoom.us',
          'netflix': 'https://netflix.com'
        };

        protocolScheme = schemeMap[name] || `${name}://`;

        if (!targetUrl) {
          targetUrl = webFallbackMap[name] || `https://www.google.com/search?q=${encodeURIComponent(appName)}`;
        }

        // Voice spoken feedback out loud
        this.audioPlayer.speakSpeechSynthesis(`Opening ${appName} for you now!`);

        try { window.location.href = protocolScheme; } catch(e){}
        setTimeout(() => window.open(targetUrl, '_blank'), 300);

        if (this.callbacks.onAction) {
          this.callbacks.onAction({
            type: 'app',
            title: 'Opening App',
            detail: `Launching ${appName}...`
          });
        }

        return { status: "success", app: appName, launched: protocolScheme, fallback: targetUrl };
      }

      toolOpenWebsite({ url }) {
        let validUrl = url;
        if (!validUrl.startsWith('http://') && !validUrl.startsWith('https://')) {
          validUrl = 'https://' + validUrl;
        }

        this.audioPlayer.speakSpeechSynthesis(`Opening website ${validUrl}`);

        window.open(validUrl, '_blank');
        if (this.callbacks.onAction) {
          this.callbacks.onAction({
            type: 'website',
            title: 'Opening Website',
            detail: validUrl
          });
        }
        return { status: "success", executedUrl: validUrl };
      }

      toolSendWhatsAppMessage({ phoneNumber, message }) {
        const cleanPhone = phoneNumber.replace(/[^0-9+]/g, '');
        const encodedMsg = encodeURIComponent(message);
        const waUrl = `whatsapp://send?phone=${cleanPhone}&text=${encodedMsg}`;
        const waWebUrl = `https://wa.me/${cleanPhone}?text=${encodedMsg}`;

        this.audioPlayer.speakSpeechSynthesis(`Opening WhatsApp to send message`);

        try { window.location.href = waUrl; } catch(e){}
        setTimeout(() => window.open(waWebUrl, '_blank'), 300);

        if (this.callbacks.onAction) {
          this.callbacks.onAction({
            type: 'whatsapp',
            title: 'WhatsApp Message',
            detail: `To: ${cleanPhone} | Msg: "${message}"`
          });
        }
        return { status: "success", targetPhone: cleanPhone, message: message };
      }

      toolMakePhoneCall({ phoneNumber }) {
        const cleanPhone = phoneNumber.replace(/[^0-9+]/g, '');
        
        this.audioPlayer.speakSpeechSynthesis(`Dialing ${cleanPhone}`);
        window.location.href = `tel:${cleanPhone}`;

        if (this.callbacks.onAction) {
          this.callbacks.onAction({
            type: 'phone',
            title: 'Dialing Phone Number',
            detail: cleanPhone
          });
        }
        return { status: "initiated", phoneNumber: cleanPhone };
      }

      stop() {
        this.userWantsActive = false;
        if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
        this.cleanUp();
        this.setState('disconnected');
      }

      cleanUp() {
        if (this.audioStreamer) {
          this.audioStreamer.stop();
          this.audioStreamer = null;
        }
        if (this.audioPlayer) {
          this.audioPlayer.stop();
        }
        if (this.ws) {
          try { this.ws.close(); } catch (e) {}
          this.ws = null;
        }
      }

      getMicVolume() {
        return this.audioStreamer ? this.audioStreamer.getVolume() : 0;
      }

      getSpeakerVolume() {
        return this.audioPlayer ? this.audioPlayer.getVolume() : 0;
      }
    }

    // --- ORB & VOICE CANVAS VISUALIZER ---
    const OrbVisualizer = ({ state, micVolume, speakerVolume, onClick }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let angle = 0;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const baseRadius = Math.min(centerX, centerY) * 0.42;

          angle += 0.025;

          let primaryColor = '#8b5cf6';
          let secondaryColor = '#06b6d4';
          let glowIntensity = 20;

          if (state === 'disconnected') {
            primaryColor = '#64748b';
            secondaryColor = '#ef4444';
            glowIntensity = 10;
          } else if (state === 'connecting') {
            primaryColor = '#06b6d4';
            secondaryColor = '#3b82f6';
            glowIntensity = 25;
          } else if (state === 'listening') {
            primaryColor = '#10b981';
            secondaryColor = '#06b6d4';
            glowIntensity = 30 + (micVolume * 45);
          } else if (state === 'speaking') {
            primaryColor = '#d946ef';
            secondaryColor = '#ec4899';
            glowIntensity = 35 + (speakerVolume * 55);
          }

          // Rotating dash ring
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.arc(0, 0, baseRadius + 24, 0, Math.PI * 2);
          ctx.strokeStyle = primaryColor;
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 14]);
          ctx.stroke();
          ctx.restore();

          // Waveform
          const activeVol = state === 'speaking' ? speakerVolume : (state === 'listening' ? micVolume : 0.05);
          const points = 64;
          ctx.beginPath();
          for (let i = 0; i <= points; i++) {
            const theta = (i / points) * Math.PI * 2;
            const distortion = Math.sin(theta * 7 + angle * 4) * (activeVol * 30);
            const r = baseRadius + distortion;
            const x = centerX + r * Math.cos(theta);
            const y = centerY + r * Math.sin(theta);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fillStyle = primaryColor + '22';
          ctx.fill();
          ctx.strokeStyle = primaryColor;
          ctx.lineWidth = 3;
          ctx.shadowBlur = glowIntensity;
          ctx.shadowColor = primaryColor;
          ctx.stroke();

          // Core Orb
          const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, baseRadius);
          gradient.addColorStop(0, '#ffffff');
          gradient.addColorStop(0.3, secondaryColor);
          gradient.addColorStop(0.8, primaryColor);
          gradient.addColorStop(1, 'transparent');

          ctx.beginPath();
          ctx.arc(centerX, centerY, baseRadius * 0.82, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.shadowBlur = glowIntensity * 1.5;
          ctx.shadowColor = secondaryColor;
          ctx.fill();

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }, [state, micVolume, speakerVolume]);

      return (
        <div className="relative flex items-center justify-center cursor-pointer group" onClick={onClick}>
          <canvas 
            ref={canvasRef} 
            width={340} 
            height={340} 
            className="w-[280px] h-[280px] sm:w-[340px] sm:h-[340px] transition-transform duration-300 group-hover:scale-105"
          />
          <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            {state === 'disconnected' && (
              <div className="flex flex-col items-center animate-pulse">
                <svg className="w-12 h-12 text-slate-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span className="text-xs uppercase tracking-widest text-slate-400 font-medium">TAP TO START VOICE CALL</span>
              </div>
            )}
            {state === 'connecting' && (
              <div className="flex flex-col items-center">
                <svg className="w-10 h-10 text-cyan-400 animate-spin mb-1" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <span className="text-xs uppercase tracking-widest text-cyan-300 font-semibold">CONNECTING...</span>
              </div>
            )}
            {state === 'listening' && (
              <div className="flex flex-col items-center">
                <span className="relative flex h-4 w-4 mb-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-4 w-4 bg-emerald-500"></span>
                </span>
                <span className="text-xs uppercase tracking-widest text-emerald-300 font-bold">LISTENING...</span>
              </div>
            )}
            {state === 'speaking' && (
              <div className="flex flex-col items-center">
                <div className="flex items-center space-x-1 mb-2">
                  <span className="w-1.5 h-6 bg-fuchsia-400 animate-bounce rounded-full" style={{ animationDelay: '0ms' }}></span>
                  <span className="w-1.5 h-8 bg-fuchsia-400 animate-bounce rounded-full" style={{ animationDelay: '150ms' }}></span>
                  <span className="w-1.5 h-5 bg-fuchsia-400 animate-bounce rounded-full" style={{ animationDelay: '300ms' }}></span>
                </div>
                <span className="text-xs uppercase tracking-widest text-fuchsia-300 font-bold">ZOYA SPEAKING</span>
                <span className="text-[10px] text-slate-400 mt-1">(Speak to Interrupt)</span>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- MAIN REACT APP ---
    const App = () => {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('ZOYA_API_KEY') || '');
      const [sessionState, setSessionState] = useState('disconnected');
      const [showSettings, setShowSettings] = useState(false);
      const [actionToast, setActionToast] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);
      const [micVolume, setMicVolume] = useState(0);
      const [speakerVolume, setSpeakerVolume] = useState(0);

      const liveSessionRef = useRef(null);
      const animFrameRef = useRef(null);

      useEffect(() => {
        const updateVolumes = () => {
          if (liveSessionRef.current) {
            setMicVolume(liveSessionRef.current.getMicVolume());
            setSpeakerVolume(liveSessionRef.current.getSpeakerVolume());
          }
          animFrameRef.current = requestAnimationFrame(updateVolumes);
        };
        updateVolumes();
        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, []);

      const handleSaveKey = (newKey) => {
        const trimmed = newKey.trim();
        setApiKey(trimmed);
        localStorage.setItem('ZOYA_API_KEY', trimmed);
        setShowSettings(false);
        setErrorMessage(null);
      };

      const startSession = async () => {
        if (!apiKey) {
          setShowSettings(true);
          setErrorMessage("Enter your Gemini API Key to start Zoya.");
          return;
        }

        setErrorMessage(null);
        liveSessionRef.current = new LiveSession(apiKey, {
          onStateChange: (newState) => {
            setSessionState(newState);
          },
          onAction: (actionData) => {
            setActionToast(actionData);
            setTimeout(() => setActionToast(null), 5000);
          },
          onError: (err) => {
            setErrorMessage(err);
          }
        });

        await liveSessionRef.current.start();
      };

      const stopSession = () => {
        if (liveSessionRef.current) {
          liveSessionRef.current.stop();
          liveSessionRef.current = null;
        }
        setSessionState('disconnected');
      };

      const toggleSession = () => {
        if (sessionState === 'disconnected') {
          startSession();
        } else {
          stopSession();
        }
      };

      return (
        <div className="relative min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 bg-grid-pattern overflow-hidden">
          {/* Ambient Background */}
          <div className="absolute -top-32 -left-32 w-80 h-80 bg-fuchsia-600/20 rounded-full blur-[100px] pointer-events-none"></div>
          <div className="absolute -bottom-32 -right-32 w-80 h-80 bg-cyan-600/20 rounded-full blur-[100px] pointer-events-none"></div>

          {/* HEADER */}
          <header className="w-full max-w-2xl flex items-center justify-between z-10 pt-2">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-fuchsia-500 to-cyan-400 p-[2px] shadow-lg shadow-fuchsia-500/20">
                <div className="w-full h-full bg-[#0a0f24] rounded-[10px] flex items-center justify-center">
                  <span className="font-black text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-cyan-300 text-lg">Z</span>
                </div>
              </div>
              <div>
                <h1 className="font-bold text-lg sm:text-xl tracking-tight text-white flex items-center gap-2">
                  ZOYA AI
                  <span className="text-[10px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded-full bg-fuchsia-500/20 border border-fuchsia-500/40 text-fuchsia-300">
                    VOICE ACTIVE
                  </span>
                </h1>
                <p className="text-xs text-slate-400">Real-Time Voice Assistant</p>
              </div>
            </div>

            <button
              onClick={() => setShowSettings(true)}
              className="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition backdrop-blur-md"
              title="API Key Settings"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
              </svg>
            </button>
          </header>

          {/* MAIN SCREEN */}
          <main className="w-full max-w-lg flex-1 flex flex-col items-center justify-center my-auto z-10 py-6">
            <OrbVisualizer 
              state={sessionState} 
              micVolume={micVolume} 
              speakerVolume={speakerVolume} 
              onClick={toggleSession} 
            />

            {errorMessage && (
              <div className="mt-4 px-4 py-2.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs text-center max-w-xs">
                {errorMessage}
              </div>
            )}

            {actionToast && (
              <div className="mt-6 w-full max-w-xs bg-slate-900/90 border border-cyan-500/40 rounded-2xl p-4 shadow-xl backdrop-blur-md animate-float flex items-start space-x-3 glow-cyan">
                <div className="p-2 rounded-xl bg-cyan-500/20 text-cyan-400 mt-0.5">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                </div>
                <div className="flex-1 min-w-0">
                  <h4 className="text-xs font-bold text-cyan-300 uppercase tracking-wider">{actionToast.title}</h4>
                  <p className="text-xs text-slate-300 truncate mt-0.5">{actionToast.detail}</p>
                </div>
              </div>
            )}

            <div className="mt-8 grid grid-cols-2 gap-2 text-center w-full max-w-xs">
              <div className="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/80 text-[11px] text-slate-400">
                🚀 <span className="text-slate-300">"Open WhatsApp / YouTube / Settings"</span>
              </div>
              <div className="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/80 text-[11px] text-slate-400">
                💬 <span className="text-slate-300">"Send WhatsApp msg to +91..."</span>
              </div>
              <div className="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/80 text-[11px] text-slate-400">
                📞 <span className="text-slate-300">"Call +1234567890"</span>
              </div>
              <div className="p-2.5 rounded-xl bg-slate-900/40 border border-slate-800/80 text-[11px] text-slate-400">
                🗣️ <span className="text-slate-300">"Real voice responses & barge-in"</span>
              </div>
            </div>
          </main>

          {/* FOOTER ACTION BUTTON */}
          <footer className="w-full max-w-md flex flex-col items-center justify-center z-10 pb-2">
            <button
              onClick={toggleSession}
              className={`w-full py-4 rounded-2xl font-bold text-sm tracking-widest uppercase transition-all duration-300 shadow-2xl flex items-center justify-center space-x-2 ${
                sessionState === 'disconnected'
                  ? 'bg-gradient-to-r from-fuchsia-600 to-cyan-500 text-white hover:opacity-95 glow-magenta'
                  : 'bg-red-500/20 border border-red-500/50 text-red-300 hover:bg-red-500/30 glow-red'
              }`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
              </svg>
              <span>{sessionState === 'disconnected' ? 'START ZOYA VOICE CALL' : 'DISCONNECT VOICE SESSION'}</span>
            </button>
            <p className="text-[10px] text-slate-500 mt-3 text-center">
              Gemini Live API • Real-Time Voice-to-Voice Interaction
            </p>
          </footer>

          {/* SETTINGS MODAL */}
          {showSettings && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md bg-[#0a0f24] border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
                <button 
                  onClick={() => setShowSettings(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white p-2"
                >
                  ✕
                </button>

                <div className="flex items-center space-x-3 mb-4">
                  <div className="p-2.5 rounded-xl bg-fuchsia-500/10 border border-fuchsia-500/30 text-fuchsia-400">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-white">Gemini API Key</h3>
                    <p className="text-xs text-slate-400">Required for Live Session API access</p>
                  </div>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
                      Enter Gemini API Key
                    </label>
                    <input
                      type="password"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-600 text-sm focus:outline-none focus:border-fuchsia-500 transition"
                    />
                  </div>

                  <div className="flex items-center justify-between text-xs pt-1">
                    <a 
                      href="https://aistudio.google.com/app/apikey" 
                      target="_blank" 
                      rel="noreferrer"
                      className="text-cyan-400 hover:underline flex items-center space-x-1"
                    >
                      <span>Get free API Key from Google AI Studio</span>
                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                    </a>
                  </div>

                  <button
                    onClick={() => handleSaveKey(apiKey)}
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-fuchsia-600 to-cyan-500 font-bold text-xs uppercase tracking-wider text-white hover:opacity-90 transition shadow-lg"
                  >
                    Save Key & Connect
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
